name: CI — build & test (.NET 10)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest   # هدف دیپلوی IIS ویندوز است (D-09)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --nologo

      - name: Publish artifact (IIS-ready)
        run: dotnet publish src/WorldOfGames.Web -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: world-of-games-iis
          path: publish/
