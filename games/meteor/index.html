<body data-cat="arcade" data-slug="meteor" data-flag3d="0" style="--g1:#d9a441;--g2:#e26d5c;--g1a:rgba(217,164,65,0.30);--g2a:rgba(226,109,92,0.42);--g1b:#e26d5c">

<header><h1>شهاب‌سنگ</h1><div class="hud" id="hud"></div></header>

<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC=(function(){
var W=480,H=360,PW=52,TOP=H-30,BOT=H-10,PS=260;
function intervalAt(t){return Math.max(0.28,1.1-t*0.011)}
function speedAt(t){return 120+t*2.2}
function newState(rng){rng=rng||Math.random;return{t:0,px:W/2,meteors:[],picks:[],hits:0,shield:0,spawn:0,pickT:4,crystals:0,over:false}}
function inBox(s,m){return Math.abs(m.x-s.px)<=PW/2+m.r&&m.y+m.r>=TOP&&m.y-m.r<=BOT}
function shieldActive(s){return s.shield>0}
function hitShip(s){if(shieldActive(s))return false;for(var i=0;i<s.meteors.length;i++)if(inBox(s,s.meteors[i]))return true;return false}
function collect(s){var n=0;for(var i=s.picks.length-1;i>=0;i--){var p=s.picks[i];if(Math.abs(p.x-s.px)<=PW/2+10&&p.y+10>=TOP&&p.y-10<=BOT){if(p.kind==='s')s.shield=3;else s.crystals++;s.picks.splice(i,1);n++}}return n}
function step(s,dt,dir,rng){rng=rng||Math.random;s.t+=dt;s.px+=dir*PS*dt;if(s.px<PW/2)s.px=PW/2;if(s.px>W-PW/2)s.px=W-PW/2;
 if(!s.over){s.spawn+=dt;var iv=intervalAt(s.t);while(s.spawn>=iv){s.spawn-=iv;s.meteors.push({x:rng()*W,y:-16,r:9+rng()*9,vy:speedAt(s.t)*(0.8+rng()*0.5),vx:(rng()-0.5)*50})}
 s.pickT-=dt;if(s.pickT<=0){s.pickT=6+rng()*3;s.picks.push({x:30+rng()*(W-60),y:-14,vy:110,kind:rng()<0.7?'c':'s'})}}
 var i,m;for(i=s.meteors.length-1;i>=0;i--){m=s.meteors[i];m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.y>H+40||m.x<-70||m.x>W+70)s.meteors.splice(i,1)}
 for(i=s.picks.length-1;i>=0;i--){m=s.picks[i];m.y+=m.vy*dt;if(m.y>H+30)s.picks.splice(i,1)}
 collect(s);
 if(s.shield>0){s.shield-=dt;if(s.shield<0)s.shield=0}
 if(!s.over&&hitShip(s)){var keep=[],k;for(k=0;k<s.meteors.length;k++){var mm=s.meteors[k];if(inBox(s,mm))s.hits++;else keep.push(mm)}s.meteors=keep;if(s.hits>=3)s.over=true}
 return s}
function scoreOf(s){return Math.floor(s.t)*10+s.crystals*25}
return{newState:newState,step:step,hitShip:hitShip,collect:collect,shieldActive:shieldActive,scoreOf:scoreOf,intervalAt:intervalAt,speedAt:speedAt,inBox:inBox,W:W,H:H,PW:PW,TOP:TOP,BOT:BOT}})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
function makeCanvas(w,h){var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.style.width='min(96vw,'+w+'px)';cv.style.height='auto';document.getElementById('app').appendChild(cv);return{cv:cv,ctx:cv.getContext('2d'),w:w,h:h}}
function keyState(){var k={};addEventListener('keydown',function(e){k[e.code]=1;if(/^(Arrow|Space)/.test(e.code))e.preventDefault()});addEventListener('keyup',function(e){k[e.code]=0});return k}
function bindPad(defs){var d=ce('div','wdpad');var grid={};defs.forEach(function(x){grid[x.k]=x});var cell=function(k){var b;if(k&&grid[k]){b=ce('button',null,grid[k].label);b.setAttribute('data-k',k)}else{b=ce('span');b.style.visibility='hidden'}d.appendChild(b)};cell(defs.length>2?defs[1].k:null);defs.forEach(function(x){cell(x.k)});cell(null);document.getElementById('app').appendChild(d);$$('[data-k]').forEach(function(b){var k=b.getAttribute('data-k');function on(e){e.preventDefault();ks[k]=1}function off(e){e.preventDefault();ks[k]=0}b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off)})}
function rafStep(fn){var last=performance.now();function f(t){var dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}

var cv=makeCanvas(480,360),ctx=cv.ctx;
var s=L.newState(),ended=false;
function best(v){var k='wog-meteor-best',o=parseInt(store.get(k)||'0',10)||0;if(v>o){o=v;store.set(k,''+v)}return o}
function reset(){s=L.newState();ended=false}
var nb=ce('button','wbtn','بازی جدید');nb.setAttribute('data-smoke','1');nb.onclick=reset;$('#app').appendChild(nb);
var keys=keyState();
bindPad([{k:'ArrowLeft',label:'◀'},{k:'ArrowRight',label:'▶'}]);
var stars=[],i;for(i=0;i<40;i++)stars.push({x:Math.random()*L.W,y:Math.random()*(L.H-80),a:0.25+Math.random()*0.6});
$('#hint').textContent='با فلش‌ها یا دکمه‌های لمسی حرکت کن؛ از شهاب‌ها فرار کن، بلور فیروزه‌ای ۲۵+ امتیاز و سپر طلایی ۳ ثانیه محافظت می‌کند. سه برخورد = پایان.';
function render(){var m,i;
 var mg=ctx.createLinearGradient(0,0,0,L.H);mg.addColorStop(0,'#0a0e24');mg.addColorStop(.6,'#141031');mg.addColorStop(1,'#221233');ctx.fillStyle=mg;ctx.fillRect(0,0,L.W,L.H);var ng=ctx.createRadialGradient(L.W*.7,110,8,L.W*.7,110,190);ng.addColorStop(0,'rgba(226,109,92,.16)');ng.addColorStop(1,'rgba(226,109,92,0)');ctx.fillStyle=ng;ctx.fillRect(0,0,L.W,L.H);
 ctx.fillStyle='#d9a441';
 for(i=0;i<stars.length;i++){ctx.globalAlpha=stars[i].a;ctx.fillRect(stars[i].x,stars[i].y,2,2)}
 ctx.globalAlpha=1;
 for(i=0;i<s.picks.length;i++){m=s.picks[i];
  if(m.kind==='s'){ctx.strokeStyle='#d9a441';ctx.lineWidth=2;ctx.beginPath();ctx.arc(m.x,m.y,9,0,6.3);ctx.stroke();ctx.fillStyle='#d9a441';ctx.fillRect(m.x-3,m.y-3,6,6)}
  else{ctx.fillStyle='#3fb8af';ctx.beginPath();ctx.moveTo(m.x,m.y-9);ctx.lineTo(m.x+7,m.y);ctx.lineTo(m.x,m.y+9);ctx.lineTo(m.x-7,m.y);ctx.closePath();ctx.fill()}}
 for(i=0;i<s.meteors.length;i++){m=s.meteors[i];ctx.fillStyle='#e26d5c';ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,6.3);ctx.fill();ctx.fillStyle='#8c3b30';ctx.beginPath();ctx.arc(m.x-m.r*0.3,m.y-m.r*0.3,m.r*0.45,0,6.3);ctx.fill()}
 ctx.fillStyle='#d9a441';ctx.beginPath();ctx.moveTo(s.px,L.BOT-14);ctx.lineTo(s.px-24,L.BOT+8);ctx.lineTo(s.px+24,L.BOT+8);ctx.closePath();ctx.fill();
 if(L.shieldActive(s)&&Math.floor(s.t*8)%2===0){ctx.strokeStyle='#d9a441';ctx.lineWidth=3;ctx.beginPath();ctx.arc(s.px,L.BOT-4,34,0,6.3);ctx.stroke()}
 for(i=0;i<3;i++){ctx.beginPath();ctx.arc(16+i*20,16,7,0,6.3);ctx.fillStyle=i<s.hits?'#e26d5c':'#22304f';ctx.fill()}}
rafStep(function(dt){
 var d=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0);
 if(!ended){L.step(s,Math.min(dt,0.05),d);
  if(s.over){ended=true;var sc=L.scoreOf(s);best(sc);
   ovl('کشتی سقوط کرد!','امتیاز: '+fa(sc)+' | بلور: '+fa(s.crystals)+' | رکورد: '+fa(best(0)),'بازی جدید',reset)}}
 render();hud('امتیاز: '+fa(L.scoreOf(s))+' | رکورد: '+fa(best(0)))});
})();
</script>

var G2=new THREE.Color((cs.getPropertyValue('--g2')||'#3fb8af').trim());

b.appendChild(c);

var cam=new THREE.PerspectiveCamera(55,1,.1,160);cam.position.set(0,2.8,10);
function rs(){var w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs,{passive:true});rs();
s.add(new THREE.HemisphereLight(0x93b8e0,0x141d33,.95));
var dl=new THREE.DirectionalLight(0xe8c073,.8);dl.position.set(5,8,6);s.add(dl);
function std(cc,e){var m=new THREE.MeshStandardMaterial({color:cc,roughness:.38,metalness:.3});if(e){m.emissive=new THREE.Color(e);m.emissiveIntensity=.45}return m}
var items=[],rnd=Math.random;
function put(g,x,y,z){g.position.set(x,y,z);g.userData={rx:(rnd()-.5)*.02,ry:(rnd()-.5)*.03,ph:rnd()*6.28,sp:.4+rnd()*.7};s.add(g);items.push(g);return g}
var i,m;
if(cat==='board'){
 var fl=new THREE.Mesh(new THREE.PlaneGeometry(28,28),new THREE.MeshStandardMaterial({color:0x101a30,roughness:.9,metalness:.1}));fl.rotation.x=-Math.PI/2;fl.position.y=-2.6;s.add(fl);
 var gr=new THREE.GridHelper(28,14,0x3fb8af,0x24406b);gr.material.transparent=true;gr.material.opacity=.32;gr.position.y=-2.58;s.add(gr);
 var cg=new THREE.CylinderGeometry(1,1.06,.4,28);
 for(i=0;i<14;i++){m=new THREE.Mesh(cg,std(i%2?0x1c2a4a:0xe8c073));m.scale.setScalar(.5+rnd()*.5);put(m,(rnd()-.5)*16,rnd()*6-1,(rnd()-.5)*10-3)}
}else if(cat==='cards'){
 var fg=new THREE.BoxGeometry(2.1,.05,3);
 for(i=0;i<16;i++){m=new THREE.Mesh(fg,std(0x1d2a4a,0xd9a441));m.rotation.set((rnd()-.5)*.9,(rnd()-.5)*1.2,(rnd()-.5)*.5);put(m,(rnd()-.5)*15,rnd()*7-1.5,(rnd()-.5)*9-3)}
 var felt=new THREE.Mesh(new THREE.PlaneGeometry(32,32),new THREE.MeshStandardMaterial({color:0x0f2230,roughness:.95}));felt.rotation.x=-Math.PI/2;felt.position.y=-3.2;s.add(felt)
}else if(cat==='puzzle'){
 var ico=new THREE.Mesh(new THREE.IcosahedronGeometry(3.1,0),new THREE.MeshBasicMaterial({color:0xd9a441,wireframe:true,transparent:true,opacity:.28}));put(ico,0,1.8,-4);
 var tg=new THREE.BoxGeometry(1.5,.24,1.5);
 for(i=0;i<12;i++){m=new THREE.Mesh(tg,std(i%2?0x20304f:0xe8c073,0x3fb8af));m.rotation.y=rnd()*3.14;put(m,(rnd()-.5)*14,rnd()*6-1,(rnd()-.5)*9-3)}
}else if(cat==='arcade'){
 var n=420,pos=new Float32Array(n*3);
 for(i=0;i<n;i++){pos[i*3]=(rnd()-.5)*46;pos[i*3+1]=(rnd()-.5)*28;pos[i*3+2]=(rnd()-.5)*30-4}
 var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
 s.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xcfe0ff,size:.09,transparent:true,opacity:.85})));
 var rg=new THREE.DodecahedronGeometry(.9,0);
 for(i=0;i<10;i++){m=new THREE.Mesh(rg,std(0x2a3a5e,0x3fb8af));m.scale.setScalar(.5+rnd());put(m,(rnd()-.5)*18,rnd()*8-2,(rnd()-.5)*10-5)}
}else if(cat==='word'){
 var LT=['ا','ب','پ','ت','س','ش','د','ن','م','ی','و','ک'];
 function ltex(ch){var cv=document.createElement('canvas');cv.width=cv.height=128;var x=cv.getContext('2d');x.fillStyle='#16233f';x.fillRect(0,0,128,128);x.strokeStyle='rgba(217,164,65,.8)';x.lineWidth=6;x.strokeRect(4,4,120,120);x.fillStyle='#e8c073';x.font='bold 78px Tahoma';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,64,70);return new THREE.CanvasTexture(cv)}
 var wm=LT.map(function(ch){return new THREE.MeshStandardMaterial({map:ltex(ch),roughness:.5})});
 var wg=new THREE.BoxGeometry(1.35,1.35,.22);
 for(i=0;i<14;i++){m=new THREE.Mesh(wg,wm[i%wm.length]);put(m,(rnd()-.5)*15,rnd()*7-1.5,(rnd()-.5)*9-3)}
}else{
 function pipTex(){var cv=document.createElement('canvas');cv.width=cv.height=128;var x=cv.getContext('2d');x.fillStyle='#f3ead8';x.fillRect(0,0,128,128);x.fillStyle='#1c2438';var P=[[40,40],[88,40],[40,88],[88,88],[64,64]];for(var j=0;j<P.length;j++){x.beginPath();x.arc(P[j][0],P[j][1],9,0,6.29);x.fill()}return new THREE.CanvasTexture(cv)}
 var dm=new THREE.MeshStandardMaterial({map:pipTex(),roughness:.35});
 var dg=new THREE.BoxGeometry(1.5,1.5,1.5);
 for(i=0;i<9;i++){m=new THREE.Mesh(dg,dm);put(m,(rnd()-.5)*13,rnd()*6-1,(rnd()-.5)*8-3)}
 var ring=new THREE.Mesh(new THREE.TorusGeometry(4.6,.06,10,60),std(0xd9a441,0xd9a441));ring.rotation.x=Math.PI/2.2;put(ring,0,1.2,-5)
}
var mx=0,my=0;
addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
var app=document.getElementById('app');
var rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(_){ }
var hid=false;document.addEventListener('visibilitychange',function(){hid=document.hidden});
function draw1(){cam.lookAt(0,1.2,0);r.render(s,cam)}
if(rm){draw1();return}
document.addEventListener('visibilitychange',function(){if(!document.hidden){rs()}});
var t=0,lx=99,ly=99;
function frame(){
 requestAnimationFrame(frame);
 if(hid)return;
 t+=.016;
 cam.position.x+=((mx*2.2)-cam.position.x)*.04;
 cam.position.y+=((2.8-my*1.4)-cam.position.y)*.04;
 for(var i2=0;i2<items.length;i2++){var mm=items[i2],u=mm.userData;
  mm.rotation.x+=u.rx;mm.rotation.y+=u.ry;
  mm.position.y+=Math.sin(t*u.sp+u.ph)*.0016}
 if(cat!=='arcade'&&app){
  var ax=(mx*3.2).toFixed(2),ay=(1.6-my*3).toFixed(2);
  if(ax!==lx||ay!==ly){lx=ax;ly=ay;app.style.transform='perspective(1100px) rotateX('+ay+'deg) rotateY('+ax+'deg)'}
 }
 r.render(s,cam);
}
frame();
}catch(e){}})();</script>
</body>
</html>
