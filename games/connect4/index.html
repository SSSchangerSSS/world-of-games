<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC=(function(){
'use strict';
function initial(){var b=[],r,c;for(r=0;r<6;r++){b.push([]);for(c=0;c<7;c++)b[r].push(0);}return {b:b,n:0};}
function drop(st,col,p){if(col<0||col>6)return -1;var r;for(r=5;r>=0;r--)if(st.b[r][col]===0){st.b[r][col]=p;st.n=(st.n||0)+1;return r;}return -1;}
function full(st,col){return st.b[0][col]!==0;}
function winAtB(b,r,c){
  var p=b[r][c];if(!p)return false;
  var D=[[0,1],[1,0],[1,1],[1,-1]],i,d,k,cnt;
  for(i=0;i<4;i++){d=D[i];cnt=1;
    for(k=1;k<4;k++){var r1=r+d[0]*k,c1=c+d[1]*k;if(r1>=0&&r1<6&&c1>=0&&c1<7&&b[r1][c1]===p)cnt++;else break;}
    for(k=1;k<4;k++){var r2=r-d[0]*k,c2=c-d[1]*k;if(r2>=0&&r2<6&&c2>=0&&c2<7&&b[r2][c2]===p)cnt++;else break;}
    if(cnt>=4)return true;}
  return false;
}
function winAt(st,r,c){return winAtB(st.b,r,c);}
function ws(a,h){if(a===4)return 1e5;if(h===4)return -1e5;if(a&&h)return 0;if(a===3)return 60;if(a===2)return 10;if(a===1)return 1;if(h===3)return -75;if(h===2)return -12;if(h===1)return -1;return 0;}
function evalBoard(b){
  var s=0,r,c,i,a,h,v;
  for(r=0;r<6;r++)for(c=0;c<4;c++){a=0;h=0;for(i=0;i<4;i++){v=b[r][c+i];if(v===1)a++;else if(v===-1)h++;}s+=ws(a,h);}
  for(c=0;c<7;c++)for(r=0;r<3;r++){a=0;h=0;for(i=0;i<4;i++){v=b[r+i][c];if(v===1)a++;else if(v===-1)h++;}s+=ws(a,h);}
  for(r=0;r<3;r++)for(c=0;c<4;c++){
    a=0;h=0;for(i=0;i<4;i++){v=b[r+i][c+i];if(v===1)a++;else if(v===-1)h++;}s+=ws(a,h);
    a=0;h=0;for(i=0;i<4;i++){v=b[r+i][c+3-i];if(v===1)a++;else if(v===-1)h++;}s+=ws(a,h);}
  for(r=0;r<6;r++)for(c=0;c<7;c++){v=b[r][c];if(v===1)s+=(3-Math.abs(c-3))*2;else if(v===-1)s-=(3-Math.abs(c-3))*2;}
  return s;
}
var COLS=[3,2,4,1,5,0,6];
function lowest(b,c){var r;for(r=5;r>=0;r--)if(b[r][c]===0)return r;return -1;}
function search(b,depth,a,bta,pl){
  var best=-1e9,any=false,i,c,r,sc;
  for(i=0;i<7;i++){
    c=COLS[i];if(b[0][c]!==0)continue;any=true;
    r=lowest(b,c);
    b[r][c]=pl;
    if(winAtB(b,r,c)){b[r][c]=0;return 1e6+depth;}
    if(depth<=1)sc=pl>0?evalBoard(b):-evalBoard(b);
    else sc=-search(b,depth-1,-bta,-a,-pl);
    b[r][c]=0;
    if(sc>best)best=sc;
    if(best>a)a=best;
    if(a>=bta)break;
  }
  return any?best:0;
}
function aiMove(st,rng,pl){
  if(pl===undefined)pl=-1;
  var b=st.b,alpha=-1e9,bestS=-1e9,bestC=-1,i,c,r,sc;
  if(st.n===0)return 3;
  for(i=0;i<7;i++){
    c=COLS[i];if(b[0][c]!==0)continue;
    r=lowest(b,c);
    b[r][c]=pl;
    if(winAtB(b,r,c)){b[r][c]=0;return c;}
    sc=-search(b,3,-1e9,-alpha,-pl);
    b[r][c]=0;
    if(sc>bestS){bestS=sc;bestC=c;}
    if(sc>alpha)alpha=sc;
  }
  return bestC;
}
return {initial:initial,drop:drop,full:full,winAt:winAt,aiMove:aiMove,evalBoard:evalBoard};
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}

var st=L.initial(),turn=1,over=false,busy=false;
var P=1.04,FRZ=.1;
var renderer=null,scene=null,camera=null,stage=null,cv=null;
var discG,matTurq,matGold,winMat=null;
var discAt={},poolT=[],poolG=[],winRings=[],hoverBox=null;
var theta=0,phi=1.14,Rr=10.8,drag=false,dragMoved=false,lx=0,ly=0,tt=0,lastT=0;
var anims=[],ray=null;
function fallback3d(){
  var d=ce('div','fail3d');
  d.innerHTML='<div class="fbox"><h2>سه‌بعدی در دسترس نیست</h2><p>مرورگر شما از WebGL پشتیبانی نمی‌کند یا آن غیرفعال است؛ لطفاً مرورگر را به‌روز کنید.</p></div>';
  $('#app').appendChild(d);
}
function makeDisc(isG){
  var m=new THREE.Mesh(discG,isG?matGold:matTurq);
  m.userData={isG:isG,cell:-1};
  scene.add(m);return m;
}
function retireDisc(m){
  scene.remove(m);m.userData.cell=-1;
  (m.userData.isG?poolG:poolT).push(m);
}
function takeDisc(v){
  var isG=v<0,pool=isG?poolG:poolT,m=pool.pop();
  if(!m)m=makeDisc(isG);
  m.userData.cell=-1;m.scale.setScalar(1);
  return m;
}
function dropDisc(m,r,c){
  var tx=(c-3)*P,ty=(2.5-r)*P,tz=FRZ+.14,y0=5.4;
  m.position.set(tx,y0,tz);
  anims.push({t:0,dur:.4,fn:function(k){m.position.y=y0-(y0-ty)*k*k;},done:function(){
    anims.push({t:0,dur:.22,fn:function(k){m.position.y=ty+Math.sin(k*Math.PI)*.17*(1-k);},done:function(){m.position.y=ty;}});
  }});
}
function render(winCells){
  winCells=winCells||[];
  if(renderer){
    var r,c;
    for(r=0;r<6;r++)for(c=0;c<7;c++){
      var k=r*7+c,v=st.b[r][c],m=discAt[k];
      if(v&&!m){
        m=takeDisc(v);m.userData.cell=k;discAt[k]=m;
        dropDisc(m,r,c);
      }else if(!v&&m){retireDisc(m);delete discAt[k];}
    }
    for(var i=0;i<winRings.length;i++)winRings[i].visible=false;
    for(i=0;i<winCells.length&&i<winRings.length;i++){
      var w=winCells[i];
      winRings[i].visible=true;
      winRings[i].position.set((w[1]-3)*P,(2.5-w[0])*P,FRZ+.24);
    }
  }
  document.getElementById('c4-mv').innerHTML='حرکت '+fa(st.n);
}
function winCellsUI(r,c){
  var p=st.b[r][c],D=[[0,1],[1,0],[1,1],[1,-1]],i,d,k,cells,rr,cc;
  for(i=0;i<4;i++){d=D[i];cells=[[r,c]];

function pickCol(cx,cy){
  var rect=cv.getBoundingClientRect();
  var nx=((cx-rect.left)/rect.width)*2-1,ny=-((cy-rect.top)/rect.height)*2+1;

  var arr=[],k;
  for(k in discAt)arr.push(discAt[k]);
  if(arr.length){
    var hits=ray.intersectObjects(arr,false);
    if(hits.length)return hits[0].object.userData.cell%7;
  }
  var d=ray.ray.direction,o=ray.ray.origin;
  if(d.z>-.0001)return -1;
  var t=(FRZ-o.z)/d.z;
  var c=Math.round((o.x+d.x*t)/P+3);

}
