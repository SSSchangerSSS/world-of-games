<body data-cat="puzzle" data-slug="hanoi" data-flag3d="0" style="--g1:#d9a441;--g2:#7a5220;--g1a:rgba(217,164,65,0.30);--g2a:rgba(122,82,32,0.42);--g1b:#7a5220">

<header><h1>برج هانوی</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC = (function () {
  function initial(n) {
    var a = [], i;
    for (i = n; i >= 1; i--) a.push(i);
    return [a, [], []];
  }
  function move(state, from, to) {
    if (from === to) return false;
    if (from < 0 || from > 2 || to < 0 || to > 2) return false;
    if (!state[from].length) return false;
    if (state[to].length && state[to][state[to].length - 1] < state[from][state[from].length - 1]) return false;
    state[to].push(state[from].pop());
    return true;
  }
  function isSolved(state, n) {
    var t = state[2];
    if (t.length !== n) return false;
    for (var i = 0; i < n; i++) if (t[i] !== n - i) return false;
    return true;
  }
  function optimal(n) { return Math.pow(2, n) - 1; }
  function rec(n, from, to, via, out) {
    if (n <= 0) return;
    rec(n - 1, from, via, to, out);
    out.push({ from: from, to: to });
    rec(n - 1, via, to, from, out);
  }
  function solveSeq(n) {
    var out = [];
    rec(n, 0, 2, 1, out);
    return out;
  }
  return { initial: initial, move: move, isSolved: isSolved, optimal: optimal, solveSeq: solveSeq };
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}

var n = 3, st, sel = -1, moves = 0, busy = false;
function diskW(d) { return 24 + d * 11; }
function newGame(k) {
  n = k; st = L.initial(n); sel = -1; moves = 0; busy = false;
  store.set('wog-hanoi-n', String(n));
  render();
}
function render() {
  var app = $('#app');
  app.innerHTML = '';
  var wrap = ce('div', 'h-wrap');
  for (var t = 0; t < 3; t++) {
    (function (t) {
      var col = ce('div', 'h-col' + (sel === t ? ' h-sel' : ''));
      var disks = ce('div', 'h-disks');
      for (var i = 0; i < st[t].length; i++) {
        var d = ce('div', 'h-disk');
        d.style.width = diskW(st[t][i]) + 'px';
        disks.appendChild(d);
      }
      col.appendChild(disks);
      col.appendChild(ce('div', 'h-pole'));
      col.appendChild(ce('div', 'h-base'));
      col.appendChild(ce('div', 'h-label', 'برج ' + fa(t + 1)));
      col.addEventListener('click', function () { tapTower(t); });
      wrap.appendChild(col);
    })(t);
  }
  app.appendChild(wrap);
  var bar = ce('div', 'p-bar');
  var nb = ce('button', 'btn', 'بازی جدید');
  nb.setAttribute('data-smoke', '1');
  nb.addEventListener('click', function () { newGame(n); });
  bar.appendChild(nb);
  var sb = ce('button', 'btn p-gold', 'حل خودکار');
  sb.addEventListener('click', autoSolve);
  bar.appendChild(sb);
  bar.appendChild(ce('span', 'p-lbl', 'تعداد دیسک:'));
  for (var k = 3; k <= 7; k++) {
    (function (k) {
      var b = ce('button', 'btn' + (k === n ? ' p-on' : ''), fa(k));
      b.addEventListener('click', function () { if (!busy) newGame(k); });
      bar.appendChild(b);
    })(k);
  }
  app.appendChild(bar);
  hud('حرکت‌ها: ' + fa(moves) + ' · حداقل ممکن: ' + fa(L.optimal(n)));
}
function tapTower(t) {
  if (busy) return;
  if (sel === -1) {
    if (st[t].length) { sel = t; render(); }
    else toast('این برج خالی است');
    return;
  }
  if (sel === t) { sel = -1; render(); return; }
  if (L.move(st, sel, t)) {
    moves++; sel = -1; render();
    if (L.isSolved(st, n)) win();
  } else {
    toast('حرکت نامعتبر: دیسک بزرگ‌تر روی کوچک‌تر نمی‌نشیند');
  }
}
function win() {
  busy = true;
  ovl('آفرین! برج حل شد', fa(moves) + ' حرکت (بهینه: ' + fa(L.optimal(n)) + ')', 'بازی جدید', function () { newGame(n); });
}
function autoSolve() {
  if (busy) return;
  busy = true; sel = -1;
  st = L.initial(n); moves = 0;
  var seq = L.solveSeq(n), i = 0;
  render();
  var iv = setInterval(function () {
    if (i >= seq.length) { clearInterval(iv); busy = false; win(); return; }
    L.move(st, seq[i].from, seq[i].to);
    moves++; i++; render();
  }, 260);
}
newGame(parseInt(store.get('wog-hanoi-n') || '3', 10) || 3);
$('#hint').textContent = 'اول روی برج مبدأ بزن، بعد روی برج مقصد. دیسک بزرگ‌تر هرگز روی کوچک‌تر نمی‌نشیند.';
})();
</script>

 for(i=0;i<14;i++){m=new THREE.Mesh(cg,std(i%2?0x1c2a4a:0xe8c073));m.scale.setScalar(.5+rnd()*.5);put(m,(rnd()-.5)*16,rnd()*6-1,(rnd()-.5)*10-3)}
}else if(cat==='cards'){
 var fg=new THREE.BoxGeometry(2.1,.05,3);

}else if(cat==='word'){

}

 t+=.016;
 cam.position.x+=((mx*2.2)-cam.position.x)*.04;
