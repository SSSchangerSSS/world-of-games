<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
function sh(a,rng){var r=rng||Math.random,i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(r()*(i+1));t=a[i];a[i]=a[j];a[j]=t;}return a;}
function isRed(c){return c.s===1||c.s===2;}
function snap(st){st.hist.push(JSON.stringify({c:st.cas,e:st.cells,f:st.found,m:st.moves}));if(st.hist.length>300)st.hist.shift();}
function undo(st){var h=st.hist.pop();if(!h)return false;var o=JSON.parse(h);st.cas=o.c;st.cells=o.e;st.found=o.f;st.moves=o.m;return true;}
function newGame(rng){var cards=[],s,r,id=0,i,j,k=0,n;for(s=0;s<4;s++)for(r=1;r<=13;r++)cards.push({s:s,r:r,id:id++});sh(cards,rng);var cas=[];for(i=0;i<8;i++){cas.push([]);n=i<4?7:6;for(j=0;j<n;j++)cas[i].push(cards[k++]);}return{cas:cas,cells:[null,null,null,null],found:[[],[],[],[]],moves:0,hist:[]};}
function freeCells(st){var n=0,i;for(i=0;i<4;i++)if(!st.cells[i])n++;return n;}
function emptyCas(st){var n=0,i;for(i=0;i<8;i++)if(!st.cas[i].length)n++;return n;}
function maxRun(st,dest){var f=freeCells(st),e=emptyCas(st);if(dest!==null&&dest!==undefined&&!st.cas[dest].length)e--;return(1+f)*(1+e);}
function canDropCascade(run,top){if(!run||!run.length)return false;if(!top)return true;return top.r===run[0].r+1&&isRed(top)!==isRed(run[0]);}
function canFound(card,found){var f=found[card.s];if(!f.length)return card.r===1;return f[f.length-1].r===card.r-1;}
function validRun(a){var i;if(!a||!a.length)return false;for(i=0;i<a.length-1;i++){if(a[i].r!==a[i+1].r+1||isRed(a[i])===isRed(a[i+1]))return false;}return true;}
function applyMove(st,from,to){var run,i,c;
 if(!from||!to)return false;
 if(from.type==='cascade'){var pl=st.cas[from.idx],len=from.runLen||1;
  if(from.idx<0||from.idx>7||len<1||len>pl.length)return false;
  run=pl.slice(pl.length-len);
  if(!validRun(run))return false;
  if(to.type!=='cascade'&&len>1)return false;
  if(len>maxRun(st,to.type==='cascade'?to.idx:null))return false;
 }else if(from.type==='free'){
  if(to.type==='free')return false;
  c=st.cells[from.idx];if(!c)return false;run=[c];
 }else{return false;}
 if(to.type==='cascade'){
  if(from.type==='cascade'&&from.idx===to.idx)return false;
  if(to.idx<0||to.idx>7)return false;
  var d=st.cas[to.idx];
  if(!canDropCascade(run,d[d.length-1]))return false;
  if(from.type==='cascade')st.cas[from.idx].length-=run.length;else st.cells[from.idx]=null;
  for(i=0;i<run.length;i++)d.push(run[i]);
 }else if(to.type==='free'){
  var slot=-1;for(i=0;i<4;i++)if(!st.cells[i]){slot=i;break;}
  if(slot<0)return false;
  st.cas[from.idx].length-=1;st.cells[slot]=run[0];
 }else if(to.type==='foundation'){
  c=run[0];
  if(!canFound(c,st.found))return false;
  if(from.type==='cascade')st.cas[from.idx].length-=1;else st.cells[from.idx]=null;
  st.found[c.s].push(c);
 }else{return false;}
 st.moves++;
 return true;}
function autoFound(st){var n=0,again=true,i,c,t;
 while(again){again=false;
  for(i=0;i<4;i++){c=st.cells[i];if(c&&(c.r===1||c.r===2)&&canFound(c,st.found)){st.cells[i]=null;st.found[c.s].push(c);st.moves++;n++;again=true;}}
  for(i=0;i<8;i++){t=st.cas[i][st.cas[i].length-1];if(t&&(t.r===1||t.r===2)&&canFound(t,st.found)){st.cas[i].length-=1;st.found[t.s].push(t);st.moves++;n++;again=true;}}
 }
 return n;}
function founded(st){var n=0,i;for(i=0;i<4;i++)n+=st.found[i].length;return n;}
function isWin(st){return founded(st)===52;}
function hasAnyMove(st){var i,b,a,pl,d,c;
 for(i=0;i<4;i++){c=st.cells[i];if(!c)continue;
  if(canFound(c,st.found))return true;
  for(b=0;b<8;b++){d=st.cas[b];if(d.length&&canDropCascade([c],d[d.length-1]))return true;}}
 for(a=0;a<8;a++){pl=st.cas[a];if(!pl.length)continue;
  var k=1;while(k<pl.length){var x=pl[pl.length-1-k],y=pl[pl.length-k];if(x.r===y.r+1&&isRed(x)!==isRed(y))k++;else break;}
  var mr=maxRun(st,null),cap=k<mr?k:mr;
  for(var len=1;len<=cap;len++){var card=pl[pl.length-len];
   if(len===1){if(canFound(card,st.found))return true;if(freeCells(st)>0)return true;}
   for(b=0;b<8;b++){if(b===a)continue;var d2=st.cas[b];
    if(len<=maxRun(st,b)&&(!d2.length||canDropCascade(pl.slice(pl.length-len),d2[d2.length-1])))return true;}}
 }
 return false;}
var WOG_LOGIC={newGame:newGame,maxRun:maxRun,canDropCascade:canDropCascade,canFound:canFound,validRun:validRun,applyMove:applyMove,autoFound:autoFound,founded:founded,isWin:isWin,hasAnyMove:hasAnyMove,isRed:isRed,undo:undo,snap:snap};
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
var SUITS='♠♥♦♣';
function makeDeck(){var d=[];for(var s=0;s<4;s++)for(var r=1;r<=13;r++)d.push({s:s,r:r});return d}
function isRed(c){return c.s===1||c.s===2}
function suitOf(c){return SUITS[c.s]}
function rankShort(r){return r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r)}
function rankFa(r){return r===1?'آس':r===11?'سرباز':r===12?'بی‌بی':r===13?'شاه':fa(r)}
function cardEl(c,faceUp,size){var e=ce('div','wcard'+(faceUp?(isRed(c)?' red':''):' back')+(size?' '+size:''));if(faceUp)e.innerHTML='<span class="cn">'+rankShort(c.r)+suitOf(c)+'</span><span class="cv">'+suitOf(c)+'</span>';return e}
function cardStack(el,cs,faceUp,size){cs.forEach(function(c){el.appendChild(cardEl(c,faceUp,size))});return el}

var st=null,sel=null;
var SUI=['♠','♥','♦','♣'];
function rk(r){return r===1?'A':(r===11?'J':(r===12?'Q':(r===13?'K':fa(r))));}
function freeN(){var n=0,i;for(i=0;i<4;i++)if(!st.cells[i])n++;return n;}
function start(){st=L.newGame();sel=null;$('#hint').textContent='روی کارت بزن تا انتخاب شود، بعد روی مقصد. ستون‌ها نزولی و با رنگ یک‌درمیان چیده می‌شوند و آ و ۲ خودکار به بنیاد می‌روند.';render();}
function tryMove(from,to){
 L.snap(st);
 if(!L.applyMove(st,from,to)){st.hist.pop();toast('حرکت مجاز نیست');return false;}
 L.autoFound(st);sel=null;after();return true;
}
function render(){
 var app=$('#app');app.innerHTML='';
 var bar=ce('div','bar','');
 var bd=ce('button','bt','بازی جدید');
 bd.setAttribute('data-smoke','deal');bd.onclick=function(){start();};
 var bu=ce('button','bt','برگرد');
 bu.setAttribute('data-smoke','undo');bu.onclick=function(){if(L.undo(st)){sel=null;render();}else{toast('چیزی برای برگشت نیست');}};
 var bh=ce('button','bt','راهنما');
 bh.onclick=function(){ovl('راهنما','در ستون‌ها هر کارت روی کارتی یک رتبه بیشتر با رنگ مخالف می‌نشیند. یک ردیف مرتب را یکجا می‌توان جابه‌جا کرد؛ بیشینه طول آن برابر است با (خانه‌های خالی + ۱) ضرب‌در (ستون‌های خالی + ۱) و ستون مقصد اگر خالی باشد در شمارش نمی‌آید. هر خانه آزاد فقط یک کارت می‌گیرد. کارت مجاز از ستون یا خانه به بنیاد هم‌خال خودش می‌رود و آ و ۲ خودکار می‌روند. با بنیاد کردن ۵۲ کارت برنده شو.','فهمیدم',function(){});};
 bar.appendChild(bd);bar.appendChild(bu);bar.appendChild(bh);
 app.appendChild(bar);
 var top=ce('div','top','');
 for(var i=0;i<4;i++){
  (function(j){
   var c=st.cells[j];
   var cls='slot'+(c?' cd '+(L.isRed(c)?'red':''):'')+((sel&&sel.type==='free'&&sel.idx===j)?' sel':'');
   var s=ce('div',cls,c?'<b>'+rk(c.r)+'</b><i>'+SUI[c.s]+'</i>':'<span class="gh">خانه</span>');
   s.setAttribute('data-cell',j);
   s.onclick=function(){tapCell(j);};
   top.appendChild(s);
  })(i);
 }
 for(i=0;i<4;i++){
  (function(j){
   var fl=st.found[j];
   var cls='slot fnd'+(fl.length?' cd '+((j===1||j===2)?'red':''):'');
   var s=ce('div',cls,fl.length?'<b>'+rk(fl[fl.length-1].r)+'</b><i>'+SUI[j]+'</i>':'<span class="gh">'+SUI[j]+'</span>');
   s.setAttribute('data-found',j);
   s.onclick=function(){tapFound(j);};
   top.appendChild(s);
  })(i);
 }
 app.appendChild(top);
 var row=ce('div','tabs','');
 for(var p=0;p<8;p++){
  var col=ce('div','col','');
  col.setAttribute('data-cas',p);
  col.onclick=(function(q){return function(){tapCas(q,-1);};})(p);
  var pl=st.cas[p];
  var cut=(sel&&sel.type==='cascade'&&sel.idx===p)?pl.length-sel.runLen:-1;
  for(i=0;i<pl.length;i++){
   var c2=pl[i];
   var d=ce('div','cd '+(L.isRed(c2)?'red':'')+((sel&&sel.type==='cascade'&&sel.idx===p&&i>=cut)?' sel':''),'<b>'+rk(c2.r)+'</b><i>'+SUI[c2.s]+'</i>');
   d.setAttribute('data-card',p+'-'+i);
   d.onclick=(function(q,j){return function(ev){ev.stopPropagation();tapCas(q,j);};})(p,i);
   col.appendChild(d);
  }
  row.appendChild(col);
 }
 app.appendChild(row);
 hud('حرکت: '+fa(st.moves)+' — خانه آزاد: '+fa(freeN())+' — بنیاد: '+fa(L.founded(st))+' از ۵۲');
}
function tapCas(p,i){
 var pl=st.cas[p];
 if(sel){
  if(sel.type==='cascade'&&sel.idx===p){sel=null;render();return;}
  if(tryMove(sel,{type:'cascade',idx:p}))return;
  sel=null;
 }
 if(i>=0){
  var run=pl.slice(i);
  if(L.validRun(run)){sel={type:'cascade',idx:p,runLen:pl.length-i};render();return;}
  toast('این ردیف یکپارچه قابل جابه‌جایی نیست');
 }
 render();
}
function tapCell(j){
 if(sel){
  if(sel.type==='free'&&sel.idx===j){sel=null;render();return;}
  if(tryMove(sel,{type:'free',idx:j}))return;
  sel=null;render();return;
 }
 if(st.cells[j]){sel={type:'free',idx:j,runLen:1};render();}
}
function tapFound(j){
 if(sel)tryMove(sel,{type:'foundation',idx:j});
}
function after(){
 render();
 if(L.isWin(st)){ovl('آفرین! بردی','هر ۵۲ کارت روی بنیاد رفت','بازی جدید',function(){start();});return;}
 if(!L.hasAnyMove(st)){ovl('بازی تمام شد','حرکت مجازی باقی نماند','بازی جدید',function(){start();});}
}
start();
})();
</script>
<script>(function(){try{
if(typeof THREE==='undefined')return;
var b=document.body;if(!b||b.getAttribute('data-flag3d')==='1')return;
var cat=b.getAttribute('data-cat')||'board';
var cs=getComputedStyle(b);
var G1=new THREE.Color((cs.getPropertyValue('--g1')||'#d9a441').trim());
var G2=new THREE.Color((cs.getPropertyValue('--g2')||'#3fb8af').trim());
var c=document.createElement('canvas');c.id='wog3d';c.setAttribute('aria-hidden','true');
b.appendChild(c);
var r=new THREE.WebGLRenderer({canvas:c,antialias:true,alpha:true,powerPreference:'low-power'});
r.setClearColor(0x000000,0);r.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
var s=new THREE.Scene();s.fog=new THREE.FogExp2(0x0b1220,.05);
var cam=new THREE.PerspectiveCamera(55,1,.1,160);cam.position.set(0,2.8,10);
function rs(){var w=innerWidth,h=innerHeight;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',rs,{passive:true});rs();
s.add(new THREE.HemisphereLight(0x93b8e0,0x141d33,.95));
var dl=new THREE.DirectionalLight(0xe8c073,.8);dl.position.set(5,8,6);s.add(dl);
function std(cc,e){var m=new THREE.MeshStandardMaterial({color:cc,roughness:.38,metalness:.3});if(e){m.emissive=new THREE.Color(e);m.emissiveIntensity=.45}return m}
var items=[],rnd=Math.random;
function put(g,x,y,z){g.position.set(x,y,z);g.userData={rx:(rnd()-.5)*.02,ry:(rnd()-.5)*.03,ph:rnd()*6.28,sp:.4+rnd()*.7};s.add(g);items.push(g);return g}
var i,m;
if(cat==='board'){
 var fl=new THREE.Mesh(new THREE.PlaneGeometry(28,28),new THREE.MeshStandardMaterial({color:0x101a30,roughness:.9,metalness:.1}));fl.rotation.x=-Math.PI/2;fl.position.y=-2.6;s.add(fl);
 var gr=new THREE.GridHelper(28,14,0x3fb8af,0x24406b);gr.material.transparent=true;gr.material.opacity=.32;gr.position.y=-2.58;s.add(gr);
 var cg=new THREE.CylinderGeometry(1,1.06,.4,28);
 for(i=0;i<14;i++){m=new THREE.Mesh(cg,std(i%2?0x1c2a4a:0xe8c073));m.scale.setScalar(.5+rnd()*.5);put(m,(rnd()-.5)*16,rnd()*6-1,(rnd()-.5)*10-3)}
}else if(cat==='cards'){
 var fg=new THREE.BoxGeometry(2.1,.05,3);
 for(i=0;i<16;i++){m=new THREE.Mesh(fg,std(0x1d2a4a,0xd9a441));m.rotation.set((rnd()-.5)*.9,(rnd()-.5)*1.2,(rnd()-.5)*.5);put(m,(rnd()-.5)*15,rnd()*7-1.5,(rnd()-.5)*9-3)}
 var felt=new THREE.Mesh(new THREE.PlaneGeometry(32,32),new THREE.MeshStandardMaterial({color:0x0f2230,roughness:.95}));felt.rotation.x=-Math.PI/2;felt.position.y=-3.2;s.add(felt)
}else if(cat==='puzzle'){
 var ico=new THREE.Mesh(new THREE.IcosahedronGeometry(3.1,0),new THREE.MeshBasicMaterial({color:0xd9a441,wireframe:true,transparent:true,opacity:.28}));put(ico,0,1.8,-4);
 var tg=new THREE.BoxGeometry(1.5,.24,1.5);
 for(i=0;i<12;i++){m=new THREE.Mesh(tg,std(i%2?0x20304f:0xe8c073,0x3fb8af));m.rotation.y=rnd()*3.14;put(m,(rnd()-.5)*14,rnd()*6-1,(rnd()-.5)*9-3)}
}else if(cat==='arcade'){
 var n=420,pos=new Float32Array(n*3);
 for(i=0;i<n;i++){pos[i*3]=(rnd()-.5)*46;pos[i*3+1]=(rnd()-.5)*28;pos[i*3+2]=(rnd()-.5)*30-4}
 var pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
 s.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0xcfe0ff,size:.09,transparent:true,opacity:.85})));
 var rg=new THREE.DodecahedronGeometry(.9,0);
 for(i=0;i<10;i++){m=new THREE.Mesh(rg,std(0x2a3a5e,0x3fb8af));m.scale.setScalar(.5+rnd());put(m,(rnd()-.5)*18,rnd()*8-2,(rnd()-.5)*10-5)}
}else if(cat==='word'){
 var LT=['ا','ب','پ','ت','س','ش','د','ن','م','ی','و','ک'];
 function ltex(ch){var cv=document.createElement('canvas');cv.width=cv.height=128;var x=cv.getContext('2d');x.fillStyle='#16233f';x.fillRect(0,0,128,128);x.strokeStyle='rgba(217,164,65,.8)';x.lineWidth=6;x.strokeRect(4,4,120,120);x.fillStyle='#e8c073';x.font='bold 78px Tahoma';x.textAlign='center';x.textBaseline='middle';x.fillText(ch,64,70);return new THREE.CanvasTexture(cv)}
 var wm=LT.map(function(ch){return new THREE.MeshStandardMaterial({map:ltex(ch),roughness:.5})});
 var wg=new THREE.BoxGeometry(1.35,1.35,.22);
 for(i=0;i<14;i++){m=new THREE.Mesh(wg,wm[i%wm.length]);put(m,(rnd()-.5)*15,rnd()*7-1.5,(rnd()-.5)*9-3)}
}else{
 function pipTex(){var cv=document.createElement('canvas');cv.width=cv.height=128;var x=cv.getContext('2d');x.fillStyle='#f3ead8';x.fillRect(0,0,128,128);x.fillStyle='#1c2438';var P=[[40,40],[88,40],[40,88],[88,88],[64,64]];for(var j=0;j<P.length;j++){x.beginPath();x.arc(P[j][0],P[j][1],9,0,6.29);x.fill()}return new THREE.CanvasTexture(cv)}
 var dm=new THREE.MeshStandardMaterial({map:pipTex(),roughness:.35});
 var dg=new THREE.BoxGeometry(1.5,1.5,1.5);
 for(i=0;i<9;i++){m=new THREE.Mesh(dg,dm);put(m,(rnd()-.5)*13,rnd()*6-1,(rnd()-.5)*8-3)}
 var ring=new THREE.Mesh(new THREE.TorusGeometry(4.6,.06,10,60),std(0xd9a441,0xd9a441));ring.rotation.x=Math.PI/2.2;put(ring,0,1.2,-5)
}
var mx=0,my=0;
addEventListener('pointermove',function(e){mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5},{passive:true});
var app=document.getElementById('app');
var rm=false;try{rm=matchMedia('(prefers-reduced-motion: reduce)').matches}catch(_){ }
var hid=false;document.addEventListener('visibilitychange',function(){hid=document.hidden});
function draw1(){cam.lookAt(0,1.2,0);r.render(s,cam)}
if(rm){draw1();return}
document.addEventListener('visibilitychange',function(){if(!document.hidden){rs()}});
var t=0,lx=99,ly=99;
function frame(){
 requestAnimationFrame(frame);
 if(hid)return;
 t+=.016;
 cam.position.x+=((mx*2.2)-cam.position.x)*.04;
 cam.position.y+=((2.8-my*1.4)-cam.position.y)*.04;
 for(var i2=0;i2<items.length;i2++){var mm=items[i2],u=mm.userData;
  mm.rotation.x+=u.rx;mm.rotation.y+=u.ry;
  mm.position.y+=Math.sin(t*u.sp+u.ph)*.0016}
 if(cat!=='arcade'&&app){
  var ax=(mx*3.2).toFixed(2),ay=(1.6-my*3).toFixed(2);
  if(ax!==lx||ay!==ly){lx=ax;ly=ay;app.style.transform='perspective(1100px) rotateX('+ay+'deg) rotateY('+ax+'deg)'}
 }
 r.render(s,cam);
}
frame();
}catch(e){}})();</script>
