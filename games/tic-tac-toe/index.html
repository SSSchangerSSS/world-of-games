<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Vazirmatn, Tahoma, sans-serif; background: linear-gradient(160deg, #101a2e, #0b1220);
         color: #f3ead8; min-height: 100dvh; user-select: none; -webkit-user-select: none;
         display: flex; flex-direction: column; align-items: center; padding: 18px 12px 30px; }
  header { text-align: center; }
  header h1 { color: #d9a441; font-size: 1.55rem; letter-spacing: .5px; }
  .hud { color: #a8b3c9; margin-top: 8px; font-size: .98rem; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .hud b { color: #e8c073; }
  #status { min-height: 1.5em; margin-top: 12px; color: #a8b3c9; font-size: 1.02rem; text-align: center; }
  #status b { color: #e8c073; }
  #board { position: relative; width: min(92vw, 440px); aspect-ratio: 1; margin-top: 12px;
           display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
           gap: 10px; padding: 10px; background: #14203a; border: 1px solid rgba(217,164,65,.35);
           border-radius: 16px; box-shadow: 0 12px 36px rgba(0,0,0,.45); }
  .cell { border: none; border-radius: 12px; background: #1a2a4a; cursor: pointer; position: relative;
          display: flex; align-items: center; justify-content: center; font-family: inherit;
          touch-action: manipulation; transition: background .15s; }
  .cell:hover:not(.x):not(.o) { background: #24375f; }
  #board.done .cell:hover { background: #1a2a4a; }
  .cell:focus-visible { outline: 2px solid #3fb8af; outline-offset: 2px; }
  .cell.x, .cell.o { cursor: default; }
  .cell.win { background: #2c2210; box-shadow: inset 0 0 0 2px rgba(217,164,65,.6); }
  .mark-x { color: #d9a441; font-size: min(13vw, 64px); font-weight: 700; line-height: 1; }
  .ring { width: 54%; aspect-ratio: 1; border-radius: 50%; border: 6px solid #3fb8af; }
  #winline { position: absolute; height: 7px; border-radius: 4px; pointer-events: none; z-index: 3;
             background: linear-gradient(90deg, rgba(232,192,115,.2), #d9a441, rgba(232,192,115,.2));
             box-shadow: 0 0 16px rgba(217,164,65,.85); opacity: 0; transition: opacity .3s; }
  #winline.show { opacity: 1; }
  .row-btns { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .btn { background: #d9a441; color: #221806; border: none; border-radius: 10px; font-weight: 700;
         font-family: inherit; font-size: 1rem; padding: 10px 20px; cursor: pointer; touch-action: manipulation; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: #1c2a47; color: #e8c073; border: 1px solid rgba(217,164,65,.35); }
  #overlay { position: fixed; inset: 0; background: rgba(6,10,19,.66); display: flex; align-items: center;
             justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  #overlay.show { opacity: 1; pointer-events: auto; }
  .panel { background: #14203a; border: 1px solid rgba(217,164,65,.35); border-radius: 16px;
           padding: 26px 34px; text-align: center; box-shadow: 0 14px 44px rgba(0,0,0,.55); max-width: 86vw; }
  .panel h2 { color: #d9a441; font-size: 1.5rem; margin-bottom: 8px; }
  .panel p { color: #a8b3c9; margin-bottom: 18px; line-height: 1.8; }
  #hint { color: #a8b3c9; font-size: .85rem; margin-top: 18px; text-align: center; max-width: 460px; line-height: 1.9; }

<body data-cat="board" data-slug="tic-tac-toe" style="--g1:#e8c073;--g2:#6b5426;--g1a:rgba(232,192,115,0.30);--g2a:rgba(107,84,38,0.42);--g1b:#6b5426">
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header>
  <h1>❋ دوز ❋</h1>
  <div class="hud">برد <b id="w">۰</b> · باخت <b id="l">۰</b> · مساوی <b id="d">۰</b></div>
</header>
<div id="status"></div>
<div id="board"><div id="winline"></div></div>
<div class="row-btns">
  <button class="btn" id="next">دور بعد</button>
  <button class="btn ghost" id="reset">صفر کردن شمارش</button>
</div>
<div id="hint">سه علامت هم‌راستا (افقی، عمودی یا قطری) بچین. کامپیوتر با الگوریتم مینی‌مکس بازی می‌کند و شکست‌ناپذیر است؛ بهترین نتیجه‌ات می‌تواند مساوی باشد. شروع‌کننده هر دور یک‌درمیان عوض می‌شود.</div>
<div id="overlay">
  <div class="panel">
    <h2 id="ptitle"></h2>
    <p id="ptext"></p>
    <button class="btn" id="pnext">دور بعد</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var FD = '۰۱۲۳۴۵۶۷۸۹';
  function fa(n) { return String(n).replace(/[0-9]/g, function (c) { return FD[+c]; }); }

  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var winlineEl = document.getElementById('winline');
  var overlay = document.getElementById('overlay');
  var pTitle = document.getElementById('ptitle');
  var pText = document.getElementById('ptext');
  var wEl = document.getElementById('w'), lEl = document.getElementById('l'), dEl = document.getElementById('d');

  var b = new Array(9), cells = [];
  var turn = 'X', starter = 'X', startedOnce = false, over = false, busy = false;

  var tally = { w: 0, l: 0, d: 0 };
  try {
    var saved = JSON.parse(store.get('wog-ttt-tally') || 'null');
    if (saved && typeof saved.w === 'number') tally = saved;
  } catch (e) {}
  function showTally() { wEl.textContent = fa(tally.w); lEl.textContent = fa(tally.l); dEl.textContent = fa(tally.d); }
  function saveTally() { store.set('wog-ttt-tally', JSON.stringify(tally)); showTally(); }
  showTally();

  for (var i = 0; i < 9; i++) {
    (function (idx) {
      var c = document.createElement('button');
      c.className = 'cell';
      c.setAttribute('aria-label', 'خانه ' + fa(idx + 1));
      c.addEventListener('click', function () { play(idx); });
      boardEl.appendChild(c);
      cells.push(c);
    })(i);
  }

  function findWin(brd) {
    for (var i = 0; i < LINES.length; i++) {
      var L = LINES[i];
      if (brd[L[0]] && brd[L[0]] === brd[L[1]] && brd[L[0]] === brd[L[2]]) return { p: brd[L[0]], line: L };
    }
    return null;
  }
  function empties(brd) { var r = []; for (var i = 0; i < 9; i++) if (!brd[i]) r.push(i); return r; }

  /* مینی‌مکس کامل — امتیاز از دید کامپیوتر (O) */
  function mini(brd, cur, depth) {
    var w = findWin(brd);
    if (w) return w.p === 'O' ? 10 - depth : depth - 10;
    if (empties(brd).length === 0) return 0;
    var list = empties(brd), i, s;
    var best = (cur === 'O') ? -Infinity : Infinity;
    for (i = 0; i < list.length; i++) {
      brd[list[i]] = cur;
      s = mini(brd, cur === 'O' ? 'X' : 'O', depth + 1);
      brd[list[i]] = null;
      if (cur === 'O' ? s > best : s < best) best = s;
    }
    return best;
  }
  function aiPick() {
    var list = empties(b), best = -Infinity, picks = [], i;
    for (i = 0; i < list.length; i++) {
      b[list[i]] = 'O';
      var s = mini(b, 'X', 1);
      b[list[i]] = null;
      if (s > best) { best = s; picks = [list[i]]; }
      else if (s === best) picks.push(list[i]);
    }
    /* اولین حرکت کامپیوتر: انتخاب تصادفی میان خانه‌های با امتیاز برتر */
    var firstAiMove = true;
    for (i = 0; i < 9; i++) if (b[i] === 'O') { firstAiMove = false; break; }
    if (firstAiMove && picks.length > 1) return picks[Math.floor(Math.random() * picks.length)];
    return picks[0];
  }

  function put(idx, p) {
    b[idx] = p;
    var c = cells[idx];
    if (p === 'X') {
      c.classList.add('x');
      var s = document.createElement('span');
      s.className = 'mark-x';
      s.textContent = '✕';
      c.appendChild(s);
    } else {
      c.classList.add('o');
      var r = document.createElement('span');
      r.className = 'ring';
      c.appendChild(r);
    }
  }
  function setStatus(html) { statusEl.innerHTML = html; }

  function play(idx) {
    if (over || busy || turn !== 'X' || b[idx]) return;
    put(idx, 'X');
    if (endCheck()) return;
    turn = 'O';
    setStatus('کامپیوتر در حال فکر…');
    busy = true;
    setTimeout(function () {
      busy = false;
      if (over) return;
      put(aiPick(), 'O');
      if (endCheck()) return;
      turn = 'X';
      setStatus('نوبت شما: <b>✕</b>');
    }, 420 + Math.random() * 280);
  }

  function endCheck() {
    var w = findWin(b);
    if (w) {
      over = true;
      boardEl.classList.add('done');
      w.line.forEach(function (i2) { cells[i2].classList.add('win'); });
      drawWinLine(w.line);
      if (w.p === 'X') { tally.w++; finish('بردی!', 'سه ✕ هم‌راستا چیدی و دست را بردی.'); }
      else { tally.l++; finish('باختی!', 'کامپیوتر خطش را کامل کرد. دور بعد دوباره تلاش کن.'); }
      saveTally();
      return true;
    }
    if (empties(b).length === 0) {
      over = true;
      boardEl.classList.add('done');
      tally.d++;
      saveTally();
      finish('مساوی', 'هیچ‌کس نتوانست ببرد؛ بازی متقارن ماند.');
      return true;
    }
    return false;
  }
  function finish(title, text) {
    setStatus('<b>' + title + '</b>');
    pTitle.textContent = title;
    pText.textContent = text;
    setTimeout(function () { overlay.classList.add('show'); }, 700);
  }

  function center(i) {
    var el = cells[i];
    return { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 };
  }
  function drawWinLine(L) {
    var a = center(L[0]), c = center(L[2]);
    var dx = c.x - a.x, dy = c.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) * 1.15;
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    winlineEl.style.left = ((a.x + c.x) / 2) + 'px';
    winlineEl.style.top = ((a.y + c.y) / 2) + 'px';
    winlineEl.style.width = len + 'px';
    winlineEl.style.transform = 'translate(-50%,-50%) rotate(' + ang + 'deg)';
    winlineEl.classList.add('show');
  }

  function nextRound() {
    overlay.classList.remove('show');
    b = new Array(9);
    over = false; busy = false;
    boardEl.classList.remove('done');
    cells.forEach(function (c) { c.className = 'cell'; c.innerHTML = ''; });
    winlineEl.classList.remove('show');
    if (startedOnce) starter = (starter === 'X') ? 'O' : 'X';
    startedOnce = true;
    turn = starter;
    if (turn === 'O') {
      setStatus('کامپیوتر شروع می‌کند…');
      busy = true;
      setTimeout(function () {
        busy = false;
        put(aiPick(), 'O');
        turn = 'X';
        setStatus('نوبت شما: <b>✕</b>');
      }, 550);
    } else {
      setStatus('نوبت شما: <b>✕</b>');
    }
  }

  document.getElementById('next').addEventListener('click', function () { if (!busy) nextRound(); });
  document.getElementById('pnext').addEventListener('click', nextRound);
  document.getElementById('reset').addEventListener('click', function () {
    tally = { w: 0, l: 0, d: 0 };
    saveTally();
  });

  nextRound();
})();
</script>
