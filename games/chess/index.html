<title>شطرنج | دنیای بازی‌ها</title>
<meta name="description" content="شطرنج سه‌بعدی با مهره‌های عاج و ابسیدین روی صفحهٔ لاپیس-فیروزه‌ای و قاب طلایی؛ حریف هوشمند با دو سطح دشواری." />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  @font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
  @font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
  body {
    font-family: Vazirmatn, Tahoma, sans-serif;
    background:
      radial-gradient(900px 420px at 50% -80px, var(--g1a), transparent 68%),
      radial-gradient(720px 480px at 108% 112%, var(--g2a), transparent 60%),
      linear-gradient(168deg, #111c33 0%, #0b1220 58%, #0a0f1d 100%);
    background-attachment: fixed;
    color: #f3ead8; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
    padding: 12px; padding-top: 64px; user-select: none; touch-action: manipulation; position: relative; overflow-x: hidden;
  }
  a.wog-home{position:fixed;top:12px;inset-inline-start:14px;z-index:99;display:inline-flex;align-items:center;gap:6px;background:linear-gradient(140deg,rgba(217,164,65,.16),rgba(217,164,65,.06));border:1px solid rgba(217,164,65,.5);color:#e8c073;text-decoration:none;padding:7px 14px;border-radius:12px;font-size:.85rem;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.35);transition:.18s}
  a.wog-home:hover{background:rgba(217,164,65,.3);transform:translateY(-1px)}
  header { text-align: center; margin-bottom: 10px; position: relative; z-index: 1; }
  h1 { font-size: 1.25rem; font-weight: 800; display: inline-flex; align-items: center; gap: 10px;
       background: linear-gradient(180deg, #f6d996, #e8c073 55%, #b98a3c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1:before, h1:after { content: '❋'; font-size: .85em; color: #d9a441; -webkit-text-fill-color: #d9a441; }
  .hud { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; color: #a8b3c9; font-size: .9rem; margin-top: 6px; min-height: 1.4em; position: relative; z-index: 1; }
  .hud b { color: #e8c073; }
  .stage3d { position: relative; width: min(92vw, 560px); aspect-ratio: 1 / 1; border-radius: 16px; overflow: hidden;
    box-shadow: 0 14px 36px rgba(0,0,0,.55), 0 0 0 2px rgba(217,164,65,.45), 0 0 0 6px rgba(12,16,28,.95), 0 0 30px rgba(217,164,65,.10); z-index: 1; }
  .stage3d canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }
  .panel { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 20px; text-align: center; background: rgba(8,12,22,.82); backdrop-filter: blur(4px); z-index: 5; }
  .panel.hidden { display: none; }
  .panel p { font-size: 1.1rem; font-weight: 700; line-height: 1.9; }
  .panel .sub { font-size: .88rem; color: #a8b3c9; font-weight: 400; }
  .promo { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  button { font-family: inherit; font-weight: 800; border: 0; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(180deg, #e9bd68, #c8922f); color: #251905; border-radius: 12px; padding: 10px 22px; font-size: .95rem;
    box-shadow: 0 3px 10px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.35); transition: transform .12s, filter .15s; }

  button.ghost { background: #14203a; color: #e8c073; border: 1px solid rgba(217,164,65,.4); box-shadow: none; }
  .bar { display: flex; gap: 8px; align-items: center; margin: 12px 0 4px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 1; }
  #hint { color: #96a2ba; font-size: .84rem; margin-top: 10px; text-align: center; max-width: 680px; line-height: 2; position: relative; z-index: 1; }

  var dt = Math.min(.05, (now - lastT) / 1000); lastT = now; tt += dt;
  var i, a;
  for (i = anims.length - 1; i >= 0; i--) {
    a = anims[i]; a.t += dt;
    var k = Math.min(1, a.t / a.dur);
    a.fn(k);
    if (k >= 1) { anims.splice(i, 1); if (a.done) a.done(); }
  }
  for (i = 0; i < pieces.length; i++) {
    var pc = pieces[i];
    if (!pc.alive || pc.grp.userData.gliding) continue;
    var ty = (sel && pc.sq === sel) ? .17 : 0;
    pc.grp.position.y += (ty - pc.grp.position.y) * .2;
  }
  var pulse = .62 + .32 * Math.sin(tt * 5);
  if (selRing && selRing.visible) selRing.material.opacity = pulse;
  if (discMat) discMat.opacity = .6 + .28 * Math.sin(tt * 5);
  if (capMat) capMat.opacity = .65 + .3 * Math.sin(tt * 5.6);
  if (checkG && checkG.visible) {
    checkMat.opacity = .55 + .35 * Math.sin(tt * 6);
    checkG.scale.setScalar(1 + .07 * Math.sin(tt * 6));
  }
  var sway = Math.sin(tt * .3) * .01, hr = Math.sin(phi) * Rr;
  camera.position.set(Math.sin(theta + sway) * hr, Math.cos(phi) * Rr, Math.cos(theta + sway) * hr);
  camera.lookAt(0, .4, 0);
  renderer.render(scene, camera);
}

// ---------- راه‌اندازی ----------
try { init3d(); } catch (e) { ok3d = false; renderer = null; cv = null; }
newGame();
if (!ok3d) {
  pMsg.textContent = 'WebGL در دسترس نیست';
  pSub.textContent = 'مرورگر شما از گرافیک سه‌بعدی پشتیبانی نمی‌کند.';
  pPromo.style.display = 'none';
  pBtn.style.display = '';
  pBtn.textContent = 'تلاش دوباره';
  panel.classList.remove('hidden');
  pBtn.onclick = function () { location.reload(); };
} else {
  requestAnimationFrame(frame);
}
window.__chess3d = {
  info: function () {
    return {
      turn: L.turn(), over: over, hist: L.history().length, sel: sel,
      level: L.level(), alive: pieces.filter(function (p) { return p.alive; }).length,
      calls: renderer ? renderer.info.render.calls : -1
    };
  },
  cellScreen: function (sq) {
    if (!renderer) return null;
    var v = new THREE.Vector3(sqX(sq), .2, sqZ(sq)).project(camera);
    var rect = cv.getBoundingClientRect();
    return { x: rect.left + (v.x + 1) / 2 * rect.width, y: rect.top + (1 - v.y) / 2 * rect.height };
  },
  pick: function (cx, cy) { return renderer ? pickSquare(cx, cy) : null; }
};
})();
</script>
