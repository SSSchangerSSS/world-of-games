function bindInput(){
  cv.addEventListener('pointerdown',function(e){drag=true;dragMoved=false;lx=e.clientX;ly=e.clientY;});
  cv.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;
    if(Math.abs(dx)+Math.abs(dy)>7)dragMoved=true;
    if(dragMoved){
      theta=Math.max(-.85,Math.min(.85,theta-dx*.005));
      phi=Math.max(.55,Math.min(1.25,phi-dy*.004));
      lx=e.clientX;ly=e.clientY;
    }
  });
  cv.addEventListener('pointerup',function(e){
    drag=false;
    if(dragMoved)return;
    tap(e.clientX,e.clientY);
  });
  cv.addEventListener('pointerleave',function(){drag=false;});
  cv.addEventListener('wheel',function(e){e.preventDefault();Rr=Math.max(6,Math.min(13,Rr+e.deltaY*.008));},{passive:false});

function tap(cx,cy){
  if(!st||busy)return;
  var rect=cv.getBoundingClientRect();
  var nx=((cx-rect.left)/rect.width)*2-1,ny=-((cy-rect.top)/rect.height)*2+1;
  ray.setFromCamera({x:nx,y:ny},camera);
  var list=handGrp.children.slice();

  if(markR.visible)list.push(markR);
  if(markC.visible)list.push(markC);
  list=list.concat(boneGrp.children);

  for(i=0;i<hits.length;i++){
    o=hits[i].object;
    while(o&&!(o.userData&&(o.userData.hi>=0||o.userData.mark||o.userData.bone)))o=o.parent;
    if(!o)continue;
    if(o.userData.hi>=0){tileClick(o.userData.hi);return;}
    if(o.userData.mark){markTap(o.userData.mark);return;}
    if(o.userData.bone){drawClick();return;}
  }
  if(pend){pend=null;render();}
}

function frame(now){

  }

    if(my!==seq||!st||st.turn!==1){return;}
    var r=L.autoTurn(st,Math.random);

    else{toast('ربات پاس داد');}

function drawClick(){
  if(!st||busy||st.turn!==0){return;}
  var my=++seq;busy=true;render();

    if(my!==seq||!st){return;}
    if(L.legalTiles(st,st.hands[0]).length){busy=false;render();hudUpd();toast('تختهٔ بازی‌شدنی گرفتی!');return;}
    if(!st.bone.length){
      var over=L.pass(st);
      render();hudUpd();
      if(over){endGame(L.winner(st));return;}
      toast('بونیارد خالی — پاس');aiGo();return;
    }
    var t=L.drawTile(st,0);
    toast('برداشتی: '+fa(t[0])+' و '+fa(t[1]));
    render();hudUpd();
    timer=setTimeout(step,320);
  })();
