<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC = {
  buildGame: function (rng) {
    var d = shuffle(makeDeck(), rng), cols = [], i = 0, c, r;
    for (c = 0; c < 5; c++) { var col = []; for (r = 0; r < 7; r++) col.push(d[i++]); cols.push(col); }
    var waste = [d[i++]];
    return { cols: cols, stock: d.slice(i), waste: waste, played: 0 };
  },
  canPlay: function (card, wasteTop) {
    if (card == null || wasteTop == null) return false;
    var a = card.r, b = wasteTop.r;
    return (a - b + 13) % 13 === 1 || (b - a + 13) % 13 === 1;
  },
  play: function (st, col) {
    var c = st.cols[col];
    if (!c || !c.length) return false;
    var bottom = c[c.length - 1], top = st.waste[st.waste.length - 1];
    if (!this.canPlay(bottom, top)) return false;
    st.waste.push(c.pop());
    st.played++;
    return true;
  },
  flipStock: function (st) {
    if (!st.stock.length) return false;
    st.waste.push(st.stock.pop());
    return true;
  },
  hasMoves: function (st) {
    if (st.stock.length) return true;
    var top = st.waste.length ? st.waste[st.waste.length - 1] : null;
    for (var i = 0; i < 5; i++) { var c = st.cols[i]; if (c.length && this.canPlay(c[c.length - 1], top)) return true; }
    return false;
  },
  isWin: function (st) {
    for (var i = 0; i < 5; i++) if (st.cols[i].length) return false;
    return true;
  }
};
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
var SUITS='♠♥♦♣';
function makeDeck(){var d=[];for(var s=0;s<4;s++)for(var r=1;r<=13;r++)d.push({s:s,r:r});return d}
function isRed(c){return c.s===1||c.s===2}
function suitOf(c){return SUITS[c.s]}
function rankShort(r){return r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r)}
function rankFa(r){return r===1?'آس':r===11?'سرباز':r===12?'بی‌بی':r===13?'شاه':fa(r)}
function cardEl(c,faceUp,size){var e=ce('div','wcard'+(faceUp?(isRed(c)?' red':''):' back')+(size?' '+size:''));if(faceUp)e.innerHTML='<span class="cn">'+rankShort(c.r)+suitOf(c)+'</span><span class="cv">'+suitOf(c)+'</span>';return e}
function cardStack(el,cs,faceUp,size){cs.forEach(function(c){el.appendChild(cardEl(c,faceUp,size))});return el}

var GS = null, GW = storeBest('wog-golf-wins');
function gNew() { GS = L.buildGame(); gRender(); }
function gRender() {
  hud('کارت‌های مانده: <b>' + fa(35 - GS.played) + '</b> — بردها: <b>' + fa(GW) + '</b>');
  var app = $('#app'); app.innerHTML = '';
  var cols = ce('div', 'golf-cols');
  var top = GS.waste[GS.waste.length - 1];
  for (var c = 0; c < 5; c++) {
    (function (cc) {
      var colEl = ce('div', 'golf-col'), arr = GS.cols[cc];
      if (!arr.length) { colEl.appendChild(ce('div', 'golf-empty')); cols.appendChild(colEl); return; }
      for (var i = 0; i < arr.length - 1; i++) colEl.appendChild(cardEl(arr[i], true, 'tiny'));
      var b = cardEl(arr[arr.length - 1], true, 'small');
      b.classList.add('golf-bottom');
      if (L.canPlay(arr[arr.length - 1], top)) b.classList.add('playable');
      b.addEventListener('click', function () { gTap(cc); });
      cols.appendChild(colEl);
    })(c);
  }
  app.appendChild(cols);
  var bar = ce('div', 'pyr-bar');
  var sb = ce('button', null, 'پشت کار (' + fa(GS.stock.length) + ')');
  sb.setAttribute('data-smoke', '');
  sb.addEventListener('click', gFlip);
  bar.appendChild(sb);
  var wwrap = ce('div', 'waste-col');
  wwrap.appendChild(top ? cardEl(top, true, 'small') : ce('div', 'wcard small back'));
  wwrap.appendChild(ce('div', 'slot-lbl', 'زباله'));
  bar.appendChild(wwrap);
  var rb = ce('button', 'sec', 'شروع دوباره');
  rb.setAttribute('data-smoke', '');
  rb.addEventListener('click', gNew);
  bar.appendChild(rb);
  app.appendChild(bar);
}
function gTap(c) {
  if (!GS.cols[c].length) return;
  if (!L.play(GS, c)) { toast('این کارت قابل بازی نیست'); return; }
  gRender(); gEnd();
}
function gFlip() {
  if (!GS.stock.length) { toast('پشت کار خالی است'); return; }
  L.flipStock(GS); gRender(); gEnd();
}
function gEnd() {
  if (L.isWin(GS)) {
    GW++; store.set('wog-golf-wins', String(GW));
    ovl('آفرین! برنده شدی', 'هر ۳۵ کارت بازی شد.', 'بازی جدید', gNew);
    return;
  }
  if (!L.hasMoves(GS)) {
    ovl('باختی', 'هیچ ستونی قابل بازی نیست و پشت کار هم خالی است', 'بازی جدید', gNew);
  }
}
gNew();
$('#hint').textContent = 'کارت پایین هر ستون را با اختلاف یک رتبه (شاه به آس وصل است) روی زباله بگذار.';
})();
</script>

}else if(cat==='cards'){

 var felt=new THREE.Mesh(new THREE.PlaneGeometry(32,32),new THREE.MeshStandardMaterial({color:0x0f2230,roughness:.95}));felt.rotation.x=-Math.PI/2;felt.position.y=-3.2;s.add(felt)
}else if(cat==='puzzle'){
 var ico=new THREE.Mesh(new THREE.IcosahedronGeometry(3.1,0),new THREE.MeshBasicMaterial({color:0xd9a441,wireframe:true,transparent:true,opacity:.28}));put(ico,0,1.8,-4);
