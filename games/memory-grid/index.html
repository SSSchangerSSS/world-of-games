<body data-cat="puzzle" data-slug="memory-grid" data-flag3d="1" style="--g1:#7e5ad4;--g2:#3fb8af;--g1a:rgba(126,90,212,0.30);--g2a:rgba(63,184,175,0.42);--g1b:#3fb8af">
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>شبکهٔ حافظه</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC=(function(){
function genCells(level,rng){
 if(!rng)rng=Math.random;
 var n=Math.min(3+level,12),pool=[],i;
 for(i=0;i<25;i++)pool.push(i);
 for(i=pool.length-1;i>0;i--){
  var j=Math.floor(rng()*(i+1)),t=pool[i];
  pool[i]=pool[j];pool[j]=t;
 }
 return pool.slice(0,n);
}
function check(cells,picked){
 var mark={},i,misses=[];
 for(i=0;i<cells.length;i++)mark[cells[i]]=1;
 var hit=picked.length>0&&mark[picked[picked.length-1]]===1;
 for(i=0;i<picked.length;i++)if(mark[picked[i]]!==1)misses.push(picked[i]);
 var complete=true;
 for(i=0;i<cells.length;i++)if(picked.indexOf(cells[i])<0){complete=false;break;}
 return {hit:hit,complete:complete,misses:misses};
}
function isLevelUp(foundCount,target){return foundCount>=target;}
function afterMiss(lives){var l=lives-1;return {lives:l,dead:l<=0};}
return {genCells:genCells,check:check,isLevelUp:isLevelUp,afterMiss:afterMiss};
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}

var level=0,lives=3,targets=[],found=[],showing=false;
var S=1,REST=.05;
var renderer=null,scene=null,camera=null,stage=null,cv=null,boardG=null;
var tiles=[],anims=[],tt=0,lastT=0,ray=null;
var theta=0,phi=1.0,Rr=8.8,drag=false,dragMoved=false,lx=0,ly=0;
var flashT0=0,flashArmed=false,celebrating=false;
function fallback3d(){
  var d=ce('div','fail3d');
  d.innerHTML='<div class="fbox"><h2>سه‌بعدی در دسترس نیست</h2><p>مرورگر شما از WebGL پشتیبانی نمی‌کند یا آن غیرفعال است؛ لطفاً مرورگر را به‌روز کنید.</p></div>';
  $('#app').appendChild(d);
}
function rShape(hw,rad){
  var s=new THREE.Shape(),w=hw*2,x=-hw,y=-hw;
  s.moveTo(x+rad,y);
  s.lineTo(x+w-rad,y);s.quadraticCurveTo(x+w,y,x+w,y+rad);
  s.lineTo(x+w,y+w-rad);s.quadraticCurveTo(x+w,y+w,x+w-rad,y+w);
  s.lineTo(x+rad,y+w);s.quadraticCurveTo(x,y+w,x,y+w-rad);
  s.lineTo(x,y+rad);s.quadraticCurveTo(x,y,x+rad,y);
  return s;
}
function rGeo(hw,rad,depth,bevel){
  var g=new THREE.ExtrudeGeometry(rShape(hw,rad),{depth:depth,bevelEnabled:true,bevelThickness:bevel,bevelSize:bevel,bevelSegments:3,curveSegments:6});
  g.rotateX(-Math.PI/2);return g;
}
function hitFx(i){
  if(!renderer)return;
  var m=tiles[i],m2=m.material;
  anims.push({t:0,dur:.45,fn:function(k){
    m.scale.setScalar(1+Math.sin(k*Math.PI)*.22);
    m2.color.setHex(0xe8c073);m2.emissive.setHex(0xd9a441);
    m2.emissiveIntensity=.35+.9*(1-k);
  },done:function(){m.scale.setScalar(1);}});
}
function missFx(i){
  if(!renderer)return;
  var m=tiles[i],m2=m.material,x0=m.position.x;
  anims.push({t:0,dur:.55,fn:function(k){
    m.position.x=x0+Math.sin(k*26)*.1*(1-k);
    m2.color.setHex(0xd94040);m2.emissive.setHex(0x8f1d1d);
    m2.emissiveIntensity=.85*(1-k);
  },done:function(){m.position.x=x0;m2.emissiveIntensity=0;}});
}
function celebrateFx(){
  if(!renderer)return;
  celebrating=true;
  for(var i=0;i<25;i++){
    (function(i){
      var m=tiles[i],m2=m.material,r=~~(i/5)-2,c=i%5-2;
      var dist=Math.sqrt(r*r+c*c);
      anims.push({t:-dist*.13,dur:.7,fn:function(k){
        m.position.y=REST+Math.sin(k*Math.PI)*.6;
        m2.color.setHex(0xd9a441);m2.emissive.setHex(0xd9a441);
        m2.emissiveIntensity=.55*Math.sin(k*Math.PI);
      },done:function(){m2.emissiveIntensity=0;}});
    })(i);
  }
}
function syncTiles(dt){
  var i;
  for(i=0;i<25;i++){
    var m=tiles[i],mat=m.material,ty=REST,cc=0xe3d7ba,ec=0x000000,ei=0;
    if(showing){
      var ti=targets.indexOf(i);
      if(ti>=0){
        var k=clamp((tt-(flashT0+ti*.09))/.3,0,1);
        if(k>0){ty=REST+.55;cc=0x3fb8af;ec=0x17766f;ei=.5+.35*k+.1*Math.sin(tt*5+i*1.1);}
      }
    }else if(found.indexOf(i)>=0){ty=REST+.24;cc=0xd9a441;ec=0x5a3f0d;ei=.5;}
    m.position.y+=(ty-m.position.y)*Math.min(1,dt*9);
    mat.color.setHex(cc);mat.emissive.setHex(ec);
    mat.emissiveIntensity+=(ei-mat.emissiveIntensity)*Math.min(1,dt*9);
  }
}
function render(){
  if(!showing)flashArmed=false;
  var hearts='';
  for(var h=0;h<lives;h++)hearts+='♥';
  hud('مرحلهٔ '+fa(level+1)+' | جان: '+hearts+' | پیداشده: '+fa(found.length)+' از '+fa(targets.length));
}
function pick(i){
  if(showing)return;
  if(found.indexOf(i)>=0)return;
  var res=L.check(targets,found.concat([i]));
  if(res.hit){
    found.push(i);render();hitFx(i);
    if(res.complete){
      toast('مرحله کامل شد!');
      celebrateFx();
      setTimeout(function(){level++;newRound();},800);
    }
  }else{
    var r=L.afterMiss(lives);
    lives=r.lives;
    missFx(i);
    if(r.dead){
      render();
      var best=parseInt(store.get('wog-memory-grid-best')||'0',10)||0;
      if(level>best)store.set('wog-memory-grid-best',String(level));
      ovl('باختی!','به مرحلهٔ '+fa(level+1)+' رسیدی | رکورد: '+fa(Math.max(best,level)),'بازی جدید',function(){newGame();});
    }else{
      toast('اشتباه بود! یک جان کم شد؛ دوباره نگاه کن');
      found=[];
      showing=true;
      flashArmed=false;
      render();
      setTimeout(function(){showing=false;render();},1100+targets.length*90);
    }
  }
}
function pickAt(cx,cy){
  if(!renderer)return null;
  var rect=cv.getBoundingClientRect();
  var nx=((cx-rect.left)/rect.width)*2-1,ny=-((cy-rect.top)/rect.height)*2+1;
  ray.setFromCamera({x:nx,y:ny},camera);
  var hits=ray.intersectObjects(tiles,false);
  if(hits.length)return hits[0].object.userData.i;
  var d=ray.ray.direction,o=ray.ray.origin;
  if(d.y<-.0001){
    var t=(.2+boardG.position.y-o.y)/d.y,px=o.x+d.x*t,pz=o.z+d.z*t;
    var r=Math.round(pz/S+2),c=Math.round(px/S+2);
    if(r>=0&&r<5&&c>=0&&c<5)return r*5+c;
  }
  return null;
}
function rs3d(){
  var w=stage.clientWidth||320,h=stage.clientHeight||240;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
function bindInput(){
  cv.addEventListener('pointerdown',function(e){drag=true;dragMoved=false;lx=e.clientX;ly=e.clientY;});
  cv.addEventListener('pointermove',function(e){
    if(!drag)return;
    var dx=e.clientX-lx,dy=e.clientY-ly;
    if(Math.abs(dx)+Math.abs(dy)>7)dragMoved=true;
    if(dragMoved){
      theta=clamp(theta-dx*.005,-.95,.95);
      phi=clamp(phi-dy*.004,.55,1.25);
      lx=e.clientX;ly=e.clientY;
    }
  });
  cv.addEventListener('pointerup',function(e){
    drag=false;
    if(dragMoved)return;
    var hit=pickAt(e.clientX,e.clientY);
    if(hit!=null)pick(hit);
  });
  cv.addEventListener('pointerleave',function(){drag=false;});
  cv.addEventListener('wheel',function(e){e.preventDefault();Rr=clamp(Rr+e.deltaY*.008,5.5,14);},{passive:false});
}
function init3d(){
  if(typeof THREE==='undefined')throw new Error('THREE');
  stage=ce('div');stage.id='stage';$('#app').appendChild(stage);
  cv=document.createElement('canvas');stage.appendChild(cv);

function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden)return;
  var dt=Math.min(.05,(now-lastT)/1000);lastT=now;tt+=dt;
  if(showing&&!flashArmed){flashArmed=true;flashT0=tt;}
