<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>گردونه شانس | دنیای بازی‌ها</title>
<meta name="description" content="گردونهٔ شانس ۱۲ خانه‌ای با جوایز ۱۰۰/۲۵۰/۵۰۰ و خانه‌های ویژهٔ ضربدر۲، نصف و ورشکست؛ امتیاز را جمع کن و به ۲۰۰۰ برس.">
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#101a2e,#0b1220);color:#f3ead8;min-height:100dvh;user-select:none;display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:56px;overflow-x:hidden}
a.wog-home{position:fixed;top:10px;inset-inline-start:12px;z-index:99;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.45);color:#e8c073;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
a.wog-home:hover{background:rgba(217,164,65,.3)}
header{text-align:center;margin-bottom:8px}
h1{font-size:1.2rem;color:#d9a441}
.hud{color:#a8b3c9;font-size:.9rem;margin-top:2px;min-height:1.4em}
.hud b{color:#e8c073}
button,.wbtn{font-family:inherit;background:#d9a441;color:#221806;border:0;border-radius:10px;font-weight:700;padding:8px 16px;font-size:.95rem;cursor:pointer;touch-action:manipulation}
button.sec,.wbtn.sec{background:#14203a;color:#f3ead8;border:1px solid rgba(217,164,65,.35)}
button:disabled{opacity:.45;cursor:default}
#hint{color:#a8b3c9;font-size:.85rem;margin-top:10px;text-align:center;max-width:680px;line-height:1.9}
.wpanel{background:#14203a;border:1px solid rgba(217,164,65,.35);border-radius:14px;padding:14px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.wovl{position:fixed;inset:0;background:rgba(5,9,18,.85);display:flex;align-items:center;justify-content:center;z-index:90}
.wovl .box{background:#14203a;border:2px solid rgba(217,164,65,.5);border-radius:16px;padding:22px 28px;text-align:center;max-width:88vw}
.wovl h2{color:#e8c073;margin-bottom:8px}
.wovl p{color:#a8b3c9;margin-bottom:14px}
.wog-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid rgba(217,164,65,.5);color:#f3ead8;padding:8px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem}
.wog-toast.on{opacity:1}
.wgrid{display:grid;border:2px solid rgba(217,164,65,.5);border-radius:10px;overflow:hidden;direction:ltr;touch-action:manipulation}
.wgrid .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.cell.light{background:#e8dcc0}.cell.dark{background:#41527a}
.wcard{display:inline-flex;flex-direction:column;justify-content:space-between;width:52px;height:74px;background:#f6efe0;color:#1c2438;border-radius:7px;padding:3px 5px;font-weight:700;font-size:.9rem;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;flex:none}
.wcard.red{color:#c0392b}
.wcard.back{background:linear-gradient(135deg,#2c3a5e,#41527a);border:2px solid rgba(217,164,65,.5)}
.wcard.back:before{content:'❋';color:rgba(232,192,115,.55);align-self:center;font-size:1.3rem}
.wcard.small{width:38px;height:54px;font-size:.75rem;border-radius:5px}
.wcard.tiny{width:30px;height:44px;font-size:.65rem;border-radius:4px;padding:2px 3px}
.wcard.sel{outline:3px solid #e8c073;transform:translateY(-6px)}
.wcard .cn{font-size:.7rem;opacity:.85}.wcard .cv{align-self:flex-start}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:50px;gap:6px;margin-top:12px}
.wdpad.on{display:grid}
.wdpad button{font-size:1.15rem}
@media(pointer:coarse){.wdpad{display:grid}}
canvas{touch-action:none;border-radius:10px;border:2px solid rgba(217,164,65,.35);background:#0d1526}
.wwrap{position:relative;width:270px;height:270px;margin:16px auto 8px}
.wpointer{position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid #d9a441;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.wheel{width:100%;height:100%;border-radius:50%;border:5px solid #d9a441;position:relative;overflow:hidden;transition:transform 3.2s cubic-bezier(.12,.75,.2,1);box-shadow:0 0 0 5px #14203a,0 8px 24px rgba(0,0,0,.45)}
.seg{position:absolute;left:0;top:0;width:100%;height:100%;display:flex;justify-content:center;pointer-events:none}
.seg span{margin-top:10px;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
.whub{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:#d9a441;border:4px solid #14203a;z-index:2}
.wpanel{max-width:440px;margin:0 auto;text-align:center}
.hist{color:#9fb0d8;font-size:13px;min-height:20px;margin-top:8px}
.hchip{display:inline-block;background:#14203a;border:1px solid #2c3f6b;border-radius:8px;padding:2px 8px;margin:2px}
.btns{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap}
.btn{min-height:48px;min-width:120px;padding:10px 20px;font-size:16px;border-radius:10px;background:#1b2b4d;color:#e8edf7;border:1px solid #2c3f6b;cursor:pointer;touch-action:manipulation}
.btn.primary{background:#d9a441;color:#14203a;font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.msg{text-align:center;color:#67b98a;min-height:22px}
</style>
</head>
<body>
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>❋ گردونه شانس ❋</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC = (function () {
  function seg(label, value, kind, weight) { return { label: label, value: value, kind: kind, weight: weight }; }
  var SEGMENTS = [
    seg('۱۰۰', 100, 'add', 1), seg('ورشکست', 0, 'bust', 1), seg('۲۵۰', 250, 'add', 1),
    seg('نصف', 0, 'half', 1), seg('۱۰۰', 100, 'add', 1), seg('۵۰۰', 500, 'add', 1),
    seg('ورشکست', 0, 'bust', 1), seg('۲۵۰', 250, 'add', 1), seg('×۲', 0, 'x2', 1),
    seg('۱۰۰', 100, 'add', 1), seg('۲۵۰', 250, 'add', 1), seg('۵۰۰', 500, 'add', 1)
  ];
  function spin(rng) {
    var r = rng || Math.random, total = 0, i, x;
    for (i = 0; i < SEGMENTS.length; i++) total += SEGMENTS[i].weight;
    x = r() * total;
    for (i = 0; i < SEGMENTS.length; i++) { x -= SEGMENTS[i].weight; if (x < 0) return i; }
    return SEGMENTS.length - 1;
  }
  function apply(points, segOrIdx) {
    var s = (typeof segOrIdx === 'number') ? SEGMENTS[segOrIdx] : segOrIdx;
    var p = points;
    if (s.kind === 'add') p += s.value;
    else if (s.kind === 'x2') p = p * 2;
    else if (s.kind === 'half') p = Math.floor(p / 2);
    else if (s.kind === 'bust') p = 0;
    if (p < 0) p = 0;
    return p;
  }
  return { SEGMENTS: SEGMENTS, START: 200, spin: spin, apply: apply };
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}

var pts = L.START, rot = 0, busy = false, history = [], spins = 0;
function build() {
  var n = L.SEGMENTS.length, step = 360 / n, stops = '', i, k, col, w, lb = '';
  for (i = 0; i < n; i++) {
    k = L.SEGMENTS[i].kind;
    col = k === 'bust' ? '#e26d5c' : (k === 'x2' ? '#d9a441' : (k === 'half' ? '#3fb8af' : (i % 2 ? '#1b2b4d' : '#263a66')));
    if (i) stops += ',';
    stops += col + ' ' + (i * step) + 'deg ' + ((i + 1) * step) + 'deg';
  }
  $('#app').innerHTML = '<div class="wwrap"><div class="wpointer"></div><div id="wheel" class="wheel"></div><div class="whub"></div></div><div class="wpanel"><div id="wmsg" class="msg">بچرخان و شانس‌ات را امتحان کن</div><div class="btns"><button id="spin" class="btn primary" data-smoke>چرخاندن گردونه</button><button id="new" class="btn" data-smoke>بازی جدید</button></div><div id="hist" class="hist"></div></div>';
  w = document.getElementById('wheel');
  w.style.background = 'conic-gradient(' + stops + ')';
  for (i = 0; i < n; i++) lb += '<div class="seg" style="transform:rotate(' + (i * step + step / 2) + 'deg)"><span>' + L.SEGMENTS[i].label + '</span></div>';
  w.innerHTML = lb;
  $('#spin').onclick = doSpin;
  $('#new').onclick = newGame;
  update('');
}
function update(msg) {
  $('#wmsg').textContent = msg;
  $('#spin').disabled = busy;
  var hs = '', i;
  for (i = 0; i < history.length; i++) hs += '<span class="hchip">' + history[i].label + ' (' + (history[i].d > 0 ? '+' : '') + fa(history[i].d) + ')</span> ';
  $('#hist').innerHTML = hs ? 'تاریخچه: ' + hs : '';
  hud('امتیاز: ' + fa(pts) + ' · رکورد: ' + fa(store.get('wog-wheel-best') || '0') + ' · چرخش: ' + fa(spins));
}
function doSpin() {
  if (busy) return;
  var idx, n, step, target, cur;
  busy = true;
  update('در حال چرخش…');
  idx = L.spin();
  spins++;
  n = L.SEGMENTS.length; step = 360 / n;
  target = (360 - (idx * step + step / 2)) % 360;
  cur = ((rot % 360) + 360) % 360;
  rot += 360 * 4 + ((target - cur + 360) % 360);
  document.getElementById('wheel').style.transform = 'rotate(' + rot + 'deg)';
  setTimeout(function () {
    var s = L.SEGMENTS[idx], before = pts, msg;
    pts = L.apply(pts, s);
    history.unshift({ label: s.label, d: pts - before });
    if (history.length > 6) history.pop();
    busy = false;
    msg = s.kind === 'bust' ? 'ورشکست! امتیازت صفر شد' : (s.kind === 'x2' ? 'دو برابر شد!' : (s.kind === 'half' ? 'نصف شد!' : ('+' + fa(s.value) + ' امتیاز')));
    update(msg);
    if (pts > parseInt(store.get('wog-wheel-best') || '0', 10)) store.set('wog-wheel-best', String(pts));
    if (pts >= 2000) ovl('شگفت‌انگیز!', 'به ' + fa(pts) + ' امتیاز رسیدی در ' + fa(spins) + ' چرخش', 'بازی جدید', newGame);
  }, 3300);
}
function newGame() { pts = L.START; history = []; spins = 0; busy = false; update('بازی جدید؛ امتیاز دوباره ' + fa(L.START)); }
build();
$('#hint').textContent = 'خانه‌ها جایزهٔ ۱۰۰/۲۵۰/۵۰۰ یا ضربدر۲ و نصف دارند؛ ورشکست امتیاز را صفر می‌کند ولی هیچ‌وقت منفی نمی‌شود. به ۲۰۰۰ امتیاز برس!';
})();
</script>
</body>
</html>
