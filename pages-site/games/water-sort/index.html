<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>آب‌ریز | دنیای بازی‌ها</title>
<meta name="description" content="بطری‌های رنگی را با ریختنِ هوشمندانه از هم جدا کن؛ هر بطری در پایان فقط یک رنگ.">
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#101a2e,#0b1220);color:#f3ead8;min-height:100dvh;user-select:none;display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:56px;overflow-x:hidden}
a.wog-home{position:fixed;top:10px;inset-inline-start:12px;z-index:99;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.45);color:#e8c073;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
a.wog-home:hover{background:rgba(217,164,65,.3)}
header{text-align:center;margin-bottom:8px}
h1{font-size:1.2rem;color:#d9a441}
.hud{color:#a8b3c9;font-size:.9rem;margin-top:2px;min-height:1.4em}
.hud b{color:#e8c073}
button,.wbtn{font-family:inherit;background:#d9a441;color:#221806;border:0;border-radius:10px;font-weight:700;padding:8px 16px;font-size:.95rem;cursor:pointer;touch-action:manipulation}
button.sec,.wbtn.sec{background:#14203a;color:#f3ead8;border:1px solid rgba(217,164,65,.35)}
button:disabled{opacity:.45;cursor:default}
#hint{color:#a8b3c9;font-size:.85rem;margin-top:10px;text-align:center;max-width:680px;line-height:1.9}
.wpanel{background:#14203a;border:1px solid rgba(217,164,65,.35);border-radius:14px;padding:14px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.wovl{position:fixed;inset:0;background:rgba(5,9,18,.85);display:flex;align-items:center;justify-content:center;z-index:90}
.wovl .box{background:#14203a;border:2px solid rgba(217,164,65,.5);border-radius:16px;padding:22px 28px;text-align:center;max-width:88vw}
.wovl h2{color:#e8c073;margin-bottom:8px}
.wovl p{color:#a8b3c9;margin-bottom:14px}
.wog-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid rgba(217,164,65,.5);color:#f3ead8;padding:8px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem}
.wog-toast.on{opacity:1}
.wgrid{display:grid;border:2px solid rgba(217,164,65,.5);border-radius:10px;overflow:hidden;direction:ltr;touch-action:manipulation}
.wgrid .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.cell.light{background:#e8dcc0}.cell.dark{background:#41527a}
.wcard{display:inline-flex;flex-direction:column;justify-content:space-between;width:52px;height:74px;background:#f6efe0;color:#1c2438;border-radius:7px;padding:3px 5px;font-weight:700;font-size:.9rem;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;flex:none}
.wcard.red{color:#c0392b}
.wcard.back{background:linear-gradient(135deg,#2c3a5e,#41527a);border:2px solid rgba(217,164,65,.5)}
.wcard.back:before{content:'❋';color:rgba(232,192,115,.55);align-self:center;font-size:1.3rem}
.wcard.small{width:38px;height:54px;font-size:.75rem;border-radius:5px}
.wcard.tiny{width:30px;height:44px;font-size:.65rem;border-radius:4px;padding:2px 3px}
.wcard.sel{outline:3px solid #e8c073;transform:translateY(-6px)}
.wcard .cn{font-size:.7rem;opacity:.85}.wcard .cv{align-self:flex-start}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:50px;gap:6px;margin-top:12px}
.wdpad.on{display:grid}
.wdpad button{font-size:1.15rem}
@media(pointer:coarse){.wdpad{display:grid}}
canvas{touch-action:none;border-radius:10px;border:2px solid rgba(217,164,65,.35);background:#0d1526}
body{background:#0b1526;color:#e8edf7;font-family:Tahoma,'Segoe UI',sans-serif;margin:0;padding:10px;text-align:center}
h1{color:#d9a441;font-size:1.25em;margin:.3em}
#hud{color:#3fb8af;min-height:1.3em;font-size:.95em}
.wog-home{color:#3fb8af;font-size:.8em;text-decoration:none}
button{background:#14203a;color:#e8edf7;border:1px solid #d9a441;border-radius:8px;padding:9px 13px;min-height:40px;margin:3px;font-size:1em;touch-action:manipulation;cursor:pointer}
button:disabled{opacity:.4}
button.on{background:#d9a441;color:#0b1526}
.bw{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0}
.wb{width:36px;height:150px;border:2px solid #3fb8af;border-top-width:1px;border-radius:4px 4px 12px 12px;background:#14203a;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.wb.sb{border-color:#d9a441;box-shadow:0 0 8px rgba(217,164,65,.5)}
.sg{flex:1;min-height:0;border-bottom:1px solid rgba(11,21,38,.35)}
.bar{margin:8px 0}
#hint{color:#8fa3c8;font-size:.85em}
</style>

<body>
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>❋ آب‌ریز ❋</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC=(function(){
function allSame(a){var i;if(!a.length)return true;for(i=1;i<a.length;i++)if(a[i]!==a[0])return false;return true;}
function canPour(b,s,d){
 if(s===d)return false;
 if(!b[s]||!b[s].length)return false;
 if(!b[d]||b[d].length>=4)return false;
 if(!b[d].length)return true;
 return b[d][b[d].length-1]===b[s][b[s].length-1];
}
function pour(b,s,d){
 var nb=[],i;
 for(i=0;i<b.length;i++)nb.push(b[i].slice());
 var src=nb[s],run=1;
 while(run<src.length&&src[src.length-1-run]===src[src.length-1])run++;
 var n=Math.min(run,4-nb[d].length);
 for(i=0;i<n;i++)nb[d].push(src.pop());
 return nb;
}
function isWin(b){
 for(var i=0;i<b.length;i++){
  var x=b[i];
  if(!x.length)continue;
  if(x.length>4)return false;
  for(var j=1;j<x.length;j++)if(x[j]!==x[0])return false;
 }
 return true;
}
function stKey(b){var p=[],i;for(i=0;i<b.length;i++)p.push(b[i].join('.'));return p.sort().join('|');}
function mScore(b,s,d){
 var sb=b[s],db=b[d],run=1;
 while(run<sb.length&&sb[sb.length-1-run]===sb[sb.length-1])run++;
 var v=db.length?3:1;
 if(run>=4-db.length)v+=3;
 if(run===sb.length)v+=2;
 return v;
}
function solve(bottles){
 var seen={},count=0,stack=[{b:bottles,path:[],ps:-1,pd:-1}];
 while(stack.length&&count<2000){
  var nd=stack.pop();count++;
  if(isWin(nd.b))return nd.path;
  var k=stKey(nd.b);
  if(seen[k])continue;
  seen[k]=1;
  var mv=[],s,d;
  for(s=0;s<nd.b.length;s++){
   if(!nd.b[s].length)continue;
   for(d=0;d<nd.b.length;d++){
    if(d===s)continue;
    if(s===nd.pd&&d===nd.ps)continue;
    if(canPour(nd.b,s,d))mv.push([s,d]);
   }
  }
  mv.sort(function(a,c){return mScore(nd.b,a[0],a[1])-mScore(nd.b,c[0],c[1]);});
  for(var i=0;i<mv.length;i++){
   stack.push({b:pour(nd.b,mv[i][0],mv[i][1]),path:nd.path.concat([mv[i]]),ps:mv[i][0],pd:mv[i][1]});
  }
 }
 return null;
}
function genLevel(colors,rng){
 if(!rng)rng=Math.random;
 var N=colors+2,b=[],c,pass=0;
 for(c=0;c<colors;c++)b.push([c,c,c,c]);
 b.push([]);b.push([]);
 var K=colors*2;
 while(isWin(b)&&pass<3){
  pass++;
  var lastS=-1,lastD=-1,done=0,guard=0;
  while(done<K&&guard<900){
   guard++;
   var pairs=[],s,d;
   for(s=0;s<N;s++){
    if(!b[s].length)continue;
    for(d=0;d<N;d++){
     if(d===s)continue;
     if(s===lastD&&d===lastS)continue;
     if(!canPour(b,s,d))continue;
     if(!b[d].length&&b[s].length===4&&allSame(b[s]))continue;
     pairs.push([s,d]);
    }
   }
   if(!pairs.length)break;
   var m=pairs[Math.floor(rng()*pairs.length)];
   b=pour(b,m[0],m[1]);
   lastS=m[0];lastD=m[1];done++;
  }
 }
 return b;
}
return {genLevel:genLevel,canPour:canPour,pour:pour,isWin:isWin,solve:solve};
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}

var PAL=['#e26d5c','#3fb8af','#d9a441','#67b98a','#b07ad4','#5a8fe0','#e0913f','#8fbf5a'];
var lvl=4,bottles=[],sel=-1,hist=[],moves=0;
function newGame(){bottles=L.genLevel(lvl);sel=-1;hist=[];moves=0;render();}
function render(){
 var app=$('#app');app.innerHTML='';
 var w=ce('div','bw');
 for(var i=0;i<bottles.length;i++){
  (function(i){
   var d=ce('div','wb'+(sel===i?' sb':''));
   for(var j=3;j>=0;j--){
    var sg=ce('div','sg');
    if(j<bottles[i].length)sg.style.background=PAL[bottles[i][j]];
    d.appendChild(sg);
   }
   d.onclick=function(){tap(i);};
   w.appendChild(d);
  })(i);
 }
 app.appendChild(w);
 var bar=ce('div','bar');
 var nb=ce('button','','بازی جدید');nb.setAttribute('data-smoke','1');nb.onclick=newGame;bar.appendChild(nb);
 var ub=ce('button','','واگرد');ub.disabled=!hist.length;
 ub.onclick=function(){if(hist.length){bottles=hist.pop();moves=Math.max(0,moves-1);sel=-1;render();}};
 bar.appendChild(ub);
 var lbs=[4,6,8];
 for(var k=0;k<lbs.length;k++){
  (function(c){
   var b2=ce('button','lv'+(lvl===c?' on':''),fa(c)+' رنگ');
   b2.onclick=function(){lvl=c;newGame();};
   bar.appendChild(b2);
  })(lbs[k]);
 }
 app.appendChild(bar);
 hud('رنگ‌ها: '+fa(lvl)+' | حرکت‌ها: '+fa(moves));
}
function tap(i){
 if(sel<0){if(bottles[i].length){sel=i;render();}return;}
 if(i===sel){sel=-1;render();return;}
 if(L.canPour(bottles,sel,i)){
  var snap=[],q;
  for(q=0;q<bottles.length;q++)snap.push(bottles[q].slice());
  hist.push(snap);
  bottles=L.pour(bottles,sel,i);
  moves++;sel=-1;render();
  if(L.isWin(bottles)){
   setTimeout(function(){ovl('آفرین!','همهٔ رنگ‌ها در '+fa(moves)+' حرکت جدا شدند','مرحلهٔ جدید',function(){newGame();});},350);
  }
 }else{
  toast('این ریختن ممکن نیست');
  sel=-1;render();
 }
}
$('#hint').textContent='روی بطریِ مبدأ و سپس بطری مقصد بزن؛ رنگِ یکسان روی هم می‌نشیند و بطری خالی هر رنگی می‌پذیرد.';
newGame();
})();
</script>
</body>
</html>
