<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

background-attachment:fixed}

.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}

.wovl .box{background:linear-gradient(180deg,#182646,#101a30);border:1px solid rgba(217,164,65,.55);border-radius:20px;padding:26px 30px;text-align:center;max-width:88vw;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 0 1px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.07);animation:wogpop .26s cubic-bezier(.2,1.4,.4,1)}

.wovl h2{color:var(--gold2);margin-bottom:8px;font-size:1.35rem;text-shadow:0 0 18px rgba(217,164,65,.35)}

.wog-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(20,32,58,.94);border:1px solid rgba(217,164,65,.55);color:var(--ink);padding:9px 20px;border-radius:14px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.5)}

.wgrid{display:grid;border-radius:12px;overflow:hidden;direction:ltr;touch-action:manipulation;border:2px solid rgba(217,164,65,.55);outline:1px solid rgba(0,0,0,.6);box-shadow:0 10px 30px rgba(0,0,0,.5),0 0 0 5px rgba(23,35,63,.85),0 0 0 6px rgba(217,164,65,.25),inset 0 0 0 1px rgba(0,0,0,.35)}

.cell.light{background:linear-gradient(145deg,#f0e5cb,#dccfae)}

.wgrid .cell:hover{filter:brightness(1.1)}

.wcard:hover{transform:translateY(-2px)}
.wcard.red{color:#bf2f3a}

.wcard.back:before{content:'❋';color:rgba(232,192,115,.6);align-self:center;font-size:1.35rem;text-shadow:0 0 8px rgba(217,164,65,.4)}
.wcard.small{width:40px;height:57px;font-size:.78rem;border-radius:6px}
.wcard.tiny{width:31px;height:46px;font-size:.68rem;border-radius:5px;padding:2px 3px}
.wcard.sel{outline:3px solid var(--gold2);transform:translateY(-7px);box-shadow:0 10px 22px rgba(0,0,0,.5),0 0 18px rgba(232,192,115,.4)}
.wcard .cn{font-size:.72rem;opacity:.9}.wcard .cv{align-self:flex-start;opacity:.95}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,60px);grid-auto-rows:52px;gap:7px;margin-top:12px}

.wdpad button{font-size:1.15rem;border-radius:14px}

canvas{touch-action:none;border-radius:14px;background:#0d1526;box-shadow:0 12px 36px rgba(0,0,0,.55),0 0 0 2px rgba(217,164,65,.4),0 0 0 6px rgba(15,22,40,.9),0 0 26px rgba(217,164,65,.12)}

.wboard{gap:6px}

.kbwrap .sec{min-height:46px}

<body data-cat="word" data-slug="wordle" style="--g1:#3fb8af;--g2:#8a5f1e;--g1a:rgba(63,184,175,0.30);--g2a:rgba(138,95,30,0.42);--g1b:#8a5f1e">
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>واژه‌یاب</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var FA='ابپتثجچحخدذرزژسشصضطظعغفقکگلمنوهی';
var WORDS=['برادر','خواهر','خواهش','انسان','سرباز','سرهنگ','خلبان','ملوان','چوپان','نانوا','مهندس','کارگر','شاگرد','غریبه','انگشت','دندان','چشمان','لبخند','شجاعت','سلامت','درمان','بهبود','زندگی','گذشته','تاریخ','امروز','دیروز','دقیقه','ثانیه','سپیده','مهتاب','ستاره','سیاره','طوفان','باران','گرداب','گلزار','گلدان','جزیره','استخر','پلکان','باغچه','ایوان','انبار','میدان','بازار','مغازه','مدرسه','اداره','کلیسا','الفبا','عبارت','حکایت','ترانه','سنتور','پیانو','دایره','سینما','ماشین','رادیو','تاکسی','موتور','شلوار','جوراب','دستکش','چمدان','لیوان','فنجان','چنگال','بشقاب','سماور','قالین','زنجیر','کبریت','سندان','باتری','سنجاق','صابون','شامپو','لوبیا','بادام','انگور','انجیر','گیلاس','نارنج','زیتون','خربزه','طالبی','شکلات','نعناع','خرگوش','سنجاب','زرافه','میمون','دلفین','تمساح','گنجشک','کرگدن','روباه','مورچه','زنبور','گورخر','شاهین','پاییز','بهاری','خوردن','نوشتن','شنیدن','دویدن','پریدن','نشستن','شطرنج','پاسور','حافظه','خاطره','پنجره','دیوار','فریاد','سیمان','زندان'];
function norm(s){return String(s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[\s\u200c]+/g,'').trim();}
function feedback(g,a){g=norm(g);a=norm(a);var r=[],i,rem={};for(i=0;i<a.length;i++){rem[a[i]]=(rem[a[i]]||0)+1;}for(i=0;i<g.length;i++){if(g[i]===a[i]){r[i]='g';rem[g[i]]=(rem[g[i]]||0)-1;}}for(i=0;i<g.length;i++){if(r[i])continue;var c=g[i];if(rem[c]>0){r[i]='y';rem[c]--;}else{r[i]='k';}}return r;}
function isWin(fb){if(!fb||!fb.length)return false;for(var i=0;i<fb.length;i++){if(fb[i]!=='g')return false;}return true;}
function isValidGuess(s){return WORDS.indexOf(norm(s))>=0;}
function keyState(gs,a){var m={},i,j;for(i=0;i<gs.length;i++){var fb=feedback(gs[i],a);for(j=0;j<gs[i].length;j++){var c=gs[i][j],v=fb[j]==='g'?3:(fb[j]==='y'?2:1);if((m[c]||0)<v)m[c]=v;}}return m;}
function pickWord(rng){var i=rng?Math.floor(rng()*WORDS.length):Math.floor(Math.random()*WORDS.length);return WORDS[i];}
var WOG_LOGIC={FA:FA,WORDS:WORDS,norm:norm,feedback:feedback,isWin:isWin,isValidGuess:isValidGuess,keyState:keyState,pickWord:pickWord};
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
var FA_LETTERS=['آ','ا','ب','پ','ت','ث','ج','چ','ح','خ','د','ذ','ر','ز','ژ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];
function normFa(s){return (s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').replace(/\s+/g,' ').trim()}
function faKb(onKey,longKeys){var kb=ce('div');kb.style.cssText='display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:560px;margin-top:12px;direction:rtl';FA_LETTERS.forEach(function(ch){var b=ce('button','sec',ch);b.style.cssText='min-width:40px;padding:8px 4px';b.addEventListener('click',function(){onKey(ch)});kb.appendChild(b)});var lk=(longKeys&&longKeys.length&&typeof longKeys.forEach==='function')?longKeys:[];lk.forEach(function(x){var b=ce('button',null,x.label);b.addEventListener('click',function(){onKey(x.k)});kb.appendChild(b)});document.getElementById('app').appendChild(kb);return kb}

var app=$('#app'),N=5,TRIES=6,cells=[],kbwrap=null,share=null,ans='',rows=[],cur='',over=false;
var streak=parseInt(store.get('wog-wordle-streak')||'0',10)||0;
function hudUp(){var t=rows.length+(over?0:1);if(t>TRIES)t=TRIES;hud('برد پیاپی: '+fa(streak)+' · تلاش: '+fa(t)+' از '+fa(TRIES));}
function buildBoard(){var b=ce('div','wboard'),r,c;cells=[];for(r=0;r<TRIES;r++){var row=[];for(c=0;c<N;c++){var d=ce('div','wcell','');b.appendChild(d);row.push(d);}cells.push(row);}app.appendChild(b);}
function draw(){var r,c;for(r=0;r<TRIES;r++)for(c=0;c<N;c++){var el=cells[r][c],ch='';el.className='wcell';if(r<rows.length){ch=rows[r].g[c];el.classList.add(rows[r].fb[c]);}else if(r===rows.length&&c<cur.length){ch=cur[c];el.classList.add('pend');}el.textContent=ch;}}
function keyScope(){return (kbwrap&&kbwrap.children.length)?kbwrap:app;}
function colorKeys(){var m=L.keyState(rows.map(function(x){return x.g;}),ans),btns=keyScope().querySelectorAll('button,[data-key]'),i;for(i=0;i<btns.length;i++){var b=btns[i],t=(b.getAttribute('data-key')||b.textContent||'').trim();if(t.length===1&&m[t])b.classList.add('kb-'+m[t]);}}
function drawShare(){var h='',r,c;for(r=0;r<rows.length;r++){h+='<div class="sgrow">';for(c=0;c<N;c++)h+='<span class="sg '+rows[r].fb[c]+'"></span>';h+='</div>';}share.innerHTML=h;}
function addChar(ch){if(over)return;ch=L.norm(ch);if(ch.length!==1||L.FA.indexOf(ch)<0)return;if(cur.length>=N)return;cur+=ch;draw();}
function delChar(){if(over)return;if(!cur.length)return;cur=cur.slice(0,-1);draw();}
function submit(){if(over)return;if(cur.length<N){toast('واژه باید '+fa(N)+' حرف باشد');return;}if(!L.isValidGuess(cur)){toast('این واژه در فهرست نیست');return;}var fb=L.feedback(cur,ans);rows.push({g:cur,fb:fb});cur='';draw();colorKeys();drawShare();hudUp();if(L.isWin(fb)){over=true;streak++;store.set('wog-wordle-streak',String(streak));hudUp();ovl('آفرین! بردی','واژه: '+ans+' — تلاش '+fa(rows.length)+' از '+fa(TRIES),'بازی جدید',init);}else if(rows.length>=TRIES){over=true;streak=0;store.set('wog-wordle-streak','0');hudUp();ovl('باختی!','واژه درست: '+ans,'بازی جدید',init);}}
function init(){app.innerHTML='';ans=L.pickWord();rows=[];cur='';over=false;share=ce('div','wshare');buildBoard();app.appendChild(share);var bar=ce('div','wbar'),bd=ce('button','wbtn','پاک'),bg=ce('button','wbtn wgo','تایید'),bn=ce('button','wbtn wnew','بازی جدید');bd.onclick=delChar;bg.onclick=submit;bn.setAttribute('data-smoke','1');bn.onclick=init;bar.appendChild(bd);bar.appendChild(bg);bar.appendChild(bn);app.appendChild(bar);kbwrap=ce('div','kbwrap');app.appendChild(kbwrap);var kel=faKb(function(ch){addChar(ch);},{});if(kel&&kel.nodeType===1)kbwrap.appendChild(kel);draw();hudUp();}
document.addEventListener('keydown',function(e){if(e.key==='Enter'){submit();}else if(e.key==='Backspace'){e.preventDefault();delChar();}else{var k=L.norm(e.key||'');if(k.length===1)addChar(k);}});
init();
$('#hint').textContent='واژهٔ ۵ حرفی را در ۶ تلاش پیدا کن: سبز یعنی جای درست، طلایی یعنی حرف هست ولی جای دیگر، خاکستری یعنی نیست.';
})();
</script>
