<body data-cat="word" data-slug="word-chain" style="--g1:#d9a441;--g2:#e26d5c;--g1a:rgba(217,164,65,0.30);--g2a:rgba(226,109,92,0.42);--g1b:#e26d5c">

<header><h1>زنجیرهٔ واژه‌ها</h1><div class="hud" id="hud"></div></header>

<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC=(function(){
var DICT=["آب", "او", "بو", "تو", "گل", "ما", "من", "نه", "نی", "یخ", "یک", "پل", "جو", "شب", "ابر", "اسب", "باد", "بار", "برف", "پدر", "پسر", "توپ", "تاب", "جام", "چای", "خام", "خاک", "دست", "درس", "رود", "راه", "سرد", "سیل", "شام", "شیر", "شتر", "فیل", "کوه", "گاو", "ماه", "میز", "مرغ", "بهار", "خانه", "کتاب", "کاغذ", "مداد", "درخت", "چشمه", "دریا", "زمین", "شادی", "زیبا", "بزرگ", "کوچک", "شکر", "نمک", "فلفل", "روغن", "پنیر", "ماست", "گوشت", "برنج", "گندم", "لیمو", "هویج", "گوجه", "سبزی", "کباب", "جاده", "جنگل", "مسجد", "لباس", "کلاه", "چتر", "ساعت", "باران", "پنجره", "ستاره", "آسمان", "آزادی", "دوستی", "زندگی", "مدرسه", "نانوا", "انگور", "بیمار", "پیروز", "لبخند", "کوتاه", "شیرین", "سالاد", "روستا", "میدان", "آبشار", "جزیره", "زنبور", "مورچه", "خرگوش", "روباه", "میمون", "دریاچه", "موفقیت", "دانشجو", "سلامتی", "کتابچه", "خورشید", "درختان", "باغبان", "دوچرخه", "نارنجی", "پروانه", "کشاورز", "راهنما", "خلاقیت", "شیرینی", "گردشگر", "زمستان", "مرغابی", "خیابان", "بیابان", "گوسفند", "پیراهن", "دستکش", "موبایل", "راننده", "کهکشان", "مهمانی", "موسیقی", "بادکنک", "گلستان", "بوستان", "کوهستان", "مهربانی", "پرندگان", "دانشمند", "توانایی", "یادگیری", "پایداری", "تابستان", "بلدرچین", "سفرنامه", "سبزیجات", "ماهیگیر", "رودخانه", "هواپیما", "پاسپورت", "فرودگاه", "بادمجان", "مارمولک", "هوا", "رعد", "زود", "بوق", "دیو", "کبک", "کوچه", "تلفن", "قطار", "کشتی", "قایق", "ساحل", "ماهی", "نهنگ", "بازی", "طناب", "دختر", "خربزه", "چمدان", "مسافر", "یخچال", "رادیو", "ماشین", "تقویم", "شلوار", "شش", "یار", "وقت", "دل", "بز", "سر", "پا", "لب", "گوش", "چشم", "دفتر", "چراغ", "بازار", "برادر", "مادر", "خواهر", "دایی", "عمو", "پزشک", "معلم", "هنر", "خواب", "دندان", "زبان", "بدن", "خون", "ابرو", "انگشت", "بالا", "عسل"];
function norm(w){return String(w).replace(/ي/g,"ی").replace(/ك/g,"ک").replace(/[\s\u200c]+/g,"");}
function lastLetter(w){var s=norm(w);return s.charAt(s.length-1);}
function firstLetter(w){return norm(w).charAt(0);}
function canChain(prev,next){return lastLetter(prev)===firstLetter(next);}
function aiReply(prev,used,rng){
var last=lastLetter(prev),cands=[],i;
rng=rng||Math.random;
for(i=0;i<DICT.length;i++){var w=DICT[i];
if(firstLetter(w)===last&&used.indexOf(w)<0)cands.push(w);}
if(!cands.length)return null;
return cands[Math.floor(rng()*cands.length)];}
return {DICT:DICT,norm:norm,lastLetter:lastLetter,firstLetter:firstLetter,canChain:canChain,aiReply:aiReply};
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
var FA_LETTERS=['آ','ا','ب','پ','ت','ث','ج','چ','ح','خ','د','ذ','ر','ز','ژ','س','ش','ص','ض','ط','ظ','ع','غ','ف','ق','ک','گ','ل','م','ن','و','ه','ی'];
function normFa(s){return (s||'').replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/\u200c/g,' ').replace(/\s+/g,' ').trim()}
function faKb(onKey,longKeys){var kb=ce('div');kb.style.cssText='display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:560px;margin-top:12px;direction:rtl';FA_LETTERS.forEach(function(ch){var b=ce('button','sec',ch);b.style.cssText='min-width:40px;padding:8px 4px';b.addEventListener('click',function(){onKey(ch)});kb.appendChild(b)});var lk=(longKeys&&longKeys.length&&typeof longKeys.forEach==='function')?longKeys:[];lk.forEach(function(x){var b=ce('button',null,x.label);b.addEventListener('click',function(){onKey(x.k)});kb.appendChild(b)});document.getElementById('app').appendChild(kb);return kb}

var app=$('#app');
var me=0,ai=0,used=[],prev='',turn='me',tleft=15,timer=null,typed='',over=true,round=0;
var DSET={};
(function(){var i;for(i=0;i<L.DICT.length;i++)DSET[L.DICT[i]]=1;})();
function newGame(){me=0;ai=0;round=0;over=false;startRound();}
function startRound(){
used=[];typed='';round++;
var w=L.DICT[Math.floor(Math.random()*L.DICT.length)];
while(w.length<3)w=L.DICT[Math.floor(Math.random()*L.DICT.length)];
prev=w;turn='me';tleft=15;
if(timer)clearInterval(timer);
timer=setInterval(function(){
if(over||turn!=='me')return;
tleft--;paintTimer();
if(tleft<=0)fail('زمان تمام شد');
},1000);
render();paintHud();paintTimer();
}
function paintHud(){hud('من '+fa(me)+' — ربات '+fa(ai)+' · دور '+fa(round));}
function paintTimer(){
var bar=$('#tbarin');
if(bar){bar.style.width=Math.max(0,tleft/15*100)+'%';bar.style.background=tleft<=5?'#e26d5c':'#3fb8af';}
var tv=$('#tval');
if(tv)tv.textContent=fa(Math.max(0,tleft))+' ثانیه';
}
function fail(msg){
if(over||turn!=='me')return;
ai++;
toast(msg+' — امتیاز برای ربات');
paintHud();
if(ai>=5){end(false);return;}
setTimeout(startRound,900);
}
function okHuman(w){
used.push(w);prev=w;turn='ai';typed='';
render();paintHud();
setTimeout(function(){
if(over)return;
var rep=L.aiReply(prev,used,Math.random);
if(!rep){
me++;
toast('ربات جواب نداد! امتیاز برای تو');
paintHud();
if(me>=5){end(true);return;}
setTimeout(startRound,900);
return;
}
used.push(rep);prev=rep;turn='me';tleft=15;
render();paintHud();paintTimer();
},700);
}
function submit(){
if(over||turn!=='me')return;
var w=normFa(typed);
if(w.length<2){toast('واژهٔ بلندتری بنویس');return;}
if(!DSET[w]){toast('واژه در فهرست نیست');return;}
if(!L.canChain(prev,w)){toast('باید با «'+L.lastLetter(prev)+'» شروع شود');return;}
if(used.indexOf(w)>=0){toast('در این دور قبلاً گفته شده');return;}
okHuman(w);
}
function end(win){
over=true;
if(timer){clearInterval(timer);timer=null;}
if(win){
var w1=parseInt(store.get('wog-word-chain-wins')||'0',10)+1;
store.set('wog-word-chain-wins',String(w1));
}
ovl(win?'بردی!':'باختی!',fa(me)+' – '+fa(ai),'بازی جدید',newGame);
}
function render(){
app.innerHTML='';
var sc=ce('div','scores');
var s1=ce('div','scor'+(turn==='me'&&!over?' act':''));
var b1=ce('b');b1.textContent=fa(me);s1.appendChild(b1);
var l1=ce('div');l1.textContent='من';s1.appendChild(l1);
sc.appendChild(s1);
var s2=ce('div','scor'+(turn==='ai'&&!over?' act':''));
var b2=ce('b');b2.textContent=fa(ai);s2.appendChild(b2);
var l2=ce('div');l2.textContent='ربات';s2.appendChild(l2);
sc.appendChild(s2);
app.appendChild(sc);
var pw=ce('div','prevw');
pw.textContent=prev.slice(0,-1);
var sp=ce('span');sp.textContent=prev.charAt(prev.length-1);pw.appendChild(sp);
app.appendChild(pw);
var pv=ce('div','small');
pv.textContent='واژهٔ بعدی باید با «'+prev.charAt(prev.length-1)+'» شروع شود';
app.appendChild(pv);
var ty=ce('div','typed');ty.textContent=typed||'...';app.appendChild(ty);
var tb=ce('div','tbar');var ti=ce('div');ti.id='tbarin';tb.appendChild(ti);app.appendChild(tb);
var tv=ce('div','small');tv.id='tval';tv.textContent=fa(Math.max(0,tleft))+' ثانیه';app.appendChild(tv);
var uv=ce('div','small');uv.textContent='واژه‌های گفته‌شدهٔ این دور: '+fa(used.length);app.appendChild(uv);
var row=ce('div','row');
var sub=ce('button','gold');sub.textContent='ثبت';sub.onclick=submit;row.appendChild(sub);
var del=ce('button');del.textContent='پاک';del.onclick=function(){if(turn==='me'&&!over){typed=typed.slice(0,-1);render();}};row.appendChild(del);
var ps=ce('button','danger');ps.textContent='پاس';ps.onclick=function(){fail('پاس زدی');};row.appendChild(ps);
var ng=ce('button','danger');ng.textContent='بازی جدید';ng.setAttribute('data-smoke','1');ng.onclick=newGame;row.appendChild(ng);
app.appendChild(row);
var kbwrap=ce('div','row');
var kb=faKb(function(ch){
if(over||turn!=='me')return;
if(ch==='\u232B'||ch==='Backspace'){typed=typed.slice(0,-1);render();return;}
if(ch==='\u21B5'||ch==='Enter'){submit();return;}
if(ch&&ch.length===1){typed+=ch;render();}
});
if(kb&&kb.nodeType)kbwrap.appendChild(kb);
app.appendChild(kbwrap);
}
document.addEventListener('keydown',function(e){
if(e.key==='Enter')submit();
else if(e.key==='Backspace'){if(turn==='me'&&!over){typed=typed.slice(0,-1);render();}}
else if(e.key&&e.key.length===1&&turn==='me'&&!over){typed+=e.key;render();}
});
newGame();
})();
</script>
</body>
</html>
