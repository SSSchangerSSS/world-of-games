<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ویدیو پوکر | دنیای بازی‌ها</title>
<meta name="description" content="ویدیو پوکر جک-یا-بهتر با اعتبار ۱۰۰: پنج کارت بگیر، کارت‌های خوب را نگه دار و بقیه را عوض کن تا دست ارزنده بسازی.">
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#101a2e,#0b1220);color:#f3ead8;min-height:100dvh;user-select:none;display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:56px;overflow-x:hidden}
a.wog-home{position:fixed;top:10px;inset-inline-start:12px;z-index:99;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.45);color:#e8c073;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
a.wog-home:hover{background:rgba(217,164,65,.3)}
header{text-align:center;margin-bottom:8px}
h1{font-size:1.2rem;color:#d9a441}
.hud{color:#a8b3c9;font-size:.9rem;margin-top:2px;min-height:1.4em}
.hud b{color:#e8c073}
button,.wbtn{font-family:inherit;background:#d9a441;color:#221806;border:0;border-radius:10px;font-weight:700;padding:8px 16px;font-size:.95rem;cursor:pointer;touch-action:manipulation}
button.sec,.wbtn.sec{background:#14203a;color:#f3ead8;border:1px solid rgba(217,164,65,.35)}
button:disabled{opacity:.45;cursor:default}
#hint{color:#a8b3c9;font-size:.85rem;margin-top:10px;text-align:center;max-width:680px;line-height:1.9}
.wpanel{background:#14203a;border:1px solid rgba(217,164,65,.35);border-radius:14px;padding:14px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.wovl{position:fixed;inset:0;background:rgba(5,9,18,.85);display:flex;align-items:center;justify-content:center;z-index:90}
.wovl .box{background:#14203a;border:2px solid rgba(217,164,65,.5);border-radius:16px;padding:22px 28px;text-align:center;max-width:88vw}
.wovl h2{color:#e8c073;margin-bottom:8px}
.wovl p{color:#a8b3c9;margin-bottom:14px}
.wog-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid rgba(217,164,65,.5);color:#f3ead8;padding:8px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem}
.wog-toast.on{opacity:1}
.wgrid{display:grid;border:2px solid rgba(217,164,65,.5);border-radius:10px;overflow:hidden;direction:ltr;touch-action:manipulation}
.wgrid .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.cell.light{background:#e8dcc0}.cell.dark{background:#41527a}
.wcard{display:inline-flex;flex-direction:column;justify-content:space-between;width:52px;height:74px;background:#f6efe0;color:#1c2438;border-radius:7px;padding:3px 5px;font-weight:700;font-size:.9rem;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;flex:none}
.wcard.red{color:#c0392b}
.wcard.back{background:linear-gradient(135deg,#2c3a5e,#41527a);border:2px solid rgba(217,164,65,.5)}
.wcard.back:before{content:'❋';color:rgba(232,192,115,.55);align-self:center;font-size:1.3rem}
.wcard.small{width:38px;height:54px;font-size:.75rem;border-radius:5px}
.wcard.tiny{width:30px;height:44px;font-size:.65rem;border-radius:4px;padding:2px 3px}
.wcard.sel{outline:3px solid #e8c073;transform:translateY(-6px)}
.wcard .cn{font-size:.7rem;opacity:.85}.wcard .cv{align-self:flex-start}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:50px;gap:6px;margin-top:12px}
.wdpad.on{display:grid}
.wdpad button{font-size:1.15rem}
@media(pointer:coarse){.wdpad{display:grid}}
canvas{touch-action:none;border-radius:10px;border:2px solid rgba(217,164,65,.35);background:#0d1526}
.vp{display:flex;flex-direction:column;align-items:center;gap:12px;padding:12px}
.vp-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.vp-cell{display:flex;flex-direction:column;align-items:center;gap:4px}
.vp-cell .wcard{cursor:pointer}
.vp-hold{color:#d9a441;font-size:13px;font-weight:bold}
.vp-msg{color:#67b98a;min-height:22px;font-size:16px;text-align:center}
.btn{min-width:104px;min-height:46px;border:0;border-radius:12px;font-size:16px;font-family:inherit;cursor:pointer;touch-action:manipulation;padding:10px 16px}
.btn.big{min-width:140px}
.gold{background:#d9a441;color:#1a2438;font-weight:bold}
.turq{background:#3fb8af;color:#0e1626;font-weight:bold}
.ghost{background:#24365c;color:#cdd8ee}
</style>
</head>
<body>
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>❋ ویدیو پوکر ❋</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
function VPM(){
function deck52(){var d=[],s,r;for(s=0;s<4;s++)for(r=1;r<=13;r++)d.push({s:s,r:r});return d}
function shuf(a,rng){var r=rng||Math.random,i,j,t;for(i=a.length-1;i>0;i--){j=Math.floor(r()*(i+1));t=a[i];a[i]=a[j];a[j]=t}return a}
var PAY={royal:250,sf:50,'4k':25,fh:9,flush:6,straight:4,'3k':3,'2p':2,job:1,none:0};
function payout(cat){return PAY[cat]||0}
function evaluate5(cs){
 var s0=cs[0].s,flush=true,cnt={},i,k;
 for(i=0;i<5;i++){if(cs[i].s!==s0)flush=false;cnt[cs[i].r]=(cnt[cs[i].r]||0)+1}
 var ranks=[];for(k in cnt)ranks.push(+k);ranks.sort(function(a,b){return a-b});
 var c4=false,c3=false,pr=0,hp=false;
 for(k in cnt){var v=cnt[k];if(v===4)c4=true;else if(v===3)c3=true;else if(v===2){pr++;if(+k>=11)hp=true}}
 var st=false,br=false,n=ranks.length;
 if(n===5){
  if(ranks[4]-ranks[0]===4)st=true;
  else if(ranks[0]===1&&ranks[1]===10&&ranks[2]===11&&ranks[3]===12&&ranks[4]===13){st=true;br=true}
 }
 if(flush&&st)return br?'royal':'sf';
 if(c4)return'4k';
 if(c3&&pr===1)return'fh';
 if(flush)return'flush';
 if(st)return'straight';
 if(c3)return'3k';
 if(pr===2)return'2p';
 if(pr===1&&hp)return'job';
 return'none';
}
function newGame(rng){return{deck:shuf(deck52(),rng),hand:[],holds:[false,false,false,false,false],credits:100,bet:5,phase:'deal',cat:null,net:0}}
function startDeal(st,bet,rng){
 if(st.phase!=='deal')throw new Error('phase');
 if(bet===undefined||bet===null)bet=st.bet;
 if(bet!==5&&bet!==10&&bet!==25)throw new Error('bet');
 if(st.credits<bet)throw new Error('credits');
 st.bet=bet;st.credits-=bet;st.cat=null;st.net=-bet;
 if(st.deck.length<10)st.deck=shuf(deck52(),rng);
 st.hand=[];var i;for(i=0;i<5;i++)st.hand.push(st.deck.pop());
 st.holds=[false,false,false,false,false];st.phase='draw';
 return{dealt:true,hand:st.hand.slice(),phase:'draw',credits:st.credits}
}
function finishRound(st,holds){
 if(st.phase!=='draw')throw new Error('phase');
 var hs=holds||[0,0,0,0,0],i;
 for(i=0;i<5;i++){if(!hs[i])st.hand[i]=st.deck.pop();st.holds[i]=!!hs[i]}
 st.cat=evaluate5(st.hand);
 var win=payout(st.cat)*st.bet;st.credits+=win;st.net=win-st.bet;
 st.phase=st.credits>=5?'deal':'over';
 return{cat:st.cat,net:st.net,win:win,hand:st.hand.slice(),credits:st.credits,phase:st.phase}
}
function playRound(st,holds,bet,rng){
 if(st.phase==='deal')return startDeal(st,bet,rng);
 return finishRound(st,holds);
}
function bestHolds(h){
 var cat=evaluate5(h),i,j,s;
 var out=[false,false,false,false,false];
 function mark(ix){var m;for(m=0;m<ix.length;m++)out[ix[m]]=true}
 if(cat==='royal'||cat==='sf'||cat==='4k'||cat==='fh'||cat==='flush'||cat==='straight')return[true,true,true,true,true];
 var byRank={};for(i=0;i<5;i++){var r=h[i].r;(byRank[r]=byRank[r]||[]).push(i)}
 var trip=null,pairs=[];
 for(var rr in byRank){var g=byRank[rr];if(g.length===3)trip=+rr;else if(g.length===2)pairs.push(+rr)}
 if(trip!==null){mark(byRank[trip]);return out}
 if(pairs.length===2){mark(byRank[pairs[0]]);mark(byRank[pairs[1]]);return out}
 for(s=0;s<4;s++){var ix=[],hi=0;
  for(i=0;i<5;i++)if(h[i].s===s)ix.push(i);
  if(ix.length===4){for(j=0;j<4;j++){var rv=h[ix[j]].r;if(rv===1||rv>=10)hi++}
   if(hi===4){mark(ix);return out}}}
 if(pairs.length===1&&pairs[0]>=11){mark(byRank[pairs[0]]);return out}
 for(s=0;s<4;s++){var ix2=[];for(i=0;i<5;i++)if(h[i].s===s)ix2.push(i);
  if(ix2.length===4){mark(ix2);return out}}
 if(pairs.length===1){mark(byRank[pairs[0]]);return out}
 var his=[];for(i=0;i<5;i++)if(h[i].r>=11)his.push(i);
 if(his.length>0){mark(his);return out}
 return out;
}
return{evaluate5:evaluate5,payout:payout,playRound:playRound,newGame:newGame,bestHolds:bestHolds,startDeal:startDeal,deck52:deck52,shuf:shuf}
}
var WOG_LOGIC=VPM();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
var SUITS='♠♥♦♣';
function makeDeck(){var d=[];for(var s=0;s<4;s++)for(var r=1;r<=13;r++)d.push({s:s,r:r});return d}
function isRed(c){return c.s===1||c.s===2}
function suitOf(c){return SUITS[c.s]}
function rankShort(r){return r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r)}
function rankFa(r){return r===1?'آس':r===11?'سرباز':r===12?'بی‌بی':r===13?'شاه':fa(r)}
function cardEl(c,faceUp,size){var e=ce('div','wcard'+(faceUp?(isRed(c)?' red':''):' back')+(size?' '+size:''));if(faceUp)e.innerHTML='<span class="cn">'+rankShort(c.r)+suitOf(c)+'</span><span class="cv">'+suitOf(c)+'</span>';return e}
function cardStack(el,cs,faceUp,size){cs.forEach(function(c){el.appendChild(cardEl(c,faceUp,size))});return el}

var S=L.newGame(),bet=5,holds=[false,false,false,false,false],shown=false,msg='شرط را انتخاب کن و پخش بزن.';
var CATFA={royal:'رویال فلاش',sf:'استریت فلاش','4k':'چهارلایی',fh:'خانهٔ کامل',flush:'فلاش',straight:'استریت','3k':'سه‌تایی','2p':'دو جفت',job:'جفت سرباز یا بهتر',none:'دستی نیامد'};
function getBest(){var v=parseInt(store.get('wog-video-poker-best')||'0',10);return v>0?v:0}
function paint(){
 hud('اعتبار: <b>'+fa(S.credits)+'</b> · رکورد اعتبار: <b>'+fa(getBest())+'</b> · شرط: '+fa(bet));
 var app=$('#app');app.innerHTML='';
 var w=ce('div','vp');
 var row=ce('div','vp-row');
 var i;
 if(S.hand.length===5&&shown){
  for(i=0;i<5;i++){(function(idx){
   var cell=ce('div','vp-cell');
   var el=cardEl(S.hand[idx],true,'small');
   if(S.phase==='draw'){
    if(holds[idx])el.className+=' sel';
    el.onclick=function(){holds[idx]=!holds[idx];paint()};
   }
   cell.appendChild(el);
   if(S.phase==='draw'&&holds[idx])cell.appendChild(ce('div','vp-hold','نگه'));
   row.appendChild(cell)})(i)}
 }else{
  for(i=0;i<5;i++)row.appendChild(ce('div','wcard back',''));
 }
 w.appendChild(row);
 w.appendChild(ce('div','vp-msg',msg));
 var br=ce('div','vp-row');
 if(S.phase==='deal'){
  [5,10,25].forEach(function(b){
   var bb=ce('button','btn '+(b===bet?'gold':'ghost'),'شرط '+fa(b));
   bb.onclick=function(){bet=b;paint()};
   br.appendChild(bb)});
  var db=ce('button','btn gold big','پخش');db.setAttribute('data-smoke','deal');
  db.onclick=function(){
   if(S.credits<bet){toast('اعتبار کافی نیست!');return}
   L.playRound(S,null,bet);
   holds=[false,false,false,false,false];shown=true;
   msg='روی کارت‌هایی که می‌خواهی نگه داری بزن.';paint()};
  br.appendChild(db);
 }else if(S.phase==='draw'){
  var hb=ce('button','btn gold big','تعویض');hb.setAttribute('data-smoke','draw');
  hb.onclick=function(){
   var r=L.playRound(S,holds,0);
   if(S.credits>getBest())store.set('wog-video-poker-best',String(S.credits));
   msg=CATFA[r.cat]+' — '+(r.net>0?'برد: +'+fa(r.net):(r.net===0?'سر به سر':'باخت: '+fa(r.net)));
   paint();
   if(S.phase==='over')setTimeout(function(){ovl('اعتبار تمام شد!','اعتبار نهایی: '+fa(S.credits),'شروع دوباره',function(){S=L.newGame();bet=5;shown=false;msg='شرط را انتخاب کن و پخش بزن.';paint()})},150);
  };
  br.appendChild(hb);
 }
 w.appendChild(br);
 app.appendChild(w);
}
$('#hint').textContent='جفت سرباز (J) یا بالاتر برنده است؛ روی کارت بزن تا نگه داشته شود، بعد تعویض بزن.';
paint();
})();
</script>
</body>
</html>
