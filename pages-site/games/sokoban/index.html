<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>سوکوبان | دنیای بازی‌ها</title>
<meta name="description" content="۶ مرحلهٔ دست‌ساز سوکوبان: جعبه‌ها را فقط هل بده (هیچ کشیدنی در کار نیست) و همه را روی اهداف بگذار. حل‌پذیری همهٔ مرحله‌ها با جست‌وجوی BFS اثبات شده است.">
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#101a2e,#0b1220);color:#f3ead8;min-height:100dvh;user-select:none;display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:56px;overflow-x:hidden}
a.wog-home{position:fixed;top:10px;inset-inline-start:12px;z-index:99;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.45);color:#e8c073;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
a.wog-home:hover{background:rgba(217,164,65,.3)}
header{text-align:center;margin-bottom:8px}
h1{font-size:1.2rem;color:#d9a441}
.hud{color:#a8b3c9;font-size:.9rem;margin-top:2px;min-height:1.4em}
.hud b{color:#e8c073}
button,.wbtn{font-family:inherit;background:#d9a441;color:#221806;border:0;border-radius:10px;font-weight:700;padding:8px 16px;font-size:.95rem;cursor:pointer;touch-action:manipulation}
button.sec,.wbtn.sec{background:#14203a;color:#f3ead8;border:1px solid rgba(217,164,65,.35)}
button:disabled{opacity:.45;cursor:default}
#hint{color:#a8b3c9;font-size:.85rem;margin-top:10px;text-align:center;max-width:680px;line-height:1.9}
.wpanel{background:#14203a;border:1px solid rgba(217,164,65,.35);border-radius:14px;padding:14px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.wovl{position:fixed;inset:0;background:rgba(5,9,18,.85);display:flex;align-items:center;justify-content:center;z-index:90}
.wovl .box{background:#14203a;border:2px solid rgba(217,164,65,.5);border-radius:16px;padding:22px 28px;text-align:center;max-width:88vw}
.wovl h2{color:#e8c073;margin-bottom:8px}
.wovl p{color:#a8b3c9;margin-bottom:14px}
.wog-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid rgba(217,164,65,.5);color:#f3ead8;padding:8px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem}
.wog-toast.on{opacity:1}
.wgrid{display:grid;border:2px solid rgba(217,164,65,.5);border-radius:10px;overflow:hidden;direction:ltr;touch-action:manipulation}
.wgrid .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.cell.light{background:#e8dcc0}.cell.dark{background:#41527a}
.wcard{display:inline-flex;flex-direction:column;justify-content:space-between;width:52px;height:74px;background:#f6efe0;color:#1c2438;border-radius:7px;padding:3px 5px;font-weight:700;font-size:.9rem;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;flex:none}
.wcard.red{color:#c0392b}
.wcard.back{background:linear-gradient(135deg,#2c3a5e,#41527a);border:2px solid rgba(217,164,65,.5)}
.wcard.back:before{content:'❋';color:rgba(232,192,115,.55);align-self:center;font-size:1.3rem}
.wcard.small{width:38px;height:54px;font-size:.75rem;border-radius:5px}
.wcard.tiny{width:30px;height:44px;font-size:.65rem;border-radius:4px;padding:2px 3px}
.wcard.sel{outline:3px solid #e8c073;transform:translateY(-6px)}
.wcard .cn{font-size:.7rem;opacity:.85}.wcard .cv{align-self:flex-start}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:50px;gap:6px;margin-top:12px}
.wdpad.on{display:grid}
.wdpad button{font-size:1.15rem}
@media(pointer:coarse){.wdpad{display:grid}}
canvas{touch-action:none;border-radius:10px;border:2px solid rgba(217,164,65,.35);background:#0d1526}
.sokboard{display:grid;gap:2px;width:min(92vw,430px);margin:10px auto;direction:ltr;touch-action:manipulation}
.scell{aspect-ratio:1/1;background:#1b2a4a;border-radius:4px;position:relative}
.swall{background:#0d1830;border:1px solid #24365e}
.sgoal::after{content:'';position:absolute;top:30%;left:30%;right:30%;bottom:30%;border:2px solid #d9a441;border-radius:50%}
.sbox{background:#d9a441;box-shadow:inset 0 0 0 3px #a87a25}
.sboxon{background:#67b98a;box-shadow:inset 0 0 0 3px #3f8a63}
.splayer{background:#3fb8af;border-radius:50%;box-shadow:0 0 8px #3fb8af}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.wbtn{background:#d9a441;color:#08111f;border:none;border-radius:8px;padding:10px 18px;font-size:1rem;font-weight:700;min-height:44px;min-width:44px;cursor:pointer;touch-action:manipulation}
.wbtn:active{transform:scale(.96)}
.wsm{min-width:44px;padding:10px 0}
</style>
</head>
<body>
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>❋ سوکوبان ❋</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC=(function(){
var LEVELS=[
["#######","#     #","# @$. #","#     #","#######"],
["#######","#  .  #","#  $  #","# @   #","#     #","#######"],
["########","#      #","# @$ . #","#    $ #","#  .   #","#      #","########"],
["########","#      #","# .$   #","#  @   #","#   $  #","#  .   #","#      #","########"],
["########","#  .   #","# @$   #","#  $.  #","# .$   #","#      #","########"],
["#########","#       #","# .   . #","#  $$$  #","#   @   #","#   .   #","#       #","#########"]
];
function parse(level){var h=level.length,w=0,i,j;
 for(i=0;i<h;i++)if(level[i].length>w)w=level[i].length;
 var walls=[],goals=[],boxes=[],p=-1;
 for(i=0;i<h;i++)for(j=0;j<w;j++){var ch=level[i].charAt(j),id=i*w+j;
  if(ch==='#')walls[id]=1;
  if(ch==='.'||ch==='*'||ch==='+')goals[id]=1;
  if(ch==='$'||ch==='*')boxes.push(id);
  if(ch==='@'||ch==='+')p=id;}
 boxes.sort(function(a,b){return a-b;});
 return{w:w,h:h,walls:walls,goals:goals,boxes:boxes,p:p,player:p,moves:0,hist:[]};}
function step(i,d,w,h){if(d!=='U'&&d!=='D'&&d!=='L'&&d!=='R')return -1;
 var r=(i/w)|0,c=i%w;
 if(d==='U')r--;else if(d==='D')r++;else if(d==='L')c--;else c++;
 if(r<0||r>=h||c<0||c>=w)return -1;return r*w+c;}
function bIdx(st,i){for(var k=0;k<st.boxes.length;k++)if(st.boxes[k]===i)return k;return -1;}
function move(st,d){var np=step(st.p,d,st.w,st.h);if(np<0||st.walls[np])return false;
 var bi=bIdx(st,np),nb=-1;
 if(bi>=0){nb=step(np,d,st.w,st.h);if(nb<0||st.walls[nb]||bIdx(st,nb)>=0)return false;}
 st.hist.push({p:st.p,boxes:st.boxes.slice(),moves:st.moves});
 if(bi>=0)st.boxes[bi]=nb;
 st.p=np;st.moves++;return true;}
function undo(st){if(!st.hist.length)return false;var h=st.hist.pop();st.p=h.p;st.boxes=h.boxes;st.moves=h.moves;return true;}
function isWin(st){for(var k=0;k<st.boxes.length;k++)if(!st.goals[st.boxes[k]])return false;return true;}
function boxesOnGoals(st){var n=0,k;for(k=0;k<st.boxes.length;k++)if(st.goals[st.boxes[k]])n++;return n;}
function solve(level){var base=level.w?level:parse(level);
 var w=base.w,h=base.h,walls=base.walls,goals=base.goals;
 function win(b){for(var k=0;k<b.length;k++)if(!goals[b[k]])return false;return true;}
 var start=base.boxes.slice();
 if(win(start))return 0;
 var seen={};seen[base.p+'|'+start.join(',')]=1;
 var q=[{p:base.p,b:start}],depth=0;
 while(q.length){var nq=[];depth++;
  for(var qi=0;qi<q.length;qi++){var cur=q[qi];
   for(var di=0;di<4;di++){var d='URDL'.charAt(di),np=step(cur.p,d,w,h);
    if(np<0||walls[np])continue;
    var nb=cur.b.slice(),bi=nb.indexOf(np);
    if(bi>=0){var nn=step(np,d,w,h);
     if(nn<0||walls[nn]||nb.indexOf(nn)>=0)continue;
     nb[bi]=nn;nb.sort(function(a,b){return a-b;});}
    var key=np+'|'+nb.join(',');
    if(seen[key])continue;seen[key]=1;
    if(win(nb))return depth;
    nq.push({p:np,b:nb});}}
  q=nq;}
 return -1;}
return{LEVELS:LEVELS,parse:parse,move:move,undo:undo,isWin:isWin,boxesOnGoals:boxesOnGoals,solve:solve,step:step};
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
function makeCanvas(w,h){var cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.style.width='min(96vw,'+w+'px)';cv.style.height='auto';document.getElementById('app').appendChild(cv);return{cv:cv,ctx:cv.getContext('2d'),w:w,h:h}}
function keyState(){var k={};addEventListener('keydown',function(e){k[e.code]=1;if(/^(Arrow|Space)/.test(e.code))e.preventDefault()});addEventListener('keyup',function(e){k[e.code]=0});return k}
function bindPad(defs){var d=ce('div','wdpad');var grid={};defs.forEach(function(x){grid[x.k]=x});var cell=function(k){var b;if(k&&grid[k]){b=ce('button',null,grid[k].label);b.setAttribute('data-k',k)}else{b=ce('span');b.style.visibility='hidden'}d.appendChild(b)};cell(defs.length>2?defs[1].k:null);defs.forEach(function(x){cell(x.k)});cell(null);document.getElementById('app').appendChild(d);$$('[data-k]').forEach(function(b){var k=b.getAttribute('data-k');function on(e){e.preventDefault();ks[k]=1}function off(e){e.preventDefault();ks[k]=0}b.addEventListener('touchstart',on,{passive:false});b.addEventListener('touchend',off);b.addEventListener('mousedown',on);b.addEventListener('mouseup',off);b.addEventListener('mouseleave',off)})}
function rafStep(fn){var last=performance.now();function f(t){var dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);requestAnimationFrame(f)}requestAnimationFrame(f)}

var li=0,st=null,iv=null,secs=0,started=false;
var app=$('#app'),bar=ce('div','btnrow');app.appendChild(bar);
var i;
for(i=0;i<L.LEVELS.length;i++)(function(i){var b=ce('button','wbtn wsm',fa(i+1));
 b.setAttribute('data-smoke','1');b.addEventListener('click',function(){load(i);});bar.appendChild(b);})(i);
var bar2=ce('div','btnrow');app.appendChild(bar2);
function mkBtn(t,fn,sm){var b=ce('button','wbtn',t);if(sm)b.setAttribute('data-smoke','1');b.addEventListener('click',fn);bar2.appendChild(b);return b;}
mkBtn('شروع دوباره',function(){load(li);},true);
mkBtn('واگرد',function(){if(L.undo(st)){render();hudUpd();}else{toast('چیزی برای واگرد نیست');}});
var board=ce('div','sokboard');app.appendChild(board);
function render(){board.innerHTML='';board.style.gridTemplateColumns='repeat('+st.w+',1fr)';
 for(var r=0;r<st.h;r++)for(var c=0;c<st.w;c++){var id=r*st.w+c,cl='scell';
  if(st.walls[id])cl='scell swall';
  else{if(st.goals[id])cl+=' sgoal';
   if(st.boxes.indexOf(id)>=0)cl+=st.goals[id]?' sboxon':' sbox';
   if(id===st.p)cl+=' splayer';}
  board.appendChild(ce('div',cl));}}
function hudUpd(){hud('مرحله: '+fa(li+1)+' | حرکت‌ها: '+fa(st.moves)+' | جعبه‌ها: '+fa(L.boxesOnGoals(st))+' از '+fa(st.boxes.length)+' | زمان: '+fa(secs)+' ثانیه');}
function startT(){if(iv)return;iv=setInterval(function(){secs++;hudUpd();},1000);}
function stopT(){if(iv){clearInterval(iv);iv=null;}}
function doMove(d){if(L.move(st,d)){if(!started){started=true;startT();}
 render();hudUpd();if(L.isWin(st))winL();}}
function load(i){li=i;st=L.parse(L.LEVELS[i]);secs=0;started=false;stopT();render();hudUpd();}
function winL(){stopT();var key='wog-sokoban-best-'+li,prev=+(store.get(key)||0),nb=!prev||st.moves<prev;
 if(nb)store.set(key,String(st.moves));
 ovl('بردی!','مرحلهٔ '+fa(li+1)+' در '+fa(st.moves)+' حرکت حل شد'+(nb?' — رکورد!':''),
  li<L.LEVELS.length-1?'مرحلهٔ بعد':'از اول',function(){load(li<L.LEVELS.length-1?li+1:li);});}
var pad=bindPad([{k:'ArrowUp',label:'▲'},{k:'ArrowLeft',label:'◀'},{k:'ArrowRight',label:'▶'},{k:'ArrowDown',label:'▼'}]);
if(pad&&pad.nodeType&&!pad.parentNode)app.appendChild(pad);
function mapKey(code){return code==='ArrowUp'?'U':code==='ArrowDown'?'D':code==='ArrowLeft'?'L':code==='ArrowRight'?'R':null;}
document.addEventListener('keydown',function(e){var d=mapKey(e.code);if(d){e.preventDefault();doMove(d);}});
$('#hint').textContent='با فلش‌ها یا دکمه‌های لمسی حرکت کن؛ جعبه‌ها را روی دایره‌های طلایی هل بده. هل دادن ممکن است، کشیدن نه!';
load(0);
})();
</script>
</body>
</html>
