<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>پاسور | دنیای بازی‌ها</title>
<meta name="description" content="پاسور ایرانی سبک کازینو؛ گرفتن کارت‌های میز با برابری، مجموع یا تک خشت.">
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#101a2e,#0b1220);color:#f3ead8;min-height:100dvh;user-select:none;display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:56px;overflow-x:hidden}
a.wog-home{position:fixed;top:10px;inset-inline-start:12px;z-index:99;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.45);color:#e8c073;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
a.wog-home:hover{background:rgba(217,164,65,.3)}
header{text-align:center;margin-bottom:8px}
h1{font-size:1.2rem;color:#d9a441}
.hud{color:#a8b3c9;font-size:.9rem;margin-top:2px;min-height:1.4em}
.hud b{color:#e8c073}
button,.wbtn{font-family:inherit;background:#d9a441;color:#221806;border:0;border-radius:10px;font-weight:700;padding:8px 16px;font-size:.95rem;cursor:pointer;touch-action:manipulation}
button.sec,.wbtn.sec{background:#14203a;color:#f3ead8;border:1px solid rgba(217,164,65,.35)}
button:disabled{opacity:.45;cursor:default}
#hint{color:#a8b3c9;font-size:.85rem;margin-top:10px;text-align:center;max-width:680px;line-height:1.9}
.wpanel{background:#14203a;border:1px solid rgba(217,164,65,.35);border-radius:14px;padding:14px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.wovl{position:fixed;inset:0;background:rgba(5,9,18,.85);display:flex;align-items:center;justify-content:center;z-index:90}
.wovl .box{background:#14203a;border:2px solid rgba(217,164,65,.5);border-radius:16px;padding:22px 28px;text-align:center;max-width:88vw}
.wovl h2{color:#e8c073;margin-bottom:8px}
.wovl p{color:#a8b3c9;margin-bottom:14px}
.wog-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid rgba(217,164,65,.5);color:#f3ead8;padding:8px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem}
.wog-toast.on{opacity:1}
.wgrid{display:grid;border:2px solid rgba(217,164,65,.5);border-radius:10px;overflow:hidden;direction:ltr;touch-action:manipulation}
.wgrid .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.cell.light{background:#e8dcc0}.cell.dark{background:#41527a}
.wcard{display:inline-flex;flex-direction:column;justify-content:space-between;width:52px;height:74px;background:#f6efe0;color:#1c2438;border-radius:7px;padding:3px 5px;font-weight:700;font-size:.9rem;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;flex:none}
.wcard.red{color:#c0392b}
.wcard.back{background:linear-gradient(135deg,#2c3a5e,#41527a);border:2px solid rgba(217,164,65,.5)}
.wcard.back:before{content:'❋';color:rgba(232,192,115,.55);align-self:center;font-size:1.3rem}
.wcard.small{width:38px;height:54px;font-size:.75rem;border-radius:5px}
.wcard.tiny{width:30px;height:44px;font-size:.65rem;border-radius:4px;padding:2px 3px}
.wcard.sel{outline:3px solid #e8c073;transform:translateY(-6px)}
.wcard .cn{font-size:.7rem;opacity:.85}.wcard .cv{align-self:flex-start}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:50px;gap:6px;margin-top:12px}
.wdpad.on{display:grid}
.wdpad button{font-size:1.15rem}
@media(pointer:coarse){.wdpad{display:grid}}
canvas{touch-action:none;border-radius:10px;border:2px solid rgba(217,164,65,.35);background:#0d1526}
.ps-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0}
.ps-btn{padding:7px 16px;border-radius:9px;border:1px solid #567;cursor:pointer;font-family:inherit;font-size:14px;background:#fff}
.ps-cap{border-color:#2a9d8f;background:#e8f6f3}
.ps-dim{opacity:.45}
.ps-lbl{font-size:13px;opacity:.85}
.ps-hand{min-height:86px;padding:4px}
</style>
</head>
<body>
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>❋ پاسور ❋</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
function pShuffle(a,rng){rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pDeck(){var d=[],s,r;for(s=0;s<4;s++)for(r=1;r<=13;r++)d.push({s:s,r:r});return d;}
function pKey(c){return c.s*16+c.r;}
function pKhasht(c){return c.s===2&&c.r===10;}
function pVal(c){var v=0;if(c.r===1)v+=1;if(pKhasht(c))v+=3;if(c.s===3&&c.r===2)v+=2;return v;}
function pSubs(tb,rank){
  var out=[],cur=[];
  function dfs(i,sum){
    if(sum===rank&&cur.length>=2)out.push(cur.slice());
    if(i>=tb.length||sum>=rank)return;
    for(var j=i;j<tb.length;j++){
      if(sum+tb[j].r>rank)continue;
      cur.push(tb[j]);dfs(j+1,sum+tb[j].r);cur.pop();
    }
  }
  dfs(0,0);
  out.sort(function(a,b){return b.length-a.length;});
  return out;
}
function pOpts(st,card){
  var tb=st.table,opts=[],i,k,ok,taken={},same=[];
  if(!tb.length)return [];
  if(pKhasht(card))return [{cards:tb.slice(),sweep:true}];
  if(card.r>=11){
    for(i=0;i<tb.length;i++)if(tb[i].r===card.r)same.push(tb[i]);
    return same.length?[{cards:same}]:[];
  }
  var subs=pSubs(tb,card.r);
  for(i=0;i<subs.length;i++){
    ok=true;
    for(k=0;k<subs[i].length;k++){if(taken[pKey(subs[i][k])]){ok=false;break;}}
    if(!ok)continue;
    for(k=0;k<subs[i].length;k++)taken[pKey(subs[i][k])]=1;
    opts.push({cards:subs[i]});
  }
  for(i=0;i<tb.length;i++)if(tb[i].r===card.r)same.push(tb[i]);
  if(same.length){
    ok=true;
    for(k=0;k<same.length;k++){if(taken[pKey(same[k])]){ok=false;break;}}
    if(ok)opts.push({cards:same});
  }
  return opts;
}
function pDeal(st){
  if(st.hands[0].length||st.hands[1].length||!st.deck.length)return;
  st.hands[0]=st.deck.splice(0,4);
  st.hands[1]=st.deck.splice(0,4);
}
function pNewGame(rng){
  rng=rng||Math.random;
  var d=pShuffle(pDeck(),rng);
  var st={table:d.slice(0,4),deck:d.slice(4),hands:[[],[]],piles:[[],[]],lastCapturer:-1,turn:0,over:false};
  pDeal(st);
  return st;
}
function pApplyPlay(st,pi,hi,option){
  if(st.over)return;
  var hand=st.hands[pi],card=hand.splice(hi,1)[0],cap=[],i,j,k;
  if(option&&option.cards&&option.cards.length){
    if(pKhasht(card)){cap=st.table.slice();st.table=[];}
    else{
      for(i=0;i<option.cards.length;i++){
        k=pKey(option.cards[i]);
        for(j=0;j<st.table.length;j++){
          if(pKey(st.table[j])===k){cap.push(st.table.splice(j,1)[0]);break;}
        }
      }
    }
    st.piles[pi].push(card);
    for(i=0;i<cap.length;i++)st.piles[pi].push(cap[i]);
    st.lastCapturer=pi;
  }else{
    st.table.push(card);
  }
  st.turn=1-pi;
  pDeal(st);
  if(!st.hands[0].length&&!st.hands[1].length&&!st.deck.length){
    st.over=true;
    if(st.lastCapturer>=0&&st.table.length){
      var lp=st.piles[st.lastCapturer];
      for(i=0;i<st.table.length;i++)lp.push(st.table[i]);
      st.table=[];
    }
  }
}
function pAi(st){
  var hand=st.hands[st.turn],i,j,k,bi=-1,bo=null,bl=-1,bv=-1;
  if(!hand||!hand.length)return null;
  for(i=0;i<hand.length;i++){
    if(pKhasht(hand[i])&&st.table.length)return {handIdx:i,option:{cards:st.table.slice(),sweep:true}};
  }
  for(i=0;i<hand.length;i++){
    var os=pOpts(st,hand[i]);
    for(j=0;j<os.length;j++){
      var ln=os[j].cards.length,v=0;
      for(k=0;k<os[j].cards.length;k++)v+=pVal(os[j].cards[k]);
      if(ln>bl||(ln===bl&&v>bv)){bi=i;bo=os[j];bl=ln;bv=v;}
    }
  }
  if(bo)return {handIdx:bi,option:bo};
  var di=0,dw=pVal(hand[0])*100+hand[0].r*2+hand[0].s;
  for(i=1;i<hand.length;i++){
    var w=pVal(hand[i])*100+hand[i].r*2+hand[i].s;
    if(w<dw){dw=w;di=i;}
  }
  return {handIdx:di,option:null};
}
function pScore(st){
  function one(pile){
    var c={cards:pile.length,aces:0,khasht:0,khaj2:0,majority:0,total:0},i;
    for(i=0;i<pile.length;i++){
      if(pile[i].r===1)c.aces++;
      if(pKhasht(pile[i]))c.khasht=1;
      if(pile[i].s===3&&pile[i].r===2)c.khaj2=1;
    }
    return c;
  }
  var a=one(st.piles[0]),b=one(st.piles[1]);
  if(a.cards>b.cards)a.majority=1;else if(b.cards>a.cards)b.majority=1;
  a.total=a.aces+3*a.khasht+2*a.khaj2+3*a.majority;
  b.total=b.aces+3*b.khasht+2*b.khaj2+3*b.majority;
  return {p1:a,p2:b};
}
var WOG_LOGIC={
  newGame:pNewGame,
  legalCaptures:pOpts,
  applyPlay:pApplyPlay,
  aiChoose:pAi,
  scoreGame:pScore,
  isRoundOver:function(st){return !!st.over;}
};
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}
var SUITS='♠♥♦♣';
function makeDeck(){var d=[];for(var s=0;s<4;s++)for(var r=1;r<=13;r++)d.push({s:s,r:r});return d}
function isRed(c){return c.s===1||c.s===2}
function suitOf(c){return SUITS[c.s]}
function rankShort(r){return r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r)}
function rankFa(r){return r===1?'آس':r===11?'سرباز':r===12?'بی‌بی':r===13?'شاه':fa(r)}
function cardEl(c,faceUp,size){var e=ce('div','wcard'+(faceUp?(isRed(c)?' red':''):' back')+(size?' '+size:''));if(faceUp)e.innerHTML='<span class="cn">'+rankShort(c.r)+suitOf(c)+'</span><span class="cv">'+suitOf(c)+'</span>';return e}
function cardStack(el,cs,faceUp,size){cs.forEach(function(c){el.appendChild(cardEl(c,faceUp,size))});return el}

var st=null,pending=null;
var HINT='۱۰ خشت کل میز را جمع می‌کند؛ کارت عددی، کارت هم‌ارزش یا چند کارت با جمع برابر را می‌گیرد.';
function newGame(){
  st=L.newGame();pending=null;render();
  if(st.turn===1)setTimeout(aiTurn,650);
}
function render(){
  var app=$('#app');app.innerHTML='';
  var s=L.scoreGame(st),i;
  var dealt=52-st.deck.length,hn=Math.max(1,Math.ceil((dealt-4)/8));
  hud('دست '+fa(hn)+' از ۶ | امتیاز: شما '+fa(s.p1.total)+' - حریف '+fa(s.p2.total)+' | کارت‌های برده: '+fa(st.piles[0].length)+' / '+fa(st.piles[1].length));
  $('#hint').textContent=st.over?'بازی تمام شد':(st.turn===0?'نوبت شماست؛ روی یک کارت بزنید':'نوبت حریف...');
  var nb=ce('button','ps-btn','بازی جدید');
  nb.setAttribute('data-smoke','new');nb.onclick=function(){newGame();};
  app.appendChild(nb);
  var tb=ce('div','ps-row','');
  for(i=0;i<st.table.length;i++)tb.appendChild(cardEl(st.table[i],true));
  app.appendChild(tb);
  var op=ce('div','ps-row ps-opp','');
  op.appendChild(ce('span','ps-lbl','حریف: '+fa(st.hands[1].length)+' کارت'));
  for(i=0;i<st.hands[1].length;i++)op.appendChild(cardEl({s:0,r:2},false,'tiny'));
  app.appendChild(op);
  var hd=ce('div','ps-row ps-hand','');
  for(i=0;i<st.hands[0].length;i++){
    (function(idx){
      var c=st.hands[0][idx],e=cardEl(c,true);
      if(st.turn===0&&!st.over&&!pending){
        e.setAttribute('data-smoke','card'+idx);
        e.onclick=function(){tapHand(idx);};
      }else{
        e.classList.add('ps-dim');
      }
      hd.appendChild(e);
    })(i);
  }
  app.appendChild(hd);
  if(pending){
    var pr=ce('div','ps-row','');
    pr.appendChild(ce('span','ps-lbl','گزینه‌های گرفتن:'));
    for(i=0;i<pending.opts.length;i++){
      (function(oi){
        var b=ce('button','ps-btn ps-cap','بردن '+fa(pending.opts[oi].cards.length)+' کارت');
        b.setAttribute('data-smoke','cap'+oi);
        b.onclick=function(){pickOpt(oi);};
        pr.appendChild(b);
      })(i);
    }
    var pb=ce('button','ps-btn','بدون گرفتن');
    pb.setAttribute('data-smoke','pass');pb.onclick=pickPass;
    pr.appendChild(pb);
    app.appendChild(pr);
  }
}
function tapHand(idx){
  if(st.over||st.turn!==0)return;
  var c=st.hands[0][idx],os=L.legalCaptures(st,c);
  if(!os.length){L.applyPlay(st,0,idx,null);after();return;}
  if(os.length===1){L.applyPlay(st,0,idx,os[0]);after();return;}
  pending={idx:idx,opts:os};render();
}
function pickOpt(oi){
  if(!pending)return;
  var idx=pending.idx,o=pending.opts[oi];pending=null;
  L.applyPlay(st,0,idx,o);after();
}
function pickPass(){
  if(!pending)return;
  var idx=pending.idx;pending=null;
  L.applyPlay(st,0,idx,null);after();
}
function after(){
  render();
  if(L.isRoundOver(st)){setTimeout(end,600);return;}
  if(st.turn===1)setTimeout(aiTurn,550);
}
function aiTurn(){
  if(st.over||st.turn!==1){render();return;}
  var mv=L.aiChoose(st);
  if(mv)L.applyPlay(st,st.turn,mv.handIdx,mv.option);
  render();
  if(L.isRoundOver(st))setTimeout(end,600);
}
function end(){
  var s=L.scoreGame(st);
  var maj=s.p1.majority?'شما':(s.p2.majority?'حریف':'مساوی');
  var msg='کارت‌ها '+fa(s.p1.cards)+'-'+fa(s.p2.cards)+' | آک '+fa(s.p1.aces)+'-'+fa(s.p2.aces)+' | ۱۰ خشت: '+(s.p1.khasht?'شما':'حریف')+' | ۲ گشنیز: '+(s.p1.khaj2?'شما':'حریف')+' | اکثریت: '+maj;
  hud(msg+' | نتیجه نهایی: '+fa(s.p1.total)+' - '+fa(s.p2.total));
  ovl(s.p1.total>s.p2.total?'شما بردید!':(s.p1.total===s.p2.total?'مساوی شد':'حریف برد'),msg,'بازی جدید',newGame);
}
newGame();
})();
</script>
</body>
</html>
