<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#101a2e,#0b1220);color:#f3ead8;min-height:100dvh;user-select:none;display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:56px;overflow-x:hidden}
a.wog-home{position:fixed;top:10px;inset-inline-start:12px;z-index:99;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.45);color:#e8c073;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
a.wog-home:hover{background:rgba(217,164,65,.3)}
header{text-align:center;margin-bottom:8px}
h1{font-size:1.2rem;color:#d9a441}
.hud{color:#a8b3c9;font-size:.9rem;margin-top:2px;min-height:1.4em}
.hud b{color:#e8c073}
button,.wbtn{font-family:inherit;background:#d9a441;color:#221806;border:0;border-radius:10px;font-weight:700;padding:8px 16px;font-size:.95rem;cursor:pointer;touch-action:manipulation}
button.sec,.wbtn.sec{background:#14203a;color:#f3ead8;border:1px solid rgba(217,164,65,.35)}
button:disabled{opacity:.45;cursor:default}
#hint{color:#a8b3c9;font-size:.85rem;margin-top:10px;text-align:center;max-width:680px;line-height:1.9}
.wpanel{background:#14203a;border:1px solid rgba(217,164,65,.35);border-radius:14px;padding:14px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.wovl{position:fixed;inset:0;background:rgba(5,9,18,.85);display:flex;align-items:center;justify-content:center;z-index:90}
.wovl .box{background:#14203a;border:2px solid rgba(217,164,65,.5);border-radius:16px;padding:22px 28px;text-align:center;max-width:88vw}
.wovl h2{color:#e8c073;margin-bottom:8px}
.wovl p{color:#a8b3c9;margin-bottom:14px}
.wog-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid rgba(217,164,65,.5);color:#f3ead8;padding:8px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem}
.wog-toast.on{opacity:1}
.wgrid{display:grid;border:2px solid rgba(217,164,65,.5);border-radius:10px;overflow:hidden;direction:ltr;touch-action:manipulation}
.wgrid .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.cell.light{background:#e8dcc0}.cell.dark{background:#41527a}
.wcard{display:inline-flex;flex-direction:column;justify-content:space-between;width:52px;height:74px;background:#f6efe0;color:#1c2438;border-radius:7px;padding:3px 5px;font-weight:700;font-size:.9rem;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;flex:none}
.wcard.red{color:#c0392b}
.wcard.back{background:linear-gradient(135deg,#2c3a5e,#41527a);border:2px solid rgba(217,164,65,.5)}
.wcard.back:before{content:'❋';color:rgba(232,192,115,.55);align-self:center;font-size:1.3rem}
.wcard.small{width:38px;height:54px;font-size:.75rem;border-radius:5px}
.wcard.tiny{width:30px;height:44px;font-size:.65rem;border-radius:4px;padding:2px 3px}
.wcard.sel{outline:3px solid #e8c073;transform:translateY(-6px)}
.wcard .cn{font-size:.7rem;opacity:.85}.wcard .cv{align-self:flex-start}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:50px;gap:6px;margin-top:12px}
.wdpad.on{display:grid}
.wdpad button{font-size:1.15rem}
@media(pointer:coarse){.wdpad{display:grid}}
canvas{touch-action:none;border-radius:10px;border:2px solid rgba(217,164,65,.35);background:#0d1526}
*{box-sizing:border-box}
body{margin:0;background:#0d1526;color:#e8e4d8;font-family:Vazirmatn,Tahoma,sans-serif;text-align:center}
.wog-home{display:inline-block;margin:8px 14px 0;color:#3fb8af;text-decoration:none;font-size:.9em}
header{padding:6px 12px 0}
h1{margin:2px 0;color:#d9a441;font-size:1.3em}
#hud{color:#9fb0d0;min-height:1.4em}
#gb{display:grid;grid-template-columns:repeat(15,1fr);width:min(96vw,500px);height:min(96vw,500px);margin:0 auto;background:#152238;border:2px solid #24345a;border-radius:10px;overflow:hidden;touch-action:manipulation;cursor:pointer}
.gc{position:relative;border:1px solid #223254;display:flex;align-items:center;justify-content:center}
.gc.hp::before{content:'';position:absolute;width:5px;height:5px;border-radius:50%;background:#2c4270;z-index:0}
.gc.lm{box-shadow:inset 0 0 0 2px #d9a441;z-index:2}
.st{width:84%;height:84%;border-radius:50%;z-index:1;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.sb{background:radial-gradient(circle at 35% 30%,#6d7f9f,#131f38 72%);border:1px solid #d9a441}
.sw{background:radial-gradient(circle at 35% 30%,#ffffff,#c7d3e8 72%);border:1px solid #8496b8}
#tools{display:flex;gap:10px;justify-content:center;align-items:center;padding:10px;flex-wrap:wrap}
.btn{min-height:44px;min-width:110px;border:0;border-radius:10px;font-family:inherit;font-size:1em;cursor:pointer;background:#1b2846;color:#e8e4d8;touch-action:manipulation}
.btn.gold{background:#d9a441;color:#231803;font-weight:700}
#gm-cnt{color:#9fb0d0}
#hint{color:#9fb0d0;padding:0 16px;line-height:1.9}
</style>

<body>
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>❋ پنج‌درردیف ❋</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC=(function(){
'use strict';
var N=15,C=7;
function initial(){var b=[],r,c;for(r=0;r<N;r++){b.push([]);for(c=0;c<N;c++)b[r].push(0);}return {b:b,n:0};}
function inB(r,c){return r>=0&&r<N&&c>=0&&c<N;}
function place(st,r,c,p){if(!inB(r,c)||st.b[r][c]!==0)return false;st.b[r][c]=p;st.n=(st.n||0)+1;return true;}
function winB(b,r,c){
  var p=b[r][c];if(!p)return false;
  var D=[[0,1],[1,0],[1,1],[1,-1]],i,d,k,cnt;
  for(i=0;i<4;i++){d=D[i];cnt=1;
    for(k=1;k<5;k++){if(inB(r+d[0]*k,c+d[1]*k)&&b[r+d[0]*k][c+d[1]*k]===p)cnt++;else break;}
    for(k=1;k<5;k++){if(inB(r-d[0]*k,c-d[1]*k)&&b[r-d[0]*k][c-d[1]*k]===p)cnt++;else break;}
    if(cnt>=5)return true;}
  return false;
}
function winAt(st,r,c){return winB(st.b,r,c);}
function lineInfo(b,r,c,p,dr,dc){
  var n=1,e1=0,e2=0,k,rr,cc;
  for(k=1;k<5;k++){rr=r+dr*k;cc=c+dc*k;if(!inB(rr,cc))break;if(b[rr][cc]===p){n++;continue;}if(b[rr][cc]===0)e1=1;break;}
  for(k=1;k<5;k++){rr=r-dr*k;cc=c-dc*k;if(!inB(rr,cc))break;if(b[rr][cc]===p){n++;continue;}if(b[rr][cc]===0)e2=1;break;}
  return {n:n,o:e1+e2};
}
function patt(n,o){if(n>=5)return 1e7;if(n===4)return o===2?1e6:(o===1?1e5:0);if(n===3)return o===2?5e4:(o===1?5e3:0);if(n===2)return o===2?2e3:(o===1?200:0);return o===2?100:10;}
function scorePt(b,r,c,p){var D=[[0,1],[1,0],[1,1],[1,-1]],s=0,i,li;for(i=0;i<4;i++){li=lineInfo(b,r,c,p,D[i][0],D[i][1]);s+=patt(li.n,li.o);}return s;}
function hasN(b,r,c){var i,j;for(i=-2;i<=2;i++)for(j=-2;j<=2;j++){if((i||j)&&inB(r+i,c+j)&&b[r+i][c+j]!==0)return true;}return false;}
function aiMove(st,rng,pl){
  if(pl===undefined)pl=-1;
  var b=st.b,op=-pl,em=[],r,c,i;
  for(r=0;r<N;r++)for(c=0;c<N;c++)if(b[r][c]===0)em.push([r,c]);
  if(!em.length)return null;
  if((st.n||0)===0)return [C,C];
  for(i=0;i<em.length;i++){r=em[i][0];c=em[i][1];b[r][c]=pl;var w=winB(b,r,c);b[r][c]=0;if(w)return [r,c];}
  var blocks=[],bs=-1,bi=0;
  for(i=0;i<em.length;i++){r=em[i][0];c=em[i][1];b[r][c]=op;var w2=winB(b,r,c);b[r][c]=0;if(w2)blocks.push([r,c]);}
  if(blocks.length){
    for(i=0;i<blocks.length;i++){var s=scorePt(b,blocks[i][0],blocks[i][1],pl);if(s>bs){bs=s;bi=i;}}
    return blocks[bi];
  }
  var best=null,bsc=-1;
  for(i=0;i<em.length;i++){
    r=em[i][0];c=em[i][1];
    if(!hasN(b,r,c))continue;
    var sc=scorePt(b,r,c,pl)+0.85*scorePt(b,r,c,op)-(Math.abs(r-C)+Math.abs(c-C))+(rng?rng()*40:0);
    if(sc>bsc){bsc=sc;best=[r,c];}
  }
  if(best)return best;
  var bd=1e9;
  for(i=0;i<em.length;i++){var dd=Math.abs(em[i][0]-C)+Math.abs(em[i][1]-C);if(dd<bd){bd=dd;best=em[i];}}
  return best;
}
return {initial:initial,place:place,winAt:winAt,aiMove:aiMove,scorePt:scorePt};
})();
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}

var st=L.initial(),turn=1,over=false,busy=false,last=null,gb;
function cntp(p){var n=0,r,c;for(r=0;r<15;r++)for(c=0;c<15;c++)if(st.b[r][c]===p)n++;return n;}
function render(){
  var h='',r,c,cls,inner;
  for(r=0;r<15;r++)for(c=0;c<15;c++){
    cls='gc'+(((r===3||r===7||r===11)&&(c===3||c===7||c===11))?' hp':'');
    if(last&&last[0]===r&&last[1]===c)cls+=' lm';
    inner=st.b[r][c]?'<div class="st '+(st.b[r][c]>0?'sb':'sw')+'"></div>':'';
    h+='<div class="'+cls+'" data-r="'+r+'" data-c="'+c+'">'+inner+'</div>';
  }
  gb.innerHTML=h;
  document.getElementById('gm-cnt').innerHTML='سیاه '+fa(cntp(1))+' · سفید '+fa(cntp(-1));
}
function endGame(w){
  over=true;
  if(w===1)ovl('بردی!','پنج مهرهٔ سیاهِ شما در یک ردیف قرار گرفت.','بازی جدید',newGame);
  else if(w===-1)ovl('باختی!','سفید پنج‌تایی ساخت؛ دفعهٔ بعد چهارخط‌ها را زودتر ببندید.','بازی جدید',newGame);
  else ovl('مساوی','صفحه پر شد و برنده‌ای شکل نگرفت.','بازی جدید',newGame);
}
function newGame(){st=L.initial();turn=1;over=false;busy=false;last=null;render();hud('نوبت شما — مهرهٔ سیاه');}
function gclick(e){
  if(over||busy||turn!==1)return;
  var el=e.target;
  while(el&&el!==gb&&!(el.getAttribute&&el.getAttribute('data-r')))el=el.parentNode;
  if(!el||el===gb)return;
  var r=+el.getAttribute('data-r'),c=+el.getAttribute('data-c');
  if(st.b[r][c]){toast('این خانه اشغال است');return;}
  if(!L.place(st,r,c,1))return;
  last=[r,c];render();
  if(L.winAt(st,r,c)){endGame(1);return;}
  if(st.n>=225){endGame(0);return;}
  turn=-1;busy=true;hud('نوبت ربات…');
  setTimeout(function(){
    var mv=L.aiMove(st,Math.random);
    if(mv){L.place(st,mv[0],mv[1],-1);last=mv;}
    busy=false;turn=1;render();
    if(mv&&L.winAt(st,mv[0],mv[1])){endGame(-1);return;}
    if(st.n>=225){endGame(0);return;}
    hud('نوبت شما — مهرهٔ سیاه');
  },430);
}
var app=$('#app');
app.innerHTML='<div id="gb" dir="ltr"></div><div id="tools"><button id="ng" class="btn gold" data-smoke>بازی جدید</button><span id="gm-cnt"></span></div>';
gb=document.getElementById('gb');
gb.onclick=gclick;
$('#ng').onclick=newGame;
newGame();
$('#hint').textContent='روی تقاطع خالی بزنید؛ پنج مهرهٔ پیاپی در هر جهتی برنده است؛ چهارخط حریف را فوراً ببندید.';
})();
</script>
</body>
</html>
