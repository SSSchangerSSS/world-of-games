<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>رمزنگار | دنیای بازی‌ها</title>
<meta name="description" content="رمز ۴ رنگی از میان ۶ رنگ را در حدس ۱۰گانه کشف کن؛ راهنمای سیاه و سفید مسیر را نشان می‌دهد.">
<style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Regular.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Vazirmatn;src:url(../../fonts/Vazirmatn-Bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:linear-gradient(160deg,#101a2e,#0b1220);color:#f3ead8;min-height:100dvh;user-select:none;display:flex;flex-direction:column;align-items:center;padding:12px;padding-top:56px;overflow-x:hidden}
a.wog-home{position:fixed;top:10px;inset-inline-start:12px;z-index:99;background:rgba(217,164,65,.12);border:1px solid rgba(217,164,65,.45);color:#e8c073;text-decoration:none;padding:6px 12px;border-radius:10px;font-size:.85rem;font-weight:700}
a.wog-home:hover{background:rgba(217,164,65,.3)}
header{text-align:center;margin-bottom:8px}
h1{font-size:1.2rem;color:#d9a441}
.hud{color:#a8b3c9;font-size:.9rem;margin-top:2px;min-height:1.4em}
.hud b{color:#e8c073}
button,.wbtn{font-family:inherit;background:#d9a441;color:#221806;border:0;border-radius:10px;font-weight:700;padding:8px 16px;font-size:.95rem;cursor:pointer;touch-action:manipulation}
button.sec,.wbtn.sec{background:#14203a;color:#f3ead8;border:1px solid rgba(217,164,65,.35)}
button:disabled{opacity:.45;cursor:default}
#hint{color:#a8b3c9;font-size:.85rem;margin-top:10px;text-align:center;max-width:680px;line-height:1.9}
.wpanel{background:#14203a;border:1px solid rgba(217,164,65,.35);border-radius:14px;padding:14px}
.wrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;margin:8px 0}
.wovl{position:fixed;inset:0;background:rgba(5,9,18,.85);display:flex;align-items:center;justify-content:center;z-index:90}
.wovl .box{background:#14203a;border:2px solid rgba(217,164,65,.5);border-radius:16px;padding:22px 28px;text-align:center;max-width:88vw}
.wovl h2{color:#e8c073;margin-bottom:8px}
.wovl p{color:#a8b3c9;margin-bottom:14px}
.wog-toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#14203a;border:1px solid rgba(217,164,65,.5);color:#f3ead8;padding:8px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:95;pointer-events:none;font-size:.9rem}
.wog-toast.on{opacity:1}
.wgrid{display:grid;border:2px solid rgba(217,164,65,.5);border-radius:10px;overflow:hidden;direction:ltr;touch-action:manipulation}
.wgrid .cell{display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.cell.light{background:#e8dcc0}.cell.dark{background:#41527a}
.wcard{display:inline-flex;flex-direction:column;justify-content:space-between;width:52px;height:74px;background:#f6efe0;color:#1c2438;border-radius:7px;padding:3px 5px;font-weight:700;font-size:.9rem;line-height:1;box-shadow:0 2px 5px rgba(0,0,0,.45);cursor:pointer;touch-action:manipulation;flex:none}
.wcard.red{color:#c0392b}
.wcard.back{background:linear-gradient(135deg,#2c3a5e,#41527a);border:2px solid rgba(217,164,65,.5)}
.wcard.back:before{content:'❋';color:rgba(232,192,115,.55);align-self:center;font-size:1.3rem}
.wcard.small{width:38px;height:54px;font-size:.75rem;border-radius:5px}
.wcard.tiny{width:30px;height:44px;font-size:.65rem;border-radius:4px;padding:2px 3px}
.wcard.sel{outline:3px solid #e8c073;transform:translateY(-6px)}
.wcard .cn{font-size:.7rem;opacity:.85}.wcard .cv{align-self:flex-start}
.wcard.back .cn,.wcard.back .cv{display:none}
.wdpad{display:none;grid-template-columns:repeat(3,58px);grid-auto-rows:50px;gap:6px;margin-top:12px}
.wdpad.on{display:grid}
.wdpad button{font-size:1.15rem}
@media(pointer:coarse){.wdpad{display:grid}}
canvas{touch-action:none;border-radius:10px;border:2px solid rgba(217,164,65,.35);background:#0d1526}
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#e8ecf4;font-family:Tahoma,sans-serif}
header h1{color:#d9a441;font-size:20px}
#app{padding:8px;text-align:center}
.rowc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.btn{min-height:42px;padding:8px 16px;border-radius:10px;border:1px solid #2a3b5e;background:#14203a;color:#e8ecf4;font-size:15px;cursor:pointer;touch-action:manipulation}
.btn.gold{background:#d9a441;color:#14203a;border-color:#d9a441;font-weight:bold}
.btn:disabled{opacity:.4}
.pal{display:flex;gap:10px;justify-content:center;margin:10px 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;cursor:pointer;touch-action:manipulation}
.sw.selc{border-color:#fff}
.grow{display:flex;gap:10px;justify-content:center;margin:8px 0}
.slot{width:52px;height:52px;border-radius:12px;border:2px dashed #2a3b5e;background:#14203a;color:#8fa0c0;font-size:18px;cursor:pointer;touch-action:manipulation}
.legend{color:#8fa0c0;font-size:13px}
.hist{max-width:340px;margin:10px auto;display:flex;flex-direction:column;gap:6px}
.hrow{display:flex;align-items:center;gap:8px;justify-content:center;background:#14203a;border:1px solid #2a3b5e;border-radius:10px;padding:6px}
.peg{width:22px;height:22px;border-radius:50%;display:inline-block}
.fb{display:inline-flex;gap:4px}
.pb,.pw{width:14px;height:14px;border-radius:50%;display:inline-block}
.pb{background:#0b1220;border:2px solid #d9a441}
.pw{background:transparent;border:2px solid #cfd8ea}
.hnum{color:#8fa0c0;font-size:12px}
</style>
</head>
<body>
<a class="wog-home" href="../../index.html">⌂ خانه</a>
<header><h1>❋ رمزنگار ❋</h1><div class="hud" id="hud"></div></header>
<div id="app"></div>
<p id="hint"></p>
<div class="wog-toast" id="wog-toast"></div>
<script>
(function () {
'use strict';
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
/*WOG_LOGIC_START*/
var WOG_LOGIC = {
  genCode: function (rng) {
    var r = rng || Math.random, code = [], i;
    for (i = 0; i < 4; i++) code.push(Math.floor(r() * 6));
    return code;
  },
  feedback: function (guess, code) {
    var black = 0, white = 0, i, cLeft = [], gLeft = [];
    for (i = 0; i < 6; i++) { cLeft.push(0); gLeft.push(0); }
    for (i = 0; i < code.length; i++) {
      if (guess[i] === code[i]) black++;
      else { cLeft[code[i]]++; gLeft[guess[i]]++; }
    }
    for (i = 0; i < 6; i++) white += Math.min(cLeft[i], gLeft[i]);
    return { black: black, white: white };
  },
  isWin: function (fb) { return !!fb && fb.black === 4; }
};
/*WOG_LOGIC_END*/
var L = WOG_LOGIC;
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function ce(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
var FA_D='۰۱۲۳۴۵۶۷۸۹';
function fa(n){return String(n).replace(/\d/g,function(d){return FA_D[+d]})}
function shuffle(a,rng){a=a.slice();rng=rng||Math.random;for(var i=a.length-1;i>0;i--){var j=Math.floor(rng()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rint(a,b,rng){rng=rng||Math.random;return a+Math.floor(rng()*(b-a+1))}
function pick(arr,rng){rng=rng||Math.random;return arr[Math.floor(rng()*arr.length)]}
function clamp(v,a,b){return v<a?a:v>b?b:v}
var _toastT=0;
function toast(msg,ms){var t=$('#wog-toast');if(!t)return;t.textContent=msg;t.classList.add('on');clearTimeout(_toastT);_toastT=setTimeout(function(){t.classList.remove('on')},ms||1800)}
function hud(html){var h=$('#hud');if(h)h.innerHTML=html}
function ovl(title,sub,btn,cb){var o=ce('div','wovl');var b=ce('div','box');b.appendChild(ce('h2',null,title));if(sub)b.appendChild(ce('p',null,sub));var bt=ce('button',null,btn);bt.setAttribute('data-smoke','');bt.addEventListener('click',function(){o.remove();cb&&cb()});b.appendChild(bt);o.appendChild(b);document.body.appendChild(o);return o}
function bestOf(key,val){var b=parseInt(store.get(key)||'0',10)||0;if(val>b)store.set(key,String(val));return Math.max(b,val)}
function storeBest(key){return parseInt(store.get(key)||'0',10)||0}

var COLORS = ['#e26d5c', '#67b98a', '#4a90d9', '#d9a441', '#9b6dd6', '#3fb8af'];
var CNAMES = ['قرمز', 'سبز', 'آبی', 'زرد', 'بنفش', 'فیروزه‌ای'];
var st = null, sel = -1, APP = $('#app');
function newGame() {
  st = { code: L.genCode(Math.random), guess: [-1, -1, -1, -1], hist: [], done: false };
  sel = -1;
  hud('حدس ' + fa(1) + ' از ' + fa(10));
  draw();
}
function codeNames(code) {
  var a = [], i;
  for (i = 0; i < code.length; i++) a.push(CNAMES[code[i]]);
  return a.join('، ');
}
function draw() {
  APP.innerHTML = '';
  var box = ce('div', 'mbox');
  var top = ce('div', 'rowc');
  var bn = ce('button', 'btn gold', 'بازی جدید');
  bn.setAttribute('data-smoke', '1');
  bn.onclick = newGame;
  top.appendChild(bn);
  box.appendChild(top);
  var pal = ce('div', 'pal'), i, k;
  for (i = 0; i < 6; i++) {
    (function (c) {
      var s = ce('button', 'sw' + (sel === c ? ' selc' : ''));
      s.type = 'button';
      s.style.background = COLORS[c];
      s.onclick = function () { if (!st.done) { sel = c; draw(); } };
      pal.appendChild(s);
    })(i);
  }
  box.appendChild(pal);
  var gr = ce('div', 'grow');
  for (k = 0; k < 4; k++) {
    (function (k) {
      var s = ce('button', 'slot');
      s.type = 'button';
      var v = st.guess[k];
      if (v >= 0) s.style.background = COLORS[v];
      else s.textContent = '؟';
      s.onclick = function () {
        if (st.done) return;
        if (sel >= 0) st.guess[k] = sel;
        else { var nx = st.guess[k] + 1; if (nx > 5) nx = -1; st.guess[k] = nx; }
        draw();
      };
      gr.appendChild(s);
    })(k);
  }
  box.appendChild(gr);
  var ops = ce('div', 'rowc');
  var clr = ce('button', 'btn', 'پاک کردن');
  clr.onclick = function () { if (!st.done) { st.guess = [-1, -1, -1, -1]; draw(); } };
  var ok = true;
  for (k = 0; k < 4; k++) if (st.guess[k] < 0) ok = false;
  var sub = ce('button', 'btn gold', 'ثبت حدس');
  sub.setAttribute('data-smoke', '1');
  sub.disabled = !ok || st.done;
  sub.onclick = submit;
  ops.appendChild(clr); ops.appendChild(sub);
  box.appendChild(ops);
  box.appendChild(ce('p', 'legend', '● رنگ درست در جای درست · ○ رنگ درست در جای نادرست'));
  var hl = ce('div', 'hist');
  for (i = st.hist.length - 1; i >= 0; i--) {
    var it = st.hist[i], row = ce('div', 'hrow');
    for (k = 0; k < 4; k++) { var d = ce('span', 'peg'); d.style.background = COLORS[it.g[k]]; row.appendChild(d); }
    var fb = ce('span', 'fb');
    for (var b = 0; b < it.fb.black; b++) fb.appendChild(ce('span', 'pb'));
    for (var w = 0; w < it.fb.white; w++) fb.appendChild(ce('span', 'pw'));
    row.appendChild(fb);
    row.appendChild(ce('span', 'hnum', fa(i + 1)));
    hl.appendChild(row);
  }
  box.appendChild(hl);
  APP.appendChild(box);
}
function submit() {
  if (st.done) return;
  var fb = L.feedback(st.guess, st.code);
  st.hist.push({ g: st.guess.slice(), fb: fb });
  if (L.isWin(fb)) {
    st.done = true;
    var bk = store.get('wog-mastermind-best');
    var best = bk === null ? st.hist.length : Math.min(parseInt(bk, 10) || st.hist.length, st.hist.length);
    store.set('wog-mastermind-best', '' + best);
    hud('رمز شکسته شد در ' + fa(st.hist.length) + ' حدس · رکورد: ' + fa(best));
    draw();
    ovl('رمز شکسته شد!', 'در ' + fa(st.hist.length) + ' حدس · رکورد: ' + fa(best), 'بازی جدید', newGame);
    return;
  }
  if (st.hist.length >= 10) {
    st.done = true;
    hud('باختی! رمز: ' + codeNames(st.code));
    draw();
    ovl('باختی!', 'رمز بود: ' + codeNames(st.code), 'بازی جدید', newGame);
    return;
  }
  st.guess = [-1, -1, -1, -1];
  hud('حدس ' + fa(st.hist.length + 1) + ' از ' + fa(10));
  draw();
}
$('#hint').textContent = 'از پالت رنگ انتخاب کن و روی خانه بزن، یا هر خانه را لمس کن تا رنگش بچرخد. ۱۰ حدس داری.';
newGame();
})();
</script>
</body>
</html>
