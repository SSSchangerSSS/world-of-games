<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>مین‌یاب — World of Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Vazirmatn, Tahoma, sans-serif; background: linear-gradient(160deg, #101a2e, #0b1220);
         color: #f3ead8; min-height: 100dvh; user-select: none; -webkit-user-select: none;
         display: flex; flex-direction: column; align-items: center; padding: 18px 10px 30px; }
  header { text-align: center; }
  header h1 { color: #d9a441; font-size: 1.55rem; letter-spacing: .5px; }
  .hud { color: #a8b3c9; margin-top: 8px; font-size: .95rem; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .hud b { color: #e8c073; }
  .bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; justify-content: center; }
  .btn { background: #d9a441; color: #221806; border: none; border-radius: 10px; font-weight: 700;
         font-family: inherit; font-size: .92rem; padding: 9px 14px; cursor: pointer; touch-action: manipulation; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: #1c2a47; color: #e8c073; border: 1px solid rgba(217,164,65,.35); }
  .btn.active, .btn.on { background: #d9a441; color: #221806; }
  #board { width: min(92vw, 440px); aspect-ratio: 1; margin-top: 12px; display: grid; gap: 3px; padding: 7px;
           background: #14203a; border: 1px solid rgba(217,164,65,.35); border-radius: 12px;
           box-shadow: 0 12px 36px rgba(0,0,0,.45); }
  .cell { border: none; border-radius: 5px; background: #233560; color: #f3ead8; font-family: inherit;
          font-weight: 800; font-size: clamp(.75rem, 3.6vw, 1rem); cursor: pointer; touch-action: manipulation;
          padding: 0; display: flex; align-items: center; justify-content: center; position: relative;
          box-shadow: inset 0 -2px 0 rgba(0,0,0,.28); transition: background .1s; }
  .cell:hover { background: #2d4275; }
  .cell:focus-visible { outline: 2px solid #3fb8af; outline-offset: 1px; }
  .cell:disabled { cursor: default; }
  .cell.open, .cell.open:hover { background: #0f1930; box-shadow: inset 0 1px 4px rgba(0,0,0,.55); }
  .cell.boom, .cell.boom:hover { background: #7e2f23; }
  .n1{color:#3fb8af} .n2{color:#67b98a} .n3{color:#e26d5c} .n4{color:#b48ee0}
  .n5{color:#d9a441} .n6{color:#5aa9e6} .n7{color:#d983b8} .n8{color:#aab6c9}
  .mine-dot { width: 58%; aspect-ratio: 1; border-radius: 50%;
              background: radial-gradient(circle at 35% 32%, #93a0b5, #1d2946 70%); }
  .flag { position: relative; width: 12px; height: 18px; }
  .flag::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2.5px;
                  background: #e8e0cf; border-radius: 2px; }
  .flag::after { content: ''; position: absolute; left: 2.5px; top: 0; width: 0; height: 0;
                 border-top: 5px solid transparent; border-bottom: 5px solid transparent;
                 border-left: 9.5px solid #d9a441; }
  .wrongx { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            color: #e26d5c; font-size: .9rem; font-weight: 800; text-shadow: 0 0 4px #000; }
  #hint { color: #a8b3c9; font-size: .85rem; margin-top: 14px; text-align: center; max-width: 460px; line-height: 1.9; }
  #overlay { position: fixed; inset: 0; background: rgba(6,10,19,.66); display: flex; align-items: center;
             justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  #overlay.show { opacity: 1; pointer-events: auto; }
  .panel { background: #14203a; border: 1px solid rgba(217,164,65,.35); border-radius: 16px;
           padding: 26px 34px; text-align: center; box-shadow: 0 14px 44px rgba(0,0,0,.55); max-width: 86vw; }
  .panel h2 { color: #d9a441; font-size: 1.5rem; margin-bottom: 8px; }
  .panel p { color: #a8b3c9; margin-bottom: 18px; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>❋ مین‌یاب ❋</h1>
  <div class="hud">مین <b id="mc">۰ / ۰</b> · زمان <b id="tm">۰</b> · رکورد <b id="bs">—</b></div>
</header>
<div class="bar">
  <button class="btn ghost lv active" data-lv="easy">آسان ۹×۹</button>
  <button class="btn ghost lv" data-lv="med">متوسط ۱۲×۱۰</button>
  <button class="btn ghost" id="flagmode" aria-pressed="false">حالت پرچم: خاموش</button>
  <button class="btn ghost" id="again">شروع دوباره</button>
</div>
<div id="board"></div>
<div id="hint">اولین کلیک همیشه امن است. عدد هر خانه یعنی چند مین در خانه‌های اطراف است؛ با «حالت پرچم» یا راست‌کلیک خانه‌های مین‌دار را علامت بزن. با یافتن همه خانه‌های امن می‌بری.</div>
<div id="overlay">
  <div class="panel">
    <h2 id="ptitle"></h2>
    <p id="ptext"></p>
    <button class="btn" id="pagain">شروع دوباره</button>
  </div>
</div>
<script>
(function () {
  'use strict';
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var FD = '۰۱۲۳۴۵۶۷۸۹';
  function fa(n) { return String(n).replace(/[0-9]/g, function (c) { return FD[+c]; }); }

  var LV = {
    easy: { name: 'آسان', rows: 9, cols: 9, mines: 10, key: 'wog-mines-best-easy' },
    med: { name: 'متوسط', rows: 10, cols: 12, mines: 22, key: 'wog-mines-best-med' }
  };
  var boardEl = document.getElementById('board');
  var mcEl = document.getElementById('mc');
  var tmEl = document.getElementById('tm');
  var bsEl = document.getElementById('bs');
  var overlay = document.getElementById('overlay');
  var pTitle = document.getElementById('ptitle');
  var pText = document.getElementById('ptext');
  var flagBtn = document.getElementById('flagmode');

  var lvId = 'easy', cfg = LV.easy;
  var grid = [], over = true, started = false, flags = 0, opened = 0;
  var timer = null, t0 = 0, elapsed = 0, flagMode = false;

  function nb(i) {
    var r = Math.floor(i / cfg.cols), c = i % cfg.cols, out = [], dr, dc;
    for (dr = -1; dr <= 1; dr++) for (dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      var nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < cfg.rows && nc >= 0 && nc < cfg.cols) out.push(nr * cfg.cols + nc);
    }
    return out;
  }
  function updateMines() { mcEl.textContent = fa(flags) + ' / ' + fa(cfg.mines); }
  function showBest() {
    var b = parseInt(store.get(cfg.key) || '', 10);
    bsEl.textContent = isNaN(b) ? '—' : fa(b) + ' ثانیه';
  }
  function tick() { elapsed = Math.floor((Date.now() - t0) / 1000); tmEl.textContent = fa(elapsed); }
  function startTimer() { t0 = Date.now(); elapsed = 0; timer = setInterval(tick, 250); tick(); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; tick(); } }

  function newGame() {
    over = false; started = false; flags = 0; opened = 0; elapsed = 0;
    if (timer) { clearInterval(timer); timer = null; }
    tmEl.textContent = '۰';
    updateMines();
    showBest();
    overlay.classList.remove('show');
    boardEl.innerHTML = '';
    boardEl.style.gridTemplateColumns = 'repeat(' + cfg.cols + ',1fr)';
    boardEl.style.gridTemplateRows = 'repeat(' + cfg.rows + ',1fr)';
    boardEl.style.aspectRatio = cfg.cols + ' / ' + cfg.rows;
    grid = [];
    for (var i = 0; i < cfg.rows * cfg.cols; i++) {
      (function (idx) {
        var c = document.createElement('button');
        c.className = 'cell';
        c.addEventListener('click', function () { hit(idx); });
        c.addEventListener('contextmenu', function (e) { e.preventDefault(); toggleFlag(idx); });
        boardEl.appendChild(c);
        grid.push({ m: false, o: false, f: false, n: 0, el: c });
      })(i);
    }
  }

  /* مین‌ها پس از اولین کلیک چیده می‌شوند — نه در خانه اول و نه در همسایه‌هایش */
  function plant(first) {
    var banned = {};
    banned[first] = true;
    nb(first).forEach(function (n) { banned[n] = true; });
    var pool = [], k, m, j, t;
    for (k = 0; k < grid.length; k++) if (!banned[k]) pool.push(k);
    for (m = 0; m < cfg.mines; m++) {
      j = m + Math.floor(Math.random() * (pool.length - m));
      t = pool[m]; pool[m] = pool[j]; pool[j] = t;
      grid[pool[m]].m = true;
    }
    for (k = 0; k < grid.length; k++) {
      if (!grid[k].m) {
        var s = 0;
        nb(k).forEach(function (n) { if (grid[n].m) s++; });
        grid[k].n = s;
      }
    }
    startTimer();
  }

  function hit(i) {
    if (over) return;
    var c = grid[i];
    if (flagMode) { toggleFlag(i); return; }
    if (c.f || c.o) return;
    if (!started) { started = true; plant(i); }
    if (c.m) { boom(i); return; }
    openFrom(i);
    if (opened === grid.length - cfg.mines) winGame();
  }

  function toggleFlag(i) {
    if (over) return;
    var c = grid[i];
    if (c.o) return;
    if (!c.f && flags >= cfg.mines) return;
    c.f = !c.f;
    flags += c.f ? 1 : -1;
    if (c.f) {
      var f = document.createElement('span');
      f.className = 'flag';
      c.el.innerHTML = '';
      c.el.appendChild(f);
    } else {
      c.el.innerHTML = '';
    }
    updateMines();
  }

  /* بازکردن آبشاری خانه‌های خالی با پشته (بدون بازگشتی) */
  function openFrom(start) {
    var st = [start];
    while (st.length) {
      var k = st.pop(), c = grid[k];
      if (c.o || c.f || c.m) continue;
      c.o = true;
      opened++;
      var el = c.el;
      el.disabled = true;
      el.innerHTML = '';
      if (c.n > 0) { el.textContent = fa(c.n); el.classList.add('n' + c.n); }
      el.classList.add('open');
      if (c.n === 0) nb(k).forEach(function (n) { if (!grid[n].o && !grid[n].f && !grid[n].m) st.push(n); });
    }
  }

  function boom(hitIdx) {
    over = true;
    stopTimer();
    for (var k = 0; k < grid.length; k++) {
      var c = grid[k];
      if (c.m) {
        if (!c.f) {
          var d = document.createElement('span');
          d.className = 'mine-dot';
          c.el.innerHTML = '';
          c.el.appendChild(d);
        }
        c.el.disabled = true;
        c.el.classList.add('open');
        if (k === hitIdx) c.el.classList.add('boom');
      } else if (c.f) {
        var x = document.createElement('span');
        x.className = 'wrongx';
        x.textContent = '✕';
        c.el.appendChild(x);
      }
    }
    pTitle.textContent = 'بووم! باختی';
    pText.textContent = 'به مین برخوردی! زمان: ' + fa(elapsed) + ' ثانیه';
    overlay.classList.add('show');
  }

  function winGame() {
    over = true;
    stopTimer();
    for (var k = 0; k < grid.length; k++) {
      var c = grid[k];
      if (c.m && !c.f) {
        c.f = true;
        flags++;
        var f = document.createElement('span');
        f.className = 'flag';
        c.el.innerHTML = '';
        c.el.appendChild(f);
      }
    }
    updateMines();
    var prev = parseInt(store.get(cfg.key) || '', 10);
    var isRec = isNaN(prev) || elapsed < prev;
    if (isRec) store.set(cfg.key, String(elapsed));
    showBest();
    pTitle.textContent = 'بردی!';
    pText.textContent = 'همه خانه‌های امن را باز کردی — زمان: ' + fa(elapsed) + ' ثانیه' + (isRec ? ' (رکورد جدید!)' : '');
    overlay.classList.add('show');
  }

  flagBtn.addEventListener('click', function () {
    flagMode = !flagMode;
    flagBtn.textContent = 'حالت پرچم: ' + (flagMode ? 'روشن' : 'خاموش');
    flagBtn.classList.toggle('on', flagMode);
    flagBtn.setAttribute('aria-pressed', String(flagMode));
  });
  document.getElementById('again').addEventListener('click', newGame);
  document.getElementById('pagain').addEventListener('click', newGame);
  [].forEach.call(document.querySelectorAll('.lv'), function (btn) {
    btn.addEventListener('click', function () {
      var id = btn.getAttribute('data-lv');
      if (id === lvId) return;
      lvId = id;
      cfg = LV[lvId];
      [].forEach.call(document.querySelectorAll('.lv'), function (b2) {
        b2.classList.toggle('active', b2 === btn);
      });
      newGame();
    });
  });

  newGame();
})();
</script>
</body>
</html>
