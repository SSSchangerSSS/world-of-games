<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>۲۰۴۸ — World of Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: Vazirmatn, Tahoma, sans-serif; background: linear-gradient(160deg, #101a2e, #0b1220);
         color: #f3ead8; min-height: 100dvh; user-select: none; -webkit-user-select: none;
         display: flex; flex-direction: column; align-items: center; padding: 18px 12px 30px; }
  header { text-align: center; }
  header h1 { color: #d9a441; font-size: 1.55rem; letter-spacing: .5px; }
  .hud { color: #a8b3c9; margin-top: 8px; font-size: .98rem; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .hud b { color: #e8c073; }
  .btn { background: #d9a441; color: #221806; border: none; border-radius: 10px; font-weight: 700;
         font-family: inherit; font-size: 1rem; padding: 10px 20px; cursor: pointer; touch-action: manipulation; }
  .btn:active { transform: translateY(1px); }
  .btn.ghost { background: #1c2a47; color: #e8c073; border: 1px solid rgba(217,164,65,.35); }
  .btn.warn { background: #e26d5c; color: #2b0d08; }
  #newbtn { margin-top: 12px; }
  /* direction:ltr برای هم‌ترازی ستون‌های شبکه با محور فیزیکی سوایپ/کلیدها */
  #board { position: relative; direction: ltr; width: min(92vw, 440px); aspect-ratio: 1; margin-top: 10px; --u: 100px;
           background: #14203a; border: 1px solid rgba(217,164,65,.35); border-radius: 16px;
           box-shadow: 0 12px 36px rgba(0,0,0,.45); touch-action: none; }
  #bg, #tiles { position: absolute; left: 10px; top: 10px; right: 10px; bottom: 10px; }
  #bg { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 10px; }
  .cellbg { background: #1a2745; border-radius: 10px; }
  .tile { position: absolute; left: 0; top: 0; display: flex; align-items: center; justify-content: center;
          border-radius: 10px; transition: transform .12s ease-in-out; will-change: transform; z-index: 2; }
  #tiles.noanim .tile { transition: none; }
  .num { font-weight: 800; line-height: 1; font-size: calc(var(--u) * .42); animation: pop .16s ease-out; }
  .t-sm .num { font-size: calc(var(--u) * .3); }
  @keyframes pop { from { transform: scale(.35); } to { transform: scale(1); } }
  .v2{background:#ece1c6;color:#554321} .v4{background:#e8c073;color:#4b350f}
  .v8{background:#d9a441;color:#33230a} .v16{background:#3fb8af;color:#06302d}
  .v32{background:#67b98a;color:#0b2c1c} .v64{background:#e08b45;color:#3a1d05}
  .v128{background:#e26d5c;color:#fff3ec} .v256{background:#d4523d;color:#fff3ec}
  .v512{background:#b83a2c;color:#ffe9e2}
  .v1024{background:#d9a441;color:#2a1c04;box-shadow:0 0 18px rgba(217,164,65,.65)}
  .v2048{background:#e8c073;color:#2a1c04;box-shadow:0 0 26px rgba(232,192,115,.85)}
  #hint { color: #a8b3c9; font-size: .85rem; margin-top: 16px; text-align: center; max-width: 460px; line-height: 1.9; }
  #overlay { position: fixed; inset: 0; background: rgba(6,10,19,.66); display: flex; align-items: center;
             justify-content: center; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  #overlay.show { opacity: 1; pointer-events: auto; }
  .panel { background: #14203a; border: 1px solid rgba(217,164,65,.35); border-radius: 16px;
           padding: 26px 34px; text-align: center; box-shadow: 0 14px 44px rgba(0,0,0,.55); max-width: 86vw; }
  .panel h2 { color: #d9a441; font-size: 1.5rem; margin-bottom: 8px; }
  .panel p { color: #a8b3c9; margin-bottom: 18px; line-height: 1.8; }
  .row-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <h1>❋ ۲۰۴۸ ❋</h1>
  <div class="hud">امتیاز <b id="sc">۰</b> · رکورد <b id="bs">۰</b></div>
</header>
<button class="btn" id="newbtn">بازی جدید</button>
<div id="board"><div id="bg"></div><div id="tiles"></div></div>
<div id="hint">با کلیدهای جهت یا کشیدن انگشت کاشی‌ها را بلغزان؛ کاشی‌های هم‌ارزش در هر حرکت یک‌بار ادغام می‌شوند. به کاشی ۲۰۴۸ برس!</div>
<div id="overlay">
  <div class="panel">
    <h2 id="ptitle"></h2>
    <p id="ptext"></p>
    <div class="row-btns">
      <button class="btn" id="pcont">ادامه بازی</button>
      <button class="btn ghost" id="pnew">بازی جدید</button>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };
  var FD = '۰۱۲۳۴۵۶۷۸۹';
  function fa(n) { return String(n).replace(/[0-9]/g, function (c) { return FD[+c]; }); }

  var N = 4, GAP = 10;
  var boardEl = document.getElementById('board');
  var bgEl = document.getElementById('bg');
  var tilesEl = document.getElementById('tiles');
  var scEl = document.getElementById('sc');
  var bsEl = document.getElementById('bs');
  var overlay = document.getElementById('overlay');
  var pTitle = document.getElementById('ptitle');
  var pText = document.getElementById('ptext');
  var pCont = document.getElementById('pcont');
  var newBtn = document.getElementById('newbtn');

  var U = 100, grid = [], score = 0, over = false, won = false, seq = 0, lock = false;
  var best = parseInt(store.get('wog-2048-best') || '0', 10) || 0;

  (function buildBg() {
    for (var i = 0; i < N * N; i++) {
      var d = document.createElement('div');
      d.className = 'cellbg';
      bgEl.appendChild(d);
    }
  })();

  function geom() {
    U = (tilesEl.clientWidth - GAP * (N - 1)) / N;
    boardEl.style.setProperty('--u', U + 'px');
  }
  function place(el, r, c) {
    el.style.width = U + 'px';
    el.style.height = U + 'px';
    el.style.transform = 'translate(' + (c * (U + GAP)) + 'px,' + (r * (U + GAP)) + 'px)';
  }
  function setVal(t, v) {
    t.v = v;
    t.el.className = 'tile v' + (v <= 2048 ? v : 2048) + (v >= 1024 ? ' t-sm' : '');
    var s = document.createElement('span');
    s.className = 'num';
    s.textContent = fa(v);
    t.el.innerHTML = '';
    t.el.appendChild(s);
  }
  function makeTile(r, c, v) {
    var t = { v: 0, r: r, c: c, el: document.createElement('div') };
    setVal(t, v);
    place(t.el, r, c);
    tilesEl.appendChild(t.el);
    return t;
  }
  function updateHud() { scEl.textContent = fa(score); bsEl.textContent = fa(best); }

  function spawn() {
    var empt = [], r, c;
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) if (!grid[r][c]) empt.push([r, c]);
    if (!empt.length) return;
    var rc = empt[Math.floor(Math.random() * empt.length)];
    grid[rc[0]][rc[1]] = makeTile(rc[0], rc[1], Math.random() < 0.9 ? 2 : 4);
  }

  function has2048() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) if (grid[r][c] && grid[r][c].v >= 2048) return true;
    return false;
  }
  function anyMoves() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var t = grid[r][c];
      if (!t) return true;
      if (c < N - 1 && grid[r][c + 1] && grid[r][c + 1].v === t.v) return true;
      if (r < N - 1 && grid[r + 1][c] && grid[r + 1][c].v === t.v) return true;
    }
    return false;
  }

  /* حرکت استاندارد ۲۰۴۸: لغزش کامل + ادغام یک‌بار در هر حرکت */
  function move(dr, dc) {
    if (lock || over || overlay.classList.contains('show')) return;
    seq++;
    var rs = [0, 1, 2, 3], cs = [0, 1, 2, 3];
    if (dr === 1) rs = [3, 2, 1, 0];
    if (dc === 1) cs = [3, 2, 1, 0];
    var moved = false, gained = 0, dead = [], merged = [];
    rs.forEach(function (r) {
      cs.forEach(function (c) {
        var t = grid[r][c];
        if (!t) return;
        grid[r][c] = null;
        var cr = r, cc = c, tgt = null;
        for (;;) {
          var nr = cr + dr, nc = cc + dc;
          if (nr < 0 || nr >= N || nc < 0 || nc >= N) break;
          var o = grid[nr][nc];
          if (!o) { cr = nr; cc = nc; continue; }
          if (o.v === t.v && o.ms !== seq) { tgt = o; cr = nr; cc = nc; }
          break;
        }
        if (cr !== r || cc !== c) moved = true;
        if (tgt) {
          tgt.ms = seq;
          tgt.nv = t.v * 2;
          gained += tgt.nv;
          merged.push(tgt);
          place(t.el, cr, cc);
          dead.push(t);
        } else {
          grid[cr][cc] = t;
          t.r = cr; t.c = cc;
          place(t.el, cr, cc);
        }
      });
    });
    if (!moved) return;
    lock = true;
    score += gained;
    if (score > best) { best = score; store.set('wog-2048-best', String(best)); }
    updateHud();
    setTimeout(function () {
      dead.forEach(function (t) { if (t.el.parentNode) t.el.parentNode.removeChild(t.el); });
      merged.forEach(function (t) { setVal(t, t.nv); });
      spawn();
      lock = false;
      if (!won && has2048()) {
        won = true;
        showPanel('بردی!', 'به کاشی ۲۰۴۸ رسیدی! امتیاز: ' + fa(score), true);
      } else if (!anyMoves()) {
        over = true;
        showPanel('باختی!', 'دیگر حرکتی باقی نماند — امتیاز نهایی: ' + fa(score), false);
      }
    }, 135);
  }

  function showPanel(title, text, withContinue) {
    pTitle.textContent = title;
    pText.textContent = text;
    pCont.style.display = withContinue ? '' : 'none';
    overlay.classList.add('show');
  }

  function newGame() {
    tilesEl.innerHTML = '';
    grid = [];
    for (var r = 0; r < N; r++) {
      var row = [];
      for (var c = 0; c < N; c++) row.push(null);
      grid.push(row);
    }
    score = 0; over = false; won = false; seq++; lock = false;
    overlay.classList.remove('show');
    resetNewBtn();
    updateHud();
    spawn();
    spawn();
  }

  /* دکمه «بازی جدید» با تأیید درون‌خطی (بدون confirm) */
  var armT = null;
  function resetNewBtn() {
    if (armT) { clearTimeout(armT); armT = null; }
    newBtn.textContent = 'بازی جدید';
    newBtn.classList.remove('warn');
  }
  newBtn.addEventListener('click', function () {
    if (armT) {
      resetNewBtn();
      newGame();
      return;
    }
    newBtn.textContent = 'مطمئنی؟ دوباره بزن';
    newBtn.classList.add('warn');
    armT = setTimeout(resetNewBtn, 2600);
  });
  pCont.addEventListener('click', function () { overlay.classList.remove('show'); });
  document.getElementById('pnew').addEventListener('click', newGame);

  window.addEventListener('keydown', function (e) {
    var d = null;
    if (e.key === 'ArrowUp') d = [-1, 0];
    else if (e.key === 'ArrowDown') d = [1, 0];
    else if (e.key === 'ArrowLeft') d = [0, -1];
    else if (e.key === 'ArrowRight') d = [0, 1];
    if (d) { e.preventDefault(); move(d[0], d[1]); }
  });

  var tx = 0, ty = 0, tracking = false;
  boardEl.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { tracking = false; return; }
    tracking = true;
    tx = e.touches[0].clientX;
    ty = e.touches[0].clientY;
  }, { passive: true });
  boardEl.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  boardEl.addEventListener('touchend', function (e) {
    if (!tracking) return;
    tracking = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) move(0, dx > 0 ? 1 : -1);
    else move(dy > 0 ? 1 : 0, 0);
  }, { passive: true });

  window.addEventListener('resize', function () {
    geom();
    tilesEl.classList.add('noanim');
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) {
      var t = grid[r] && grid[r][c];
      if (t) place(t.el, t.r, t.c);
    }
    setTimeout(function () { tilesEl.classList.remove('noanim'); }, 80);
  });

  geom();
  newGame();
})();
</script>
</body>
</html>
